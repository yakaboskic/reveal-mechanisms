# Durable HTTP deployment: managed workflow delivery and Redis Pub/Sub only.
x-backend: &backend
  image: ${REVEAL_BACKEND_IMAGE:-reveal-workflow-backend:local}
  build:
    context: ..
    dockerfile: services/backend/Dockerfile
    target: deployment
  env_file:
    - path: ${REVEAL_RUNTIME_DIR:-../.runtime/workflow}/backend.env
      format: raw
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /work:rw,nosuid,nodev,size=1073741824,mode=1777
    - /tmp:rw,nosuid,nodev,size=67108864,mode=1777
  stop_grace_period: 120s
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
  networks: [backend]

services:
  api:
    <<: *backend
    mem_limit: 4g
    ports: ["127.0.0.1:${REVEAL_DEPLOY_API_PORT:-18001}:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=30)"]
      interval: 30s
      timeout: 35s
      start_period: 120s
      retries: 5
  bootstrap:
    <<: *backend
    profiles: [tools]
    restart: "no"
    command: [python, -m, reveal_backend.deployment, bootstrap, --apply]
  tools:
    <<: *backend
    profiles: [tools]
    restart: "no"
    command: [python, -m, reveal_backend.deployment, status]

networks:
  backend:
