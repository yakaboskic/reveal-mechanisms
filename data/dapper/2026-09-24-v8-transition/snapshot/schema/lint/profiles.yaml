# Declarative input to schema/lint/lint_provenance.py.
#
# The engine is generic: it knows how to validate nodes and edges against
# dapper.yaml, resolve references, and walk a provenance graph. It knows
# NOTHING about any particular end modality. Everything modality-specific
# lives here, so adding a modality is a data change rather than a code change.
#
# NOTE ON PREDICATES: nothing here pins predicate values. Each Edge class in
# dapper.yaml already declares its expected predicate as an `ifabsent` default
# (`Used` -> `string(prov:used)`), and the engine reads that directly, so no
# predicate is restated here. Mismatches are warnings — see `check_predicates`.

# ---------------------------------------------------------------------------
# Edge group keys
#
# A document groups edges under `{snake_case_edge_class}_edges`, so the engine
# derives `Used -> used_edges` and `HasDrsObject -> has_drs_object_edges` on
# its own. Only genuine exceptions belong here; anything absent is derived.
# Keeping this near-empty is the point — the hand-maintained map of every edge
# class is what drifts, which is how DOC_GROUPS and portal/build.py's
# EDGE_GROUPS came to disagree.
edge_group_overrides:
  # Examples and portal/build.py both use the short key, not the derived
  # `has_provenance_graph_edges`.
  HasProvenanceGraph: has_provenance_edges

# ---------------------------------------------------------------------------
# Typed edge endpoints
#
# dapper.yaml constrains `subject`/`object` only as `uriorcurie`; the intended
# types exist purely as prose on the Edge class (`description: Dataset → Agent`).
# So the schema cannot reject a `prov:wasGeneratedBy` edge pointing a Dataset at
# an Award — it validates clean. These lists transcribe that prose into
# something checkable.
#
# Endpoint constraints also accept descendants of each listed class. An edge
# class omitted here still requires both endpoints to resolve to local nodes;
# only the additional class constraints are omitted. The same type constraints
# apply to equivalent inline relationships whose targets are present locally.
edge_endpoints:
  Used:
    subject: [Activity]
    object: [File, C2M2File, Dataset, Set, GeneSet, GeneProgram, Claim, ScientificAccount, MechanisticModel, EvidenceItem, Paragraph, Proposition, ClaimScore, Nanopublication, Publication, Question, KnowledgeGap]
  WasGeneratedBy:
    subject: [Dataset, Set, GeneSet, GeneProgram, CellState, File, C2M2File, Claim, ScientificAccount, MechanisticModel, EvidenceItem, Paragraph, NanopubProvenance, Question, KnowledgeGap]
    object: [Activity]
  WasDerivedFrom:
    subject: [Dataset, Set, GeneSet, GeneProgram, File, C2M2File, Claim, ScientificAccount, MechanisticModel, EvidenceItem, Paragraph, NanopubProvenance, Question, KnowledgeGap]
    object: [Dataset, Set, GeneSet, GeneProgram, File, C2M2File, DrsObject, Claim, ScientificAccount, MechanisticModel, EvidenceItem, Paragraph, Proposition, ClaimScore, Nanopublication, Publication, Question, KnowledgeGap]
  HasDrsObject:
    subject: [Dataset]
    object: [DrsObject]
  HasFile:
    subject: [Dataset]
    object: [File, C2M2File]
  DrsRepresentation:
    subject: [File, C2M2File]
    object: [DrsObject]
  HasAgenticWorkspace:
    subject: [Activity]
    object: [AgenticWorkspace]
  HasCreator:
    subject: [Dataset, Set, GeneSet, GeneProgram, CellState, Claim, ScientificAccount, MechanisticModel, EvidenceItem, Paragraph, Question, KnowledgeGap]
    object: [Person, Organization]
  HasContributor:
    subject: [Dataset, Set, GeneSet, GeneProgram, CellState, Claim, ScientificAccount, MechanisticModel, EvidenceItem, Paragraph, Question, KnowledgeGap]
    object: [Person, Organization]
  WasAttributedTo:
    subject: [Dataset, Set, GeneSet, GeneProgram, CellState, Claim, ScientificAccount, MechanisticModel, EvidenceItem, Paragraph, NanopubProvenance, Question, KnowledgeGap]
    object: [Person, Organization]
  FundedBy:
    subject: [Dataset, Set, GeneSet, GeneProgram, CellState, Claim, ScientificAccount, MechanisticModel, EvidenceItem, Paragraph, Question, KnowledgeGap]
    object: [Award]
  IsDescribedBy:
    subject: [Dataset, Set, GeneSet, GeneProgram, CellState, Claim, ScientificAccount, MechanisticModel, EvidenceItem, Paragraph, Question, KnowledgeGap]
    object: [Publication]
  HasRecommendedCitation:
    subject: [Dataset, Set, GeneSet, GeneProgram, CellState, Claim, ScientificAccount, MechanisticModel, EvidenceItem, Paragraph, Question, KnowledgeGap]
    object: [RecommendedCitation]
  HasDataUseTerm:
    subject: [Dataset, Set, GeneSet, GeneProgram, CellState]
    object: [DataUseTerm]
  HasLineageStep:
    subject: [Activity]
    object: [LineageStep]
  HasMirrorProvenance:
    subject: [Dataset, Set, GeneSet, GeneProgram, CellState, Claim, ScientificAccount, MechanisticModel, EvidenceItem, Paragraph, Question, KnowledgeGap]
    object: [MirrorProvenance]
  PackagedAs:
    subject: [Dataset]
    object: [RoCratePackage]
  HasWorkflowProvenance:
    subject: [Dataset, Activity]
    object: [BioComputeObject]

# ---------------------------------------------------------------------------
# End-modality profiles
#
# One document per instantiation: the end result object plus all the provenance
# around how it was generated. Each profile names the terminal node and the
# provenance it must carry.
#
# `terminal.class` is matched against end results after excluding resources
# consumed by prov:used, named as prov:wasDerivedFrom sources, or included as
# prov:hadMember members. A class may be a string or list of alternatives. This includes
# both reified edges and schema-declared inline relationships. Two profiles
# must still never share a terminal class.
profiles:

  bottom-line-result:
    title: Bottom-line result
    description: >-
      A final variant-level summary-statistics result from a genetic
      association meta-analysis. There is no dedicated bottom-line class — the
      result is a Dataset, distinguished by its name/description — and
      its bytes may be exposed through ordinary Files or registered DrsObjects.
      Multi-file Spark outputs are datasets whose file membership should be
      captured by an actual manifest, rather than by variant-level nodes.
    canonical_example: schema/examples/example_bottom_line_result.yaml
    terminal:
      class: Dataset
      # Exactly one final Dataset. Other Datasets may appear as inputs or
      # derivation sources in that result's provenance.
      min: 1
      max: 1
    required_edges:
      - group: was_generated_by_edges
        object_class: Activity
        min: 1
        severity: error
        why: >-
          A bottom-line result with no generating Activity carries no
          provenance at all — it is the one edge the document exists for.
      - any_of:
          - group: has_file_edges
            object_class: [File, C2M2File]
          - group: has_drs_object_edges
            object_class: DrsObject
        min: 1
        severity: warning
        why: >-
          The result should identify its concrete files or a registered DRS
          representation. A location, checksum, and immutable version must
          still be supplied when known; the relationship alone proves none of them.
    activities_require_inputs: warning

  geneset:
    title: Gene set or collection
    description: >-
      A named gene set or a collection produced by a pipeline over files,
      as emitted by the dig.geneset converter. Both extend Set and take reified
      Used / WasGeneratedBy edges as any other collection.
    canonical_example: schema/examples/example_geneset_graph.yaml
    terminal:
      class: [GeneSet, GeneSetCollection]
      min: 1
      # No max: one converter run legitimately emits many gene sets sharing a
      # single provenance subgraph, unlike a bottom-line result.
      max: null
    required_edges:
      - group: was_generated_by_edges
        object_class: Activity
        min: 1
        severity: error
        why: >-
          The gene set must name the Activity that produced it, or the pipeline
          run behind it is unrecoverable.
    # An Activity with no declared inputs is either a genuine raw-data producer
    # or a step whose inputs were dropped on the way in. The second is the
    # common case and is invisible without this check.
    activities_require_inputs: warning

  scientific-account:
    title: Scientific account
    description: >-
      A structured account with framing, context, claims, optional conclusions,
      and explicit evidence uses. Textual Paragraph expressions may accompany it.
    canonical_example: schema/examples/example_scientific_account.yaml
    terminal:
      class: ScientificAccount
      min: 1
      max: 1
    required_edges:
      - group: was_generated_by_edges
        object_class: Activity
        min: 1
        severity: error
        why: The account must identify its assembly or recording activity.
    activities_require_inputs: warning
    # Saved textual expressions point to their account, not the other way round.
    reverse_context_predicates: [dapper:scientific_account]
