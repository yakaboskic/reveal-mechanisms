# A single GeneProgram instance — the single-cell counterpart of
# example_geneset.yaml. Populated from a real gene-by-program NMF loading
# matrix to demonstrate `member_weights`: `members[i]` and
# `member_weights[i]` describe the same gene, positionally paired. Contrast
# with example_geneset.yaml, a static curated annotation with no weights.
# Also carries a `quality_score` (GeneProgramQualityScore) assessment, an
# optional field on GeneProgram — a composite value plus `components`
# (stability, confounders, validity).
#
#   uv run --with linkml linkml-validate \
#     -s ../dapper.yaml -C GeneProgram example_gene_program.yaml
#
# Referenced by example_cell_state.yaml and example_cell_graph.yaml via
# `has_program`.

