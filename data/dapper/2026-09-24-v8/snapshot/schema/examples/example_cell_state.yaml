# A single CellState instance — the cellular phenotype defined by the
# combination of GenePrograms active in a cell (or cell population), as
# distinct from a cell TYPE (a Cell Ontology class naming lineage rather than
# functional state). Populated from a real curated record (pancreatic ductal
# epithelial identity) to show the internal cell-state marker-curation schema
# fields in use. `has_program` points at three GenePrograms (Factor_1/2/3 of
# the same NMF loading matrix) defined in example_cell_graph.yaml — an
# illustrative pairing to exercise multi-program `has_program`, not a real
# biological claim that these factors constitute ductal identity. Factor_1
# and Factor_2 carry a `quality_score` (GeneProgramQualityScore) assessment;
# Factor_3 omits it to show the field is optional.
#
# `was_attributed_to` (ProvenancedResource mixin) names the curator directly —
# this record has no generating Activity, unlike the GenePrograms it points
# at, which are wired to an illustrative NMF Activity in example_cell_graph.yaml.
#
#   uv run --with linkml linkml-validate \
#     -s ../dapper.yaml -C CellState example_cell_state.yaml

