# Illustrative DAPPER graph for a GWAS "bottom line" result: one Dataset
# generated by one Activity and backed by one manifest DrsObject. This is a
# reference document (a mixed set of node types), not a single-class
# instance; validate individual nodes with `linkml-validate -C <ClassName>`
# if desired.
#
# All values below are illustrative, not transcribed from a real study.
# There is no dedicated "bottom line" node class — a bottom-line result is
# just a Dataset, distinguished by its `name`/`description` like any other
# — and the multi-file Spark output is represented as a single
# manifest-backed DrsObject (has_drs_object) rather than as individual
# variant-level nodes. See
# notes/gptRecommendations/bottom-line-provenance-recommendations.md for why:
# an S3 prefix of per-partition Spark output is a multi-file dataset, so
# versioning is manifest-based, not single-object or row-level, and the
# doc's own recommended mapping reuses Dataset/Activity/DrsObject directly
# rather than introducing a new class.
#
# Regenerate after re-minting: see schema/examples/README.md
#
# Nothing here is transcribed from a real analysis run, so all 3 nodes are
# listed below.
