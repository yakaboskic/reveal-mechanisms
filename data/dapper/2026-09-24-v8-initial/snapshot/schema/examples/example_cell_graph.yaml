# ---- Reified provenance edges — identical shape to example_geneset_graph.yaml ----
# "data input" -> Used (prov:used); Activity -> GeneProgram is "data output" ->
# WasGeneratedBy (prov:wasGeneratedBy). No CellState edge here: a curated
# CellState has no generating Activity, which is why its provenance is the
# inline `was_attributed_to` above instead.
used_edges:
  - subject: dapper:Activity.Z0xTTAV-xCqHZ-ifRQGtAgHWjkOWrSw4
    predicate: prov:used
    object: dapper:C2M2File.qAIdvUZaaCZRVtYboKEdMKkc5Ctevvq2
    edge_role: data_input

was_generated_by_edges:
  - subject: dapper:GeneProgram.c3BuK-YYanBJtDBVs3iPkQCWKVcX33Sv
    predicate: prov:wasGeneratedBy
    object: dapper:Activity.Z0xTTAV-xCqHZ-ifRQGtAgHWjkOWrSw4
  - subject: dapper:GeneProgram.VzJ5ojYPNG2Sl8TW8tOLVK5St7z-zR5e
    predicate: prov:wasGeneratedBy
    object: dapper:Activity.Z0xTTAV-xCqHZ-ifRQGtAgHWjkOWrSw4
  - subject: dapper:GeneProgram.lpj2F2zzvRDPRdtuOKl3_Z8t1tNkYVKN
    predicate: prov:wasGeneratedBy
    object: dapper:Activity.Z0xTTAV-xCqHZ-ifRQGtAgHWjkOWrSw4
