# A minimal graph-shaped DAPPER document, preloaded by the portal alongside
# the geneset and claim-provenance graphs. Wrapped in the group-keyed shape
# the portal (and mint.py) expect (`gene_programs:` / `cell_states:` lists),
# rather than bare single-instance documents. This is a reference document
# (mixed classes), not a single-class instance; validate the individual
# nodes with `linkml-validate -C <ClassName>` if desired.
#
# All nodes are illustrative — none is transcribed from a real pipeline run,
# unlike the geneset graph. The CellState content is a real curated record
# (pancreatic ductal epithelial identity); the three GenePrograms are real
# NMF loading output (Factor_1/2/3 of the same gene-by-program matrix), all
# feeding into that one CellState via `has_program`. The pairing is
# illustrative only, to exercise multi-program `has_program` and
# `member_weights` together — not a biological claim that these factors
# constitute ductal identity. example_gene_program.yaml is Factor_1 by
# itself, extracted verbatim (same id) as one of the three shown here.
#
# Factor_1 and Factor_2 also carry a `quality_score` (GeneProgramQualityScore)
# assessment — a composite value plus `components` (stability, confounders,
# validity); Factor_3 deliberately omits it to show the field is optional.
#
# PROVENANCE — the same two-branch shape as example_claim_provenance_trace.yaml,
# applied to single-cell nodes instead of a gene set:
#
#   machine-generated (GeneProgram): C2M2File (expression matrix)
#     -> [Activity: nmf_decomposition]      prov:used / prov:wasGeneratedBy
#       -> GeneProgram x3 (Factor_1/2/3)
#   This is the SAME join GeneSet uses — GeneProgram grounds via `is_a: Set`
#   (prov:Collection), the same as GeneSet, so it takes the identical
#   Used/WasGeneratedBy reified edges rather than a new vocabulary.
#
#   human-curated (CellState): no Activity at all — `was_attributed_to`
#   (a ProvenancedResource slot, the same mixin GeneProgram/GeneSet carry)
#   names the curator directly, the same shape the composite hypothesis in
#   example_claim_provenance_trace.yaml uses for a claim argued by a person
#   rather than generated by a pipeline.
#
# The Activity and its input file are illustrative — no real NMF run backs
# them; the shape is what is being demonstrated.

_illustrative:
  - dapper:GeneProgram.c3BuK-YYanBJtDBVs3iPkQCWKVcX33Sv
  - dapper:GeneProgram.VzJ5ojYPNG2Sl8TW8tOLVK5St7z-zR5e
  - dapper:GeneProgram.lpj2F2zzvRDPRdtuOKl3_Z8t1tNkYVKN
  - dapper:CellState.IHQJzYsI_9y0ko81oIgyNSgdi15cOn85
  - dapper:C2M2File.qAIdvUZaaCZRVtYboKEdMKkc5Ctevvq2
  - dapper:Activity.Z0xTTAV-xCqHZ-ifRQGtAgHWjkOWrSw4

# ---- Illustrative input to the NMF run (dig.geneset-style C2M2File) ----
c2m2_files:
  - id: dapper:C2M2File.qAIdvUZaaCZRVtYboKEdMKkc5Ctevvq2
    name: pancreas_ductal_scrna_expression_matrix.h5ad
    filename: pancreas_ductal_scrna_expression_matrix.h5ad
    local_id: s3://example-bucket/pancreas/scrna/pancreas_ductal_expression_matrix.h5ad

# ---- The NMF decomposition that produced the three GeneProgram factors ----
activities:
  - id: dapper:Activity.Z0xTTAV-xCqHZ-ifRQGtAgHWjkOWrSw4
    name: nmf_decomposition_pancreas_ductal
    activity_type: nmf_decomposition
    entrypoint: cnmf factorize --k 3
    code_version: "<cnmf-git-sha>"

