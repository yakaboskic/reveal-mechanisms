cell_states:
  - id: dapper:CellState.IHQJzYsI_9y0ko81oIgyNSgdi15cOn85
    name: Ductal epithelial identity
    organism: human
    has_program:
      - dapper:GeneProgram.c3BuK-YYanBJtDBVs3iPkQCWKVcX33Sv
      - dapper:GeneProgram.VzJ5ojYPNG2Sl8TW8tOLVK5St7z-zR5e
      - dapper:GeneProgram.lpj2F2zzvRDPRdtuOKl3_Z8t1tNkYVKN

    # human-curated, not machine-generated — no Activity, just the curator
    # this record is attributed to (ProvenancedResource.was_attributed_to,
    # the same slot a NanopubProvenance uses for a person-argued claim).
    was_attributed_to:
      - orcid:0000-0002-1825-0097

    # --- internal cell-state marker-curation schema ---
    allow_hard_call: false
    biological_description: Ductal epithelial identity represents a curated identity or subtype marker program within Ductal cell.
    cell_type_id: ductal
    cell_type_label: Ductal cell
    curation_notes: Canonical pancreatic ductal epithelial marker panel.
    curation_version: "2026-06-04"
    display_name: Ductal epithelial identity
    gene_expression_caveat: Expression in an identity state usually indicates association with cells that strongly express identity markers; it does not prove the gene defines the identity state.
    gene_expression_followup: Compare expression across related cell types and check whether the gene is broadly expressed or specific to this identity program.
    gene_expression_interpretation: If your gene is enriched here, it may be associated with the core identity, subtype identity, or differentiated function of Ductal cell.
