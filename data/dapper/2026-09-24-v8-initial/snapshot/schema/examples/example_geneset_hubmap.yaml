activities:
  - id: dapper:Activity.TB22OFDq_3yXY8354yU1xUulI6dveVYP
    name: Prepare HuBMAP ASCT+B term-to-gene table
    description: Prepare the HuBMAP ASCT+B term-to-gene table using human gene information and ASCT+B reference tables, as specified by the recorded command.
    command: python -m geneset_extractors.cli workflows hubmap_asctb --human_gene_info /humgen/diabetes2/users/ryank/CFDE/geneset_extractors/harmonizome/data/human_gene_info --out_dir /humgen/diabetes2/users/ryank/geneset_extractions/v2.0_dapper-0.2.0-a0/HuBMAP/hubmap_all_models/genesets/all_signatures/models/HZ1/workflow --raw_asctb_dir /humgen/diabetes2/users/ryank/data/HuBMAP/ASCT+B/v2.2
    script_url: https://github.com/flannick/dig-gene-set-extractors
    repo_url: https://github.com/flannick/dig-gene-set-extractors
    code_version: e5f4dc783513ff23547f35bce9b4cd3ceea97c0f
    entrypoint: geneset-extractors workflows hubmap_asctb
  - id: dapper:Activity.Pwgnx27Y7cZisa9x1ch6SsBFGulpNiRv
    name: Generate HuBMAP ASCT+B gene-set library
