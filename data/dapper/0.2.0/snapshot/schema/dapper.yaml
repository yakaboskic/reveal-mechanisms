  Award:
    is_a: HashableNode
    class_uri: schema:MonetaryGrant
    exact_mappings:
      - FRAPO:Grant
    close_mappings:
      - schema:Grant
    aliases:
      - grant
      - award
      - funding reference
    description: >-
      A grant/award that funded the dataset. Corresponds to a DataCite
      kernel-4 `fundingReference`; RDF grounding is FRAPO (the Funding,
      Research Administration and Projects Ontology), since kernel-4 itself is
      an XML Schema with no RDF terms.
    annotations:
      dapper:authoritative: true
      dapper:mirror_mutable: false
      dapper:source_standard: DataCite kernel-4 fundingReference
    attributes:
      funder_name:
        is_a: literal
        mixins: [hashable]
        slot_uri: FRAPO:hasFundingAgency
        close_mappings:
          - schema:funder
          - FRAPO:FundingAgency
        aliases:
          - funderName
        description: Name of the funding agency (e.g. National Institutes of Health).
      funder_identifier:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        slot_uri: schema:identifier
        close_mappings:
          - DataCite:FunderIdentifier
        aliases:
          - funderIdentifier
        description: Identifier for the funding agency (e.g. a Crossref Funder ID or ROR).
      funder_identifier_type:
        is_a: literal
        mixins: [hashable]
        range: FunderIdentifierTypeEnum
        close_mappings:
          - DataCite:usesIdentifierScheme
        aliases:
          - funderIdentifierType
        description: Scheme used by `funder_identifier`.
      award_number:
        is_a: literal
        mixins: [hashable]
        slot_uri: FRAPO:hasGrantNumber
        close_mappings:
          - schema:identifier
        aliases:
          - awardNumber
          - grant number
        description: The grant/award number.
      award_uri:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        slot_uri: schema:url
        aliases:
          - awardURI
        description: URL to the award's record (e.g. an NIH RePORTER project page).
      award_title:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:title
        aliases:
          - awardTitle
        description: Title of the funded award/project.
      grant_administering_institute:
        is_a: literal
        mixins: [hashable]
        aliases:
          - administering IC
        description: NIH institute/center administering the grant (e.g. NHLBI).

  Publication:
    is_a: HashableNode
    class_uri: schema:ScholarlyArticle
    exact_mappings:
      - fabio:ResearchPaper
    close_mappings:
      - schema:CreativeWork
      # Cross-walk. DISMECH's PublicationReference is richer on USE
      # (which deep-research output cited it, and which claims it supports)
      # and thinner on IDENTITY (a bare PMID). This class is the
      # identity side; the use side belongs on the edge to the publication.
      - dismech:PublicationReference
      - dctypes:Text
    aliases:
      - paper
      - article
      - primary publication
    description: A publication describing or related to the dataset.
    annotations:
      dapper:authoritative: true
      dapper:mirror_mutable: false
    attributes:
      title:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:title
        exact_mappings:
          - schema:name
        description: Title of the publication.
      doi:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        slot_uri: schema:identifier
        close_mappings:
          - DataCite:ResourceIdentifier
        aliases:
          - DOI
        description: Digital Object Identifier for the publication.
      pmid:
        is_a: literal
        mixins: [hashable]
        slot_uri: fabio:hasPubMedId
        aliases:
          - PMID
          - PubMed ID
        description: PubMed identifier.
      citation:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:bibliographicCitation
        close_mappings:
          - schema:citation
        description: Formatted bibliographic citation for the publication.
      relationship_type:
        is_a: literal
        mixins: [hashable]
        range: PublicationRelationshipEnum
        close_mappings:
          - dcterms:relation
        aliases:
          - relationType
        annotations:
          dapper:source_standard: DataCite kernel-4 relationType
        description: How this publication relates to the dataset (e.g. is_described_by).

  License:
    is_a: HashableNode
    class_uri: dcterms:LicenseDocument
    exact_mappings:
      - spdx:License
    close_mappings:
      - schema:license
    aliases:
      - licence
      - terms of use
    description: License and usage terms for the dataset.
    attributes:
      url:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        slot_uri: schema:url
        close_mappings:
          - dcterms:license
        description: URL to the license text.
      usage_terms:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:rights
        close_mappings:
          - schema:usageInfo
        aliases:
          - usageTerms
        description: Human-readable usage terms / obligations.

  Activity:
    is_a: HashableNode
    mixins:
      - PortalLinked
      - AncestryContext
      - TraitContext
    class_uri: prov:Activity
    close_mappings:
      - schema:Action
      # Cross-walk. DISMECH's CurationEvent (curation_timestamp /
      # curation_model / curation_action / curation_description) is a homegrown
      # mini-PROV for AI-assisted curation. This PROV-O Activity subsumes it:
      # curation_model -> an npx:SoftwareAgent attributed via the provenance
      # graph, the rest -> generated_at_time / command / description.
      - dismech:CurationEvent
    aliases:
      - process
      - generation activity
      - AnalysisType
    description: >-
      A PROV activity that generated or packaged the returned result
      (e.g. NIH MCP Gateway dataset packaging, or a dig.geneset AnalysisType /
      converter step). The executable-detail attributes below map the
      dig.geneset `analysis{}` block; richer structured parameters/environment
      can be carried by a linked BioComputeObject.
    attributes:
      description:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:description
        exact_mappings:
          - schema:description
      activity_type:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:type
        description: e.g. MCPResourceSerialization.
      command:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - schema:command
        annotations:
          dapper:source_standard: dig.geneset analysis.command
        description: The canonical (replay) command that ran this activity.
      observed_command:
        is_a: literal
        mixins: [hashable]
        annotations:
          dapper:source_standard: dig.geneset analysis.observed_command
        description: The original runtime command captured, if different from replay.
      script_url:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        close_mappings:
          - schema:codeRepository
        annotations:
          dapper:source_standard: dig.geneset analysis.script_url
        description: URL to the script/notebook implementing this activity.
      repo_url:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        close_mappings:
          - schema:codeRepository
        description: Source code repository URL.
      code_version:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - schema:softwareVersion
        aliases:
          - version
          - git_commit
        annotations:
          dapper:source_standard: dig.geneset analysis.version
        description: Version or git commit of the code that ran.
      entrypoint:
        is_a: literal
        mixins: [hashable]
        annotations:
          dapper:source_standard: dig.geneset analysis.environment.entrypoint
        description: CLI/module entrypoint invoked.
      container_image:
        is_a: literal
        mixins: [hashable]
        annotations:
          dapper:source_standard: dig.geneset analysis.environment.container_image
        description: Container image the activity ran in, if any.
      software_name:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - schema:SoftwareApplication
          - prov:SoftwareAgent
        aliases:
          - software
        description: Name of the software that performed the activity.
      software_version:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - schema:softwareVersion
        description: Version of the software that performed the activity.
      generated_at_time:
        is_a: literal
        mixins: [unhashable]  # temporal
        range: datetime
        slot_uri: prov:generatedAtTime
        close_mappings:
          - schema:dateCreated
        aliases:
          - generatedAtTime
        description: When the activity ran.
      has_lineage_step:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: dcterms:hasPart
        close_mappings:
          - prov:hadMember
        description: LineageStep CURIEs making up this activity's ordered provenance lineage.
      has_agentic_workspace:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        description: >-
          AgenticWorkspace id(s) from which this activity can be re-run by an
          AI agent. Complements `command` / `container_image`: those are the
          machine replay path, this is the agentic one. Multivalued because the
          same analysis may be reproducible in more than one workspace.

  # ======================================================================
  # BLOCK — AGENTIC REPLAY. `AgenticWorkspace` is the workspace and prompt
  # an AI agent can use to re-run an Activity, alongside the machine replay
  # path (`command` / `container_image` / `code_version`) rather than
  # instead of it — a prompt is not a deterministic replay mechanism.
  # ======================================================================

  AgenticWorkspace:
    is_a: HashableNode
    class_uri: prov:Plan
    description: >-
      A workspace in which an AI agent can re-run an Activity, plus the prompt
      that asks it to. This is the agentic counterpart of the executable
      provenance an Activity already carries: `command` and `container_image`
      tell a machine how to replay a step, while `regeneration_prompt` and
      `workspace_url` tell an agent how to.

      It is typed `prov:Plan` because that is what it is in PROV terms — a
      description of intended execution, not the execution itself. The run
      remains the Activity; this is the recipe the agent follows. Keeping them
      separate matters: re-running a plan produces a NEW Activity, and
      conflating the two would make a regenerated result indistinguishable from
      the original.

      WARNING ON REPRODUCIBILITY. A prompt is not a deterministic replay
      mechanism. The same prompt, workspace, and model can yield a different
      result run to run. Treat `regeneration_prompt` as documentation of intent
      that a human or agent can act on, NOT as a guarantee of bit-identical
      output — that is what `command` plus `container_image` plus
      `code_version` are for. Record the model and version actually used so a
      divergent re-run can at least be explained.
    attributes:
      workspace_url:
        is_a: literal
        mixins: [unhashable]  # environmental
        range: uri
        slot_uri: schema:url
        description: >-
          Resolvable URL for the workspace — where a person or agent goes to
          open it. In the example of akleao this is a fork URL,
          `https://www.akleao.com/fork/<slug-id>`: one shareable link that
          opens the workspace, rather than a path through project and branch
          ids. Required in spirit: a workspace nobody can reach is not
          provenance, it is a note.
      workspace_key:
        is_a: literal
        mixins: [hashable]
        description: >-
          The hosting platform's own identifier for the workspace, when it
          differs from this node's `id` — for an akleao fork, the slug in its
          URL.
      platform:
        is_a: literal
        mixins: [unhashable]  # environmental
        description: >-
          The system hosting the workspace, e.g. "akleao", "Claude Code".
      regeneration_prompt:
        is_a: literal
        mixins: [hashable]
        description: >-
          The prompt that asks an agent to regenerate this analysis. Write it
          self-contained: an agent opening the workspace cold should be able to
          act on it without the surrounding conversation.
      agent_model:
        is_a: literal
        mixins: [hashable]
        description: >-
          Model that ran, or is expected to run, the prompt (e.g.
          "claude-fable-5"). Recorded so a divergent re-run can be explained.
      agent_role:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: >-
          The software agent acting in this workspace — an npx:SoftwareAgent,
          which is also how a nanopublication attributes an assertion to a
          non-human author.
        close_mappings:
          - prov:wasAssociatedWith
      last_run:
        is_a: literal
        mixins: [unhashable]  # temporal
        range: datetime
        description: When the prompt was last executed in this workspace.

  LineageStep:
    is_a: HashableNode
    close_mappings:
      - prov:Activity
    aliases:
      - provenance step
      - lineage entry
    description: One ordered step in a dataset's provenance lineage.
    attributes:
      step:
        is_a: literal
        mixins: [hashable]
        range: integer
        close_mappings:
          - schema:position
        aliases:
          - order
        description: Ordinal position of this step within the lineage.
      activity:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - prov:Activity
        description: What happened in this step.
      responsible_party:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - prov:wasAssociatedWith
        description: Party responsible for this step (name or CURIE).

  RecommendedCitation:
    is_a: HashableNode
    related_mappings:
      - dcterms:bibliographicCitation
    aliases:
      - citation
      - how to cite
    description: The recommended human-readable citation and its required elements.
    annotations:
      dapper:authoritative: true
      dapper:mirror_mutable: false
    attributes:
      citation_text:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:bibliographicCitation
        close_mappings:
          - schema:citation
        description: The recommended human-readable citation text.
      required_elements:
        is_a: literal
        mixins: [hashable]
        multivalued: true
        description: Elements a compliant citation must include.

  MirrorProvenance:
    is_a: HashableNode
    class_uri: prov:Entity
    close_mappings:
      - prov:Bundle
    aliases:
      - mirror record
      - cache provenance
    description: >-
      Provenance appended by a mirror/cache. APPEND-ONLY: a mirror may add a
      MirrorProvenance record but must never rewrite authoritative NIH
      provenance (see the mirroring invariant at the top of this schema).
    annotations:
      dapper:mirror_mutable: true
      dapper:append_only: true
    attributes:
      mirror_provider:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - prov:Agent
        description: e.g. OpenAI, Anthropic, Google, Microsoft, AWS.
      mirror_region:
        is_a: literal
        mixins: [hashable]
        description: Geographic/hosting region of the mirror (e.g. us-west-1).
      synced_from:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - prov:wasDerivedFrom
        description: Source system the object was synced from (e.g. nih-mcp-gateway).
      sync_time:
        is_a: literal
        mixins: [unhashable]  # temporal
        range: datetime
        close_mappings:
          - prov:generatedAtTime
        description: When the mirror last synced this object.
      source_manifest_hash:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - spdx:checksum
        description: sha256 of the authoritative source manifest.
      mirror_object_hash:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - spdx:checksum
        description: sha256 of the mirrored object.

  # ======================================================================
  # NODE classes — ADDITIONS
  # (best-effort interpretation ahead of the final upstream schema)
  # ======================================================================

  DrsObject:
    is_a: HashableNode
    exact_mappings:
      - dcat:Distribution
    close_mappings:
      - schema:DataDownload
    aliases:
      - DRS object
      - drs_object
      - file object
    description: >-
      GA4GH DRS object identity for a dataset file/object. GA4GH DRS is an
      OpenAPI/JSON specification with no RDF vocabulary, so this class carries
      no DRS class_uri — it is grounded in DCAT/schema.org instead, with the
      DRS field names preserved as aliases. A DRS object can describe a single
      blob or a bundle, so DrsObject remains separate from File. File links to
      a blob representation through drs_representation; Dataset links to its
      distributions through has_drs_object. This compact profile does not yet
      model DRS bundle contents.
    annotations:
      dapper:source_standard: GA4GH DRS v1.x DrsObject
    attributes:
      drs_id:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - schema:identifier
        description: GA4GH DRS object identifier.
      self_uri:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        close_mappings:
          - dcat:accessURL
        aliases:
          - self_uri
        description: The drs:// self URI.
      size:
        is_a: literal
        mixins: [hashable]
        range: integer
        slot_uri: dcat:byteSize
        close_mappings:
          - schema:contentSize
        description: Size of the object in bytes.
      checksum_sha256:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - spdx:checksum
        aliases:
          - sha256
        description: Hex SHA-256 checksum of the object.
      mime_type:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcat:mediaType
        close_mappings:
          - schema:encodingFormat
        aliases:
          - mediaType
        description: MIME type of the object.
      access_methods:
        is_a: literal
        mixins: [hashable]
        multivalued: true
        close_mappings:
          - dcat:accessService
        description: Access method descriptors (e.g. s3, gs, https).

  File:
    is_a: HashableNode
    close_mappings:
      - prov:Entity
      - schema:MediaObject
    aliases:
      - file
      - file node
    description: >-
      A single file used or generated by an Activity, including local,
      intermediate, and published artifacts. Input, intermediate, and output
      are roles established by Used and WasGeneratedBy edges, not separate
      file types. No C2M2 registration or DRS service is required. C2M2File
      specializes this class with C2M2 identifiers and portal metadata.
    attributes:
      description:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:description
        exact_mappings:
          - schema:description
        description: Free-text description of the file.
      filename:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - schema:name
        description: The file's name.
      md5:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - spdx:checksum
        description: Base64-encoded MD5 checksum of the file.
      sha256:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - spdx:checksum
        description: Hex SHA-256 checksum of the file.
      size_in_bytes:
        is_a: literal
        mixins: [hashable]
        range: integer
        slot_uri: dcat:byteSize
        close_mappings:
          - schema:contentSize
        description: Size of the file in bytes.
      mime_type:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcat:mediaType
        close_mappings:
          - schema:encodingFormat
        description: MIME type of the file.
      location:
        is_a: literal
        mixins: [unhashable]  # hosting/workspace location
        annotations:
          dapper:uri_or_path: true
        description: >-
          Current filesystem path, retrieval URI, or document-declared CURIE
          (e.g. /work/intermediate.tsv or s3://bucket/intermediate.tsv).
          Moving the file does not change its
          DAPPER identity. This is distinct from C2M2File.local_id, which is
          the source system's identifier and retains its hashable semantics.
      drs_representation:
        is_a: relationship
        mixins: [unhashable]  # optional service registration
        range: uriorcurie
        multivalued: true
        slot_uri: dapper:drsRepresentation
        description: >-
          DrsObject records exposing this file's bytes as a DRS blob. A bundle
          containing the file is not a representation of this single file.
          Registering the file with a DRS service does not change its DAPPER
          identity. A DRS checksum must agree with the file checksum when both
          describe the same bytes using the same algorithm and encoding.

  C2M2File:
    is_a: File
    mixins:
      - PortalLinked
    exact_mappings:
      - dcat:Distribution
    close_mappings:
      - schema:DataDownload
    aliases:
      - C2M2 file
    description: >-
      A File described by CFDE C2M2 (Crosscut Metadata Model) properties in a
      dig.geneset provenance graph. Inherits generic file metadata from File;
      adds C2M2 identifiers and portal links. C2M2 is a tabular metadata model
      with no RDF vocabulary, so this class carries no C2M2 class_uri — it is
      grounded in DCAT/schema.org, with the C2M2 field names preserved as
      attribute names and dapper:source_standard annotations.
    annotations:
      dapper:source_standard: CFDE C2M2 file
    slot_usage:
      filename:
        annotations:
          dapper:source_standard: C2M2 filename
      md5:
        annotations:
          dapper:source_standard: C2M2 md5
      sha256:
        annotations:
          dapper:source_standard: dig.geneset input.files[].sha256
      size_in_bytes:
        annotations:
          dapper:source_standard: C2M2 size_in_bytes
    attributes:
      persistent_id:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - DataCite:hasIdentifier
        annotations:
          dapper:source_standard: C2M2 persistent_id
        description: C2M2 persistent identifier (UUID).
      local_id:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        annotations:
          dapper:source_standard: C2M2 local_id
        description: >-
          Source-assigned identifier retained from a C2M2 record, represented
          here as a URI or CURIE. Put current storage paths in inherited
          location instead. Native C2M2 local_id suffixes require their source
          namespace to form this reference; this profile does not model that
          two-column key separately.
      c2m2_uuid:
        is_a: literal
        mixins: [hashable]
        aliases:
          - _uuid
        annotations:
          dapper:source_standard: C2M2 _uuid
        description: Internal C2M2 UUID for the file node.

  DataUseTerm:
    is_a: HashableNode
    broad_mappings:
      - DUO:0000001      # data use permission
      - DUO:0000017      # data use modifier
    aliases:
      - data use limitation
      - consent code
      - DUO term
    description: >-
      A Data Use Ontology (DUO) term constraining permitted use of the dataset.
      A term is either a data use permission (child of DUO:0000001) or a data
      use modifier (child of DUO:0000017); use `permission` / `modifier`
      accordingly. Models the `access.data_use_limitations` slot.
    attributes:
      duo_id:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        close_mappings:
          - schema:identifier
        aliases:
          - DUO ID
        description: DUO term CURIE (e.g. DUO:0000042).
      duo_label:
        is_a: literal
        mixins: [hashable]
        slot_uri: rdfs:label
        description: Human-readable DUO term label (e.g. "general research use").
      permission:
        is_a: literal
        mixins: [hashable]
        range: DataUsePermissionEnum
        broad_mappings:
          - DUO:0000001
        description: The primary data use permission, if this term is a permission.
      modifier:
        is_a: literal
        mixins: [hashable]
        range: DataUseModifierEnum
        broad_mappings:
          - DUO:0000017
        description: The data use modifier, if this term is a modifier.

  RoCratePackage:
    is_a: HashableNode
    close_mappings:
      - schema:Dataset
      - dcat:Dataset
    aliases:
      - RO-Crate
      - research object crate
    description: >-
      RO-Crate packaging descriptor for the dataset. RO-Crate expresses itself
      in schema.org terms rather than a vocabulary of its own, so this class is
      grounded in schema.org/DCAT.
    annotations:
      dapper:source_standard: RO-Crate 1.1
    attributes:
      conforms_to:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        slot_uri: dcterms:conformsTo
        aliases:
          - conformsTo
        description: RO-Crate spec/profile the crate conforms to.
      ro_crate_metadata_ref:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        close_mappings:
          - schema:mainEntity
        description: Reference to the ro-crate-metadata.json descriptor.
      root_dataset_ref:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        close_mappings:
          - schema:about
        description: Reference to the crate's root Dataset node.

  BioComputeObject:
    is_a: HashableNode
    close_mappings:
      - prov:Plan
      - schema:HowTo
    aliases:
      - BCO
      - IEEE 2791 object
    description: >-
      Executable bioinformatics workflow provenance (BioCompute Object /
      IEEE 2791). Domain slots reference structured 2791 domains. IEEE 2791 is
      published as a JSON Schema (w3id.org/ieee/ieee-2791-schema redirects to
      the IEEE GitLab schema repo), not an RDF vocabulary, so this class
      carries no BCO class_uri; it is grounded in PROV/schema.org with the
      2791 domain names preserved as attribute names.
    annotations:
      dapper:source_standard: IEEE 2791-2020 (BioCompute Object)
    attributes:
      bco_id:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        close_mappings:
          - schema:identifier
        description: Persistent identifier for the BioCompute Object.
      bco_spec_version:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - dcterms:conformsTo
        description: IEEE 2791 spec version this object conforms to.
      etag:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - spdx:checksum
        description: Checksum/etag over the BCO content.
      provenance_domain:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: Reference to the BCO's provenance domain (contributors, review, dates).
      usability_domain:
        is_a: literal
        mixins: [hashable]
        multivalued: true
        description: Free-text usability notes describing the workflow's purpose.
      description_domain:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: Reference to the BCO's description domain (pipeline steps, keywords, platform).
      execution_domain:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: Reference to the BCO's execution domain (script, software prerequisites, environment).
      io_domain:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: Reference to the BCO's I/O domain (input and output files).
      parametric_domain:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: Reference to the BCO's parametric domain (runtime parameters).
      error_domain:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: Reference to the BCO's error domain (empirical/algorithmic error rates).

  # ======================================================================
  # EDGE (relationship) classes — reified attribution/provenance statements.
  # Each `is_a: Edge`; slot_usage documents the expected subject/object and
  # pins the predicate. Use these when a statement itself must be annotated
  # (e.g. the mirror rule) or reified; the Dataset inline attributes above
  # cover the common flat case.
  # ======================================================================

  HasCreator:
    is_a: Edge
    description: Dataset → Agent (authoritative creator).
    annotations:
      dapper:authoritative: true
      dapper:mirror_mutable: false
    slot_usage:
      subject:
        description: Dataset id.
      predicate:
        ifabsent: string(schema:creator)
      object:
        description: Person/Organization id.

  HasContributor:
    is_a: Edge
    description: Dataset → Agent (contributor).
    slot_usage:
      predicate:
        ifabsent: string(dcterms:contributor)

  FundedBy:
    is_a: Edge
    description: Dataset → Award (authoritative funding).
    annotations:
      dapper:authoritative: true
      dapper:mirror_mutable: false
    slot_usage:
      predicate:
        ifabsent: string(dapper:fundedBy)

  IsDescribedBy:
    is_a: Edge
    description: Dataset → Publication (authoritative primary publication).
    annotations:
      dapper:authoritative: true
      dapper:mirror_mutable: false
    slot_usage:
      predicate:
        ifabsent: string(dcterms:isReferencedBy)

  WasDerivedFrom:
    is_a: Edge
    description: Entity (Dataset/Set/File) → source entity (Dataset/Set/File/DrsObject).
    slot_usage:
      predicate:
        ifabsent: string(prov:wasDerivedFrom)

  WasGeneratedBy:
    is_a: Edge
    description: >-
      Dataset/Set/File → the Activity that produced it. File includes
      C2M2File; generic intermediate files use the same provenance edge.
    slot_usage:
      predicate:
        ifabsent: string(prov:wasGeneratedBy)

  Used:
    is_a: Edge
    aliases:
      - data input
      - metadata input
    description: >-
      Activity → an input entity it used (File, including C2M2File, or Dataset/Set). Covers the
      dig.geneset "data input" and "metadata input" edge labels; the specific
      role is carried by `edge_role` (ProvEdgeRoleEnum).
    slot_usage:
      predicate:
        ifabsent: string(prov:used)
    attributes:
      edge_role:
        is_a: literal
        mixins: [hashable]
        range: ProvEdgeRoleEnum
        description: Which dig.geneset edge label this reifies.

  WasAttributedTo:
    is_a: Edge
    description: Dataset → Agent.
    slot_usage:
      predicate:
        ifabsent: string(prov:wasAttributedTo)

  HasLineageStep:
    is_a: Edge
    description: Activity → LineageStep.
    slot_usage:
      predicate:
        ifabsent: string(dapper:hasLineageStep)

  HasRecommendedCitation:
    is_a: Edge
    description: Dataset → RecommendedCitation (authoritative).
    annotations:
      dapper:authoritative: true
      dapper:mirror_mutable: false
    slot_usage:
      predicate:
        ifabsent: string(dcterms:bibliographicCitation)

  HasMirrorProvenance:
    is_a: Edge
    description: >-
      Dataset → MirrorProvenance. APPEND-ONLY: mirrors may add this edge but
      must not modify authoritative statements.
    annotations:
      dapper:mirror_mutable: true
      dapper:append_only: true
    slot_usage:
      predicate:
        ifabsent: string(dapper:hasMirrorProvenance)

  HasEmbedding:
    is_a: Edge
    description: >-
      Any Node → an Embedding computed from it. Reifies the node's
      `has_embedding` list (the inverse of Embedding.embedding_of). This is a
      representation relationship, not a derivation: the embedded node is not
      upstream of anything by virtue of having been embedded.
    slot_usage:
      predicate:
        ifabsent: string(dapper:hasEmbedding)

  HasDataUseTerm:
    is_a: Edge
    description: Dataset → DataUseTerm (DUO).
    slot_usage:
      predicate:
        ifabsent: string(dapper:hasDataUseTerm)

  HasFile:
    is_a: Edge
    description: Dataset -> File (including C2M2File) carrying a distribution of its data.
    slot_usage:
      predicate:
        ifabsent: string(dapper:hasFile)

  HasDrsObject:
    is_a: Edge
    description: Dataset → DrsObject (GA4GH DRS).
    slot_usage:
      predicate:
        ifabsent: string(dapper:hasDrsObject)

  DrsRepresentation:
    is_a: Edge
    description: >-
      File (including C2M2File) → a DrsObject exposing the same file bytes as a
      DRS blob. Reifies File.drs_representation; this is an access relationship,
      not a derivation or a dataset distribution.
    slot_usage:
      predicate:
        ifabsent: string(dapper:drsRepresentation)

  PackagedAs:
    is_a: Edge
    description: Dataset → RoCratePackage.
    slot_usage:
      predicate:
        ifabsent: string(dapper:packagedAs)

  HasWorkflowProvenance:
    is_a: Edge
    description: Dataset/Activity → BioComputeObject (IEEE 2791).
    slot_usage:
      predicate:
        ifabsent: string(dapper:hasWorkflowProvenance)

# ===========================================================================
# BLOCK — DISMECH HARMONIZATION
#
# DISMECH (https://w3id.org/monarch-initiative/dismech) is mirrored into this
# repo VERBATIM from monarch-initiative/dismech and is refreshed by
# models/dismech/pull_dismech.py. It is therefore NOT editable here: any local
# change is silently reverted on the next refresh. All harmonization is
# expressed on THIS side, as mappings and pointers, so both models can evolve
# independently and still line up.
#
# Cross-walk summary (DAPPER <-> DISMECH):
#   dapper:Dataset             <-> dismech:Dataset            (complementary halves:
#                                DISMECH describes the science of a dataset,
#                                DAPPER describes its attribution)
#   dapper:Publication         <-> dismech:PublicationReference
#   dapper:Activity            <-> dismech:CurationEvent      (DISMECH's homegrown
#                                mini-PROV; DAPPER's PROV-O subsumes it)
#   dapper:MechanisticModel    ~   dismech:MechanisticHypothesis
#   dapper:CausalStep          <-> dismech:CausalEdge
#   dapper:Mechanism           <-> dismech:Mechanism
#   dapper:EvidenceItem        <-> dismech:EvidenceItem
#
# NOTE ON IDENTITY. DISMECH keys a disease by `Disease.name` (a plain string)
# and a dataset by `accession` (a CURIE). DAPPER keys every Node by a
# CURIE/URI `id`. When pointing at a DISMECH entry, prefer the ontology term
# (MONDO CURIE) it carries in `disease_term`, and record the upstream string
# key separately in `dismech_entry_key` so the join is lossless in both
# directions.
# ===========================================================================

  DismechLinked:
    mixin: true
    description: >-
      Mixin adding pointers from a DAPPER node to the DISMECH entry it
      corresponds to. Applied to any class that has a DISMECH counterpart.
      These are POINTERS, not copies — the curated content stays upstream in
      DISMECH and is fetched by following them. This keeps the two models
      harmonized without duplicating (and then drifting from) Monarch's data.
    attributes:
      dismech_class:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        description: >-
          CURIE of the DISMECH class this node corresponds to, e.g.
          `dismech:MechanisticHypothesis`. Machine-readable restatement of the
          class-level `exact_mappings`, useful when only an instance is in hand.
      dismech_entry_key:
        is_a: literal
        mixins: [hashable]
        description: >-
          The upstream DISMECH string key for this entry — `Disease.name` for a
          disease, `hypothesis_group_id` for a mechanistic hypothesis. DISMECH
          uses plain strings as identifiers, so this is NOT a CURIE and MUST NOT
          be written into `id`.
      dismech_disease_term:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: >-
          The MONDO CURIE of the DISMECH disease this node attaches to (DISMECH
          `Disease.disease_term` -> DiseaseDescriptor -> Term.id). This is the
          stable, resolvable join key between the two models; prefer it over
          `dismech_entry_key`.
      dismech_source_url:
        is_a: literal
        mixins: [hashable]
        range: uri
        description: >-
          Deep link to the entry on https://dismech.monarchinitiative.org, for
          human review.

# ===========================================================================
# BLOCK — NANOPUBLICATION (Nanodash / Knowledge Pixels)
#
# A nanopublication is FOUR NAMED GRAPHS, not one document:
#
#   <np>/Head         np:Nanopublication, and the three functional links:
#                     np:hasAssertion / np:hasProvenance / np:hasPublicationInfo
#   <np>/assertion    the claim itself                     (np:Assertion)
#   <np>/provenance   where the ASSERTION came from        (np:Provenance)
#   <np>/pubinfo      where the NANOPUB came from + sig    (np:PublicationInfo)
#
# LinkML has no named-graph construct, so each graph is modelled here as a
# class and the graph it belongs in is recorded as `dapper:np_graph` on that
# class. A serializer walks these annotations to emit TriG/JSON-LD quads; a
# loader reverses it. Class/slot URIs below are quoted from the live ontology
# documents at http://www.nanopub.org/nschema and http://purl.org/nanopub/x/.
#
# WHY THIS FITS DAPPER. The nanopub split is almost exactly the DAPPER
# split, which is why the two compose instead of competing:
#   assertion   <- the scientific claim        (Claim, claims.yaml)
#   provenance  <- prov:wasAttributedTo, Activity, LineageStep
#   pubinfo     <- creator / license / created / RecommendedCitation
# So `ProvenancedResource` already carries most of what the provenance and
# pubinfo graphs need; the nanopub classes below mostly add IDENTITY (trusty
# URIs), SIGNATURE, and LIFECYCLE.
#
# TRUSTY URIs. A published nanopub's `id` is a trusty URI — the base URI with
# a cryptographic hash of the content (e.g.
# https://w3id.org/np/RAwUp0SmZZwQNOY1zbSPhR21aQoImiUyQrDlyXj5QYXmQ). It is
# therefore CONTENT-ADDRESSED AND IMMUTABLE: you never edit a nanopub, you
# publish a new one that npx:supersedes it. This is a strictly stronger form
# of the mirroring invariant above, and worth calling out explicitly — a signed
# trusty URI makes "a mirror MUST NOT rewrite authoritative provenance"
# cryptographically checkable rather than merely stated.
# ===========================================================================

  Nanopublication:
    is_a: HashableNode
    class_uri: np:Nanopublication
    description: >-
      A nanopublication: an assertion plus its provenance plus its publication
      info, published as one signed, content-addressed unit. All THREE of
      `has_assertion`, `has_provenance` and `has_publication_info` are required
      — the well-formedness rules demand exactly one quad for each, so a nanopub
      with only an assertion is malformed and the network will reject it. `id` is the
      nanopub's trusty URI once published (a draft may use a temporary URI).
    annotations:
      dapper:np_graph: Head
      dapper:source_standard: Nanopublication schema (http://www.nanopub.org/nschema)
    attributes:
      has_assertion:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: np:hasAssertion
        description: >-
          The assertion graph. REQUIRED: nanopublication well-formedness demands
          exactly one `np:hasAssertion` quad in the Head.
        annotations:
          dapper:np_graph: Head
      has_provenance:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: np:hasProvenance
        description: >-
          The provenance graph — where the ASSERTION came from (not where the
          nanopub came from; that is pubinfo). REQUIRED: exactly one, same as
          the assertion. A nanopub carrying only an assertion is malformed.
        annotations:
          dapper:np_graph: Head
      has_publication_info:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: np:hasPublicationInfo
        description: >-
          The publication-info graph — where the NANOPUB itself came from.
          REQUIRED: exactly one.
        annotations:
          dapper:np_graph: Head
      nanopub_type:
        is_a: literal
        mixins: [hashable]
        range: NanopubTypeEnum
        multivalued: true
        slot_uri: npx:hasNanopubType
        annotations:
          dapper:np_graph: pubinfo
        description: Type(s) classifying this nanopublication (e.g. draft_nanopub).
      has_signature_element:
        is_a: relationship
        mixins: [unhashable]  # signature
        range: uriorcurie
        slot_uri: npx:hasSignatureElement
        description: The NanopubSignature covering this nanopub.
        annotations:
          dapper:np_graph: pubinfo
      supersedes:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: npx:supersedes
        description: >-
          A previously published nanopub this one replaces. Because trusty URIs
          are immutable, this — not editing — is how a nanopub is updated.
        annotations:
          dapper:np_graph: pubinfo
      invalidates:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: npx:invalidates
        annotations:
          dapper:np_graph: pubinfo
        description: Nanopublication(s) this one invalidates without formally superseding them.
      was_created_at:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: npx:wasCreatedAt
        description: >-
          The service that minted this nanopub, e.g.
          https://nanodash.knowledgepixels.com/.
        annotations:
          dapper:np_graph: pubinfo
      created_from_template:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: ntemplate:wasCreatedFromTemplate
        description: >-
          The Nanodash template this nanopub was instantiated from. Knowledge
          Pixels tooling emits this alongside
          `ntemplate:wasCreatedFromProvenanceTemplate` and
          `...FromPubinfoTemplate`.
        annotations:
          dapper:np_graph: pubinfo
      created:
        is_a: literal
        mixins: [unhashable]  # temporal
        range: datetime
        slot_uri: dcterms:created
        annotations:
          dapper:np_graph: pubinfo
        description: When the nanopublication was created.
      creator:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: dcterms:creator
        description: ORCID(s) of the nanopub's creator.
        annotations:
          dapper:np_graph: pubinfo
      nanopub_license:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: dcterms:license
        annotations:
          dapper:np_graph: pubinfo
        description: License CURIE/URI the nanopublication is released under.
      label:
        is_a: literal
        mixins: [hashable]
        slot_uri: rdfs:label
        annotations:
          dapper:np_graph: pubinfo
        description: Human-readable label for the nanopublication.
      trusty_uri:
        is_a: literal
        mixins: [unhashable]   # assigned after the content exists
        range: uri
        description: >-
          The real Trusty URI (an `RA…` artifact code) minted by nanopub-java
          when this nanopublication is actually published. NOT computed by
          schema/identity — see schema/trusty-identifiers.md, which is explicit
          that `RA` must not be reimplemented or approximated.

          Distinct from `id`, which is this repository's own
          `dapper:Nanopublication.{digest}` content address. Two identifiers,
          two different guarantees: keep them separate and never conflate them.
        annotations:
          dapper:np_graph: Head

  NanopubAssertion:
    is_a: HashableNode
    class_uri: np:Assertion
    description: >-
      The assertion graph — the claim being made, and the only part a reader is
      asked to believe. `asserts` points at a Claim or ScientificAccount. The assertion graph is distinct from
      the scientific object it carries.
    annotations:
      dapper:np_graph: assertion
    attributes:
      asserts:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: hycl:claims
        description: >-
          The scientific object carried by this graph: a Claim or ScientificAccount id.
      as_sentence:
        is_a: literal
        mixins: [hashable]
        slot_uri: npx:asSentence
        description: >-
          An English rendering of the assertion. When it is a single
          self-contained sentence with an unambiguous subject, this is an
          AIDA sentence (hycl:AIDA-Sentence).
        close_mappings:
          - hycl:AIDA-Sentence

  NanopubProvenance:
    is_a: HashableNode
    class_uri: np:Provenance
    description: >-
      The provenance graph — where the ASSERTION came from (not where the
      nanopub came from; that is pubinfo). Its subject is the assertion graph.
      This is the natural home for a DAPPER `Activity` / `LineageStep` chain.
    annotations:
      dapper:np_graph: provenance
    attributes:
      provenance_of:
        is_a: relationship
        mixins: [unhashable]  # back-reference
        range: uriorcurie
        description: The assertion graph this provenance describes.
      was_attributed_to:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: prov:wasAttributedTo
        description: >-
          Agent the assertion is attributed to — an ORCID for a person, or an
          npx:SoftwareAgent / npx:SoftwareTool for a generating pipeline such
          as REVEAL.
      generated_by_activity:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: prov:wasGeneratedBy
        description: DAPPER Activity id that produced the assertion.
      derived_from:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: prov:wasDerivedFrom
        description: >-
          Source entities the assertion was derived from — Dataset, GeneSet, or
          Publication ids.

  NanopubPublicationInfo:
    is_a: HashableNode
    class_uri: np:PublicationInfo
    description: >-
      The publication-info graph — metadata about the NANOPUB itself: who
      published it, when, under what licence, with what signature. Overlaps
      almost exactly with the DAPPER attribution core.
    annotations:
      dapper:np_graph: pubinfo
    attributes:
      pubinfo_of:
        is_a: relationship
        mixins: [unhashable]  # back-reference
        range: uriorcurie
        description: The nanopub this publication info describes.

  NanopubSignature:
    is_a: HashableNode
    class_uri: npx:NanopubSignatureElement
    description: >-
      The cryptographic signature over a nanopublication. Published nanopubs in
      the Knowledge Pixels network are RSA-signed and keyed to the signer's
      ORCID; verifying the signature plus recomputing the trusty-URI hash
      proves the content has not been altered since publication.
    annotations:
      dapper:np_graph: pubinfo
      dapper:mirror_mutable: false
    attributes:
      has_algorithm:
        is_a: literal
        mixins: [hashable]
        slot_uri: npx:hasAlgorithm
        description: Signature algorithm, e.g. "RSA".
      has_public_key:
        is_a: literal
        mixins: [hashable]
        slot_uri: npx:hasPublicKey
        description: Base64 public key of the signer.
      has_signature:
        is_a: literal
        mixins: [hashable]
        slot_uri: npx:hasSignature
        description: Base64 signature value.
      signed_by:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: npx:signedBy
        description: Agent that signed — an ORCID.
      has_signature_target:
        is_a: relationship
        mixins: [unhashable]  # signature + back-reference
        range: uriorcurie
        slot_uri: npx:hasSignatureTarget
        description: The nanopub this signature covers.

  # ---- nanopub edges -------------------------------------------------------

  HasAssertion:
    is_a: Edge
    description: Nanopublication → NanopubAssertion.
    slot_usage:
      predicate:
        ifabsent: string(np:hasAssertion)

  HasProvenanceGraph:
    is_a: Edge
    description: Nanopublication → NanopubProvenance.
    slot_usage:
      predicate:
        ifabsent: string(np:hasProvenance)

  HasPublicationInfo:
    is_a: Edge
    description: Nanopublication → NanopubPublicationInfo.
    slot_usage:
      predicate:
        ifabsent: string(np:hasPublicationInfo)

  Supersedes:
    is_a: Edge
    description: >-
      Nanopublication → Nanopublication. The update mechanism for immutable
      trusty-URI artifacts.
    slot_usage:
      predicate:
        ifabsent: string(npx:supersedes)

# ===========================================================================
# BLOCK — HYPOTHESIS (the REVEAL output)
#
# Mechanistic structure is optional content. Hypothesis is a Proposition's
# role in a ScientificAccount; attribution and assessment live on Claim.
# DISMECH alignments here are conceptual, not assertions of complete equivalence.

  MechanisticModel:
    is_a: HashableNode
    mixins:
      - ProvenancedResource
      - DismechLinked
    description: >-
      Optional biological model elaborating one or more causal relationships.
      Contains structure and scope, not an assessment, confidence, or review
      status. A Proposition may reference this model and Claims assess that
      proposition. Its use as a hypothesis belongs to a ScientificAccount.
    close_mappings:
      - dismech:MechanisticHypothesis
    attributes:
      description:
        is_a: literal
        mixins: [hashable]
        required: true
        description: Description of the proposed biological structure.
      subject_entity:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: Optional upstream entity in the mechanistic model.
      object_entity:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: Optional downstream entity in the mechanistic model.
      has_causal_step:
        is_a: relationship
        mixins: [hashable]
        range: CausalStep
        inlined: false
        multivalued: true
        description: Causal steps, ordered by each step's step_index.
      scope:
        is_a: literal
        mixins: [hashable]
        description: Biological conditions under which the model is proposed to apply.
      applies_to_subtypes:
        is_a: literal
        mixins: [hashable]
        multivalued: true
        description: Disease subtypes to which this model applies.

  CausalStep:
    is_a: HashableNode
    mixins:
      - DismechLinked
    description: >-
      One ordered link in a mechanistic model's causal chain: subject -> object, with
      a directness classification and optional intermediates. Deliberately
      shaped as DISMECH's `CausalEdge` so a chain can be written into a DISMECH
      entry, or read out of one, without translation.
    exact_mappings:
      - dismech:CausalEdge
    annotations:
      dapper:source_standard: DISMECH CausalEdge
    attributes:
      step_index:
        is_a: literal
        mixins: [hashable]
        range: integer
        minimum_value: 0
        description: >-
          0-based position in the chain. Carries the ordering explicitly
          because RDF graphs are unordered.
      step_subject:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: Upstream end of this step (gene, variant, mechanism, phenotype, ...).
      step_object:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: >-
          Downstream end of this step. Corresponds to DISMECH `CausalEdge.target`.
        exact_mappings:
          - dismech:target
      causal_link_type:
        is_a: literal
        mixins: [hashable]
        range: CausalLinkTypeEnum
        description: >-
          Directness of the step. Values are DISMECH's verbatim.
        exact_mappings:
          - dismech:causal_link_type
      intermediate_mechanisms:
        is_a: literal
        mixins: [hashable]
        multivalued: true
        description: >-
          Known intervening mechanisms, required in spirit when
          `causal_link_type` is INDIRECT_KNOWN_INTERMEDIATES.
        exact_mappings:
          - dismech:intermediate_mechanisms
      via_mechanism:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        description: Mechanism node ids for this step (structured counterpart of the above).
      description:
        is_a: literal
        mixins: [hashable]
  Mechanism:
    is_a: HashableNode
    mixins:
      - DismechLinked
    description: >-
      A biological mechanism invoked by a causal step. Intentionally thin —
      DISMECH's `Mechanism` is `name` + `description`, and the rich
      pathophysiology (cell types, biological processes, pathways, locations)
      lives upstream in DISMECH's `Pathophysiology`. Point at it with
      `DismechLinked` rather than copying it here.
    exact_mappings:
      - dismech:Mechanism
    close_mappings:
      - dismech:Pathophysiology
    attributes:
      description:
        is_a: literal
        mixins: [hashable]
      biological_process:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        description: GO biological process CURIE(s), e.g. `obo:GO_0006629`.

  EvidenceItem:
    is_a: HashableNode
    mixins:
      - ProvenancedResource
    description: >-
      Evidence used in an attributed assessment of a target proposition.
      Can retain a publication passage or use source Claims, with a direction,
      rationale, and assumptions. The target is a Proposition rather than the
      owning Claim, so Claim -> EvidenceItem -> Proposition has no back-reference
      cycle. Reuse across Claims requires the same target and interpretation.
    close_mappings:
      - dismech:EvidenceItem
    see_also:
      - https://sepio-framework.github.io/sepio-linkml/EvidenceLine/
    annotations:
      dapper:source_standard: DISMECH EvidenceItem and SEPIO EvidenceLine (conceptual alignment)
    attributes:
      source_claims:
        is_a: relationship
        mixins: [hashable]
        range: Claim
        inlined: false
        multivalued: true
        minimum_cardinality: 1
        description: Source assessments used as evidence; not automatically accepted as true.
      target_proposition:
        is_a: relationship
        mixins: [hashable]
        range: Proposition
        inlined: false
        description: Proposition to which direction and explanation apply.
      context:
        is_a: literal
        mixins: [hashable]
        description: Analytical or biological model context needed to interpret this evidence use.
      assumptions:
        is_a: literal
        mixins: [hashable]
        multivalued: true
        description: Assumptions licensing this interpretation; not claims assessed by this work.
      mechanistic_model:
        is_a: relationship
        mixins: [hashable]
        range: MechanisticModel
        inlined: false
        description: Optional biological structure used in the interpretation.
      reference:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: >-
          The publication this evidence comes from — a Publication node id, or
          a `PMID:` CURIE.
        exact_mappings:
          - dismech:reference
      reference_title:
        is_a: literal
        mixins: [hashable]
        exact_mappings:
          - dismech:reference_title
        description: Title of the referenced publication.
      direction:
        is_a: literal
        mixins: [hashable]
        range: EvidenceDirectionEnum
        description: Direction of this evidence use relative to target_proposition.
        close_mappings:
          - dismech:supports
      evidence_source:
        is_a: literal
        mixins: [hashable]
        description: Where the evidence was drawn from (database, deep-research run, ...).
        exact_mappings:
          - dismech:evidence_source
      snippet:
        is_a: literal
        mixins: [hashable]
        description: Verbatim quoted passage supporting the claim.
        exact_mappings:
          - dismech:snippet
      explanation:
        is_a: literal
        mixins: [hashable]
        description: Curator/agent rationale for how the passage or source claims bear on the target proposition.
        exact_mappings:
          - dismech:explanation
      from_nanopub:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: >-
          The nanopublication this evidence is drawn from, when the evidence is
          itself a published, signed claim rather than a passage from a paper.
          Following it reaches that claim's own provenance graph, and from
          there the analysis and dataset it rests on.

    rules:
      - preconditions:
          slot_conditions:
            source_claims:
              required: true
        postconditions:
          slot_conditions:
            target_proposition:
              required: true
            direction:
              required: true
            explanation:
              required: true
            context:
              required: true

  # ---- scientific-content edges ----------------------------------------------------

  HasCausalStep:
    is_a: Edge
    description: MechanisticModel → CausalStep.
    slot_usage:
      predicate:
        ifabsent: string(dapper:hasCausalStep)

  HasEvidence:
    is_a: Edge
    description: Claim → EvidenceItem.
    slot_usage:
      predicate:
        ifabsent: string(dapper:hasEvidence)

  AssertedIn:
    is_a: Edge
    description: >-
      Claim → Nanopublication. Records that this claim was published in a
      signed, content-addressed nanopublication.
    slot_usage:
      predicate:
        ifabsent: string(hycl:claims)

  HasAgenticWorkspace:
    is_a: Edge
    description: >-
      Activity → AgenticWorkspace. Reified form of
      `Activity.has_agentic_workspace`: the workspace and prompt from which
      this analysis can be re-run by an agent.
    slot_usage:
      subject:
        description: Activity id.
      predicate:
        ifabsent: string(dapper:hasAgenticWorkspace)
      object:
        description: AgenticWorkspace id.

  CorrespondsToDismech:
    is_a: Edge
    description: >-
      Any DAPPER node → the DISMECH entry it corresponds to. The instance-
      level counterpart of the class-level `exact_mappings` in block (A).
    slot_usage:
      subject:
        description: DAPPER node id.
      predicate:
        ifabsent: string(skos:closeMatch)
      object:
        description: DISMECH entry identifier (prefer the MONDO CURIE).
