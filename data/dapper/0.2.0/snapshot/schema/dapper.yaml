id: https://broadinstitute.github.io/dapper/model/schema/dapper.yaml
name: dapper
title: DAPPER - NIH Dataset Attribution and Provenance Profile
description: >-
  A LinkML data model for DAPPER, the NIH Dataset Attribution and Provenance
  Profile. Every dataset returned through an NIH MCP server should carry
  enough structured metadata for an AI system to cite the dataset, identify its
  creators, link to the primary publication, report the NIH grant/award that
  supported it, and describe the provenance of the returned result. The
  profile's core covers citation/funding/provenance (JSON-LD + DataCite +
  PROV-O + schema.org) plus GA4GH DRS object identity, DUO data-use terms,
  RO-Crate packaging, and BioCompute/IEEE-2791 executable workflow provenance.

  On top of that core, the profile adds the following blocks:

    CLAIMS. `Claim` assesses a reusable Proposition with typed scores and
      execution provenance. `ScientificAccount` organizes framing, context, claims and an optional
      conclusion; `Paragraph` records a textual expression. Defined in claims.yaml and
      conceptually aligned with SEPIO's Proposition and Statement model.

    DISMECH HARMONIZATION. Cross-walk mappings onto the Monarch Initiative
      DISMECH disease-pathophysiology schema
      (https://w3id.org/monarch-initiative/dismech), so the two models stay
      harmonized without either one forking the other. DISMECH is mirrored
      verbatim from upstream and is NOT edited; all harmonization lives here
      as `exact_mappings` / `close_mappings` plus a `DismechLinked` mixin
      carrying pointers. Reuse, don't reinvent.

    NANOPUBLICATION. The nanopublication model as used by the Nanodash /
      Knowledge Pixels stack: the Head/assertion/provenance/pubinfo quad and
      the npx signature + lifecycle (supersedes / retracts / introduces)
      terms. Lets a DAPPER object be emitted as, or minted from, a signed
      nanopublication.

    AGENTIC REPLAY. `AgenticWorkspace` — the workspace and prompt an
      AI agent can use to re-run an `Activity`. The executable provenance an
      Activity carries (`command`, `container_image`, `code_version`) is
      the machine replay path; this is the agentic one, alongside it rather
      than instead of it. A prompt is NOT a deterministic replay mechanism,
      so the two are deliberately not interchangeable.

    MECHANISTIC MODELS. Optional biological structure in MechanisticModel,
      CausalStep and Mechanism. A hypothesis is a Proposition's role within
      ScientificAccount. Confidence, review status and evidence live on Claim.

    SINGLE-CELL. `GeneProgram` — a coordinated pattern of gene activity
      representing a biological process, e.g. a factor from cNMF/NMF/
      Spectra/WGCNA or a curated gene module — extends `Set` the same way
      `GeneSet` does, with genes as members. `CellState` is the cellular
      phenotype defined by the combination of `GeneProgram`s active in a
      cell (or cell population) at once, as distinct from a cell TYPE (a
      Cell Ontology class), which is what lineage a cell belongs to rather
      than what functional state it is in.

  The schema is shaped as a Dock knowledge graph: NIH resources, agents,
  awards, publications, scientific accounts, and nanopublications are Node entities;
  attribution, provenance, and causal assertions are Edge relationships.
license: https://opensource.org/license/mit
version: 0.2.0

# ---------------------------------------------------------------------------
# MIRRORING INVARIANT (NIH/OD — the profile's hard rule)
#
#   Mirrors (OpenAI, Anthropic, Google, Microsoft, AWS, ... regional caches)
#   MAY cache NIH resources and MAY APPEND a `mirror_provenance` object, but
#   they MUST NOT modify any element annotated `dapper:mirror_mutable: false`
#   (the authoritative NIH provenance: creators, funding, publications,
#   recommended_citation). Rewriting authoritative provenance causes drift and
#   makes the attribution worthless. Full enforcement is a downstream validator
#   (see README) that diffs a mirrored object against the authoritative one
#   over the `mirror_mutable: false` closure; this schema encodes the intent
#   via per-class / per-edge annotations.
# ---------------------------------------------------------------------------
comments:
  - >-
    Authoritative NIH provenance (creators, funding, publications,
    recommended_citation) is annotated `dapper:mirror_mutable: false` and MUST NOT
    be rewritten by mirrors. Mirrors may only append `mirror_provenance`
    (MirrorProvenance / HasMirrorProvenance, annotated `dapper:append_only: true`).

default_prefix: dapper
default_range: string

# PREFIX POLICY
#   A semantic mapping is asserted here ONLY if it resolves to a defined term
#   in a real RDF/OWL vocabulary. Several standards in this profile (DataCite kernel-4,
#   GA4GH DRS, RO-Crate, IEEE-2791/BioCompute) are XML- or JSON-Schema specs
#   with NO RDF vocabulary — inventing `drs:DrsObject`-style IRIs for them
#   would produce mappings that never dereference. Those standards are instead
#   recorded as human-facing `aliases` (the source element name) and a
#   `dapper:source_standard` annotation. All obo/DUO/IAO CURIEs were verified
#   against EBI OLS4; FRAPO/FaBiO/SPDX/SPAR-DataCite against their published
#   specs.
#   Additions: the nanopublication prefixes below were each dereferenced
#   and read before use (`np` and `npx` and `hycl` all serve Turtle at their
#   namespace IRI); the terms mapped in block (B) are quoted from those live
#   ontology documents, not recalled. `ntemplate` is the Nanodash template
#   vocabulary observed in published Knowledge Pixels nanopubs. `dismech` is
#   the upstream DISMECH schema's own declared prefix, copied verbatim from
#   its `prefixes:` block so cross-walk CURIEs resolve.
prefixes:
  # Stable vocabulary and record-identifier namespace. /ns/ resolves known
  # vocabulary fragments (e.g. dapper:Edge) to their model documentation.
  # Record IDs remain dapper:{ClassName}.{digest}; they are not schema terms.
  dapper: https://broadinstitute.github.io/dapper/ns#
  # Documentation CURIEs identify definitions in this model, independently
  # of their semantic class_uri/slot_uri/enum_uri and external mappings.
  # GitHub Pages redirects the expanded URLs to their trailing-slash pages.
  dapper_class: https://broadinstitute.github.io/dapper/model/reference/classes/
  dapper_slot: https://broadinstitute.github.io/dapper/model/reference/slots/
  dapper_enum: https://broadinstitute.github.io/dapper/model/reference/enums/
  dapper_type: https://broadinstitute.github.io/dapper/model/reference/types/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  prov: http://www.w3.org/ns/prov#
  # --- nanopublication (verified by dereferencing each namespace) ---
  # Nanopublication schema. Defines Nanopublication/Assertion/Provenance/
  # PublicationInfo and the three functional hasX properties.
  np: http://www.nanopub.org/nschema#
  # Nanopub-X: extensions (signatures, supersedes/retracts/introduces,
  # SoftwareAgent, nanopub types).
  npx: http://purl.org/nanopub/x/
  # HYCL — Hypotheses and Claims Ontology (petapico). Thin: Statement,
  # AIDA-Sentence, claims, discusses, and statement-relation properties.
  hycl: http://purl.org/petapico/o/hycl#
  # Nanodash / Knowledge Pixels template vocabulary.
  ntemplate: https://w3id.org/np/o/ntemplate/
  # --- DISMECH cross-walk ---
  dismech: https://w3id.org/monarch-initiative/dismech/
  # SKOS — used for instance-level cross-walk predicates (closeMatch). Also
  # DISMECH's own declared prefix for the same namespace.
  skos: http://www.w3.org/2004/02/skos/core#
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  CL: http://purl.obolibrary.org/obo/CL_
  HANCESTRO: http://purl.obolibrary.org/obo/HANCESTRO_
  KPN.TRAIT: https://broadinstitute.github.io/kpn-data-models/kpn.trait/
  HGNC: http://identifiers.org/hgnc/
  PMID: http://identifiers.org/pubmed/
  # SPAR DataCite Ontology (identifier-focused). NOT the kernel-4 XSD —
  # kernel-4 defines XML elements, not RDF properties.
  DataCite: http://purl.org/spar/datacite/
  # FRAPO — Funding, Research Administration and Projects Ontology.
  FRAPO: http://purl.org/cerif/frapo/
  dcterms: http://purl.org/dc/terms/
  dctypes: http://purl.org/dc/dcmitype/
  dcat: http://www.w3.org/ns/dcat#
  foaf: http://xmlns.com/foaf/0.1/
  fabio: http://purl.org/spar/fabio/
  spdx: http://spdx.org/rdf/terms#
  DUO: http://purl.obolibrary.org/obo/DUO_
  obo: http://purl.obolibrary.org/obo/
  orcid: https://orcid.org/
  ror: https://ror.org/
  doi: https://doi.org/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  xsd: http://www.w3.org/2001/XMLSchema#

imports:
  - linkml:types
  - claims

# ===========================================================================
# ENUMS
# ===========================================================================
enums:
  AncestryEnum:
    description: >-
      Source-reported ancestry grouping of a genetic dataset or analysis.
      Initial codes follow DIG. Mixed denotes a combined analysis grouping,
      not individual genetic admixture. Omit ancestry when unknown.
    see_also:
      - https://ebispot.github.io/hancestro/
      - https://github.com/broadinstitute/dig-dug-portal/blob/859ebdf777d498dab583bb5d49b952ccf167e946/src/utils/formatters.js#L27-L48
    annotations:
      dapper:ontology_version: HANCESTRO releases/2025-10-14
    permissible_values:
      AA:
        title: African American / Afro-Caribbean
        meaning: HANCESTRO:0016
      AF:
        title: African, unspecified
        meaning: HANCESTRO:0010
      EA:
        title: East Asian
        meaning: HANCESTRO:0009
      EU:
        title: European
        meaning: HANCESTRO:0005
      GME:
        title: Middle Eastern / North African / Persian
        meaning: HANCESTRO:0015
      HS:
        title: Hispanic / Latin American, as reported
        description: >-
          Source-reported grouping; participant classification method is
          unspecified. Do not infer genetic admixture from this label alone.
        close_mappings:
          - HANCESTRO:0014
      Mixed:
        title: Multiple ancestry groups
        description: >-
          Analysis or data collection combining ancestry groups; component
          groups may be unspecified. Does not assert individual admixture.
      SA:
        title: South Asian
        meaning: HANCESTRO:0006
      SSAF:
        title: Sub-Saharan African
        meaning: HANCESTRO:0011

  ResourceTypeEnum:
    description: DataCite-style resource type (resourceTypeGeneral) for the returned entity.
    permissible_values:
      dataset:
        meaning: schema:Dataset
      collection:
        meaning: dctypes:Collection
      set:
        meaning: prov:Collection
        description: A collection of members (e.g. a gene set); see the Set class.
      gene_set:
        description: >-
          A set whose members are genes (dig.geneset). No ontology term is
          asserted (none resolves); grounded via the Set class (prov:Collection).
      software:
        meaning: schema:SoftwareApplication
      workflow:
      model:
      service:
        meaning: schema:Service

  CreatorRoleEnum:
    description: The role a creator (Person/Organization) played for the dataset.
    permissible_values:
      principal_investigator:
      researcher:
      data_manager:
      project_leader:
      curator:
      consortium:
      organization:
      division:
      group:

  ContributorRoleEnum:
    description: >-
      The role a contributing agent played. Values mirror the DataCite
      kernel-4 `contributorType` enumeration. No `meaning:` CURIEs: kernel-4 is
      an XML Schema, so these are XSD enumeration values with no RDF term to
      point at.
    annotations:
      dapper:source_standard: DataCite kernel-4 contributorType
    permissible_values:
      data_curator:
        description: DataCite contributorType "DataCurator".
      hosting_institution:
        description: DataCite contributorType "HostingInstitution".
      data_manager:
        description: DataCite contributorType "DataManager".
      producer:
        description: DataCite contributorType "Producer".
      rights_holder:
        description: DataCite contributorType "RightsHolder".
      sponsor:
        description: DataCite contributorType "Sponsor".
      other:
        description: DataCite contributorType "Other".

  PublicationRelationshipEnum:
    description: >-
      How a publication relates to the dataset. Values mirror the DataCite
      kernel-4 `relationType` enumeration (an XSD enumeration, hence no
      `meaning:` CURIEs).
    annotations:
      dapper:source_standard: DataCite kernel-4 relationType
    permissible_values:
      is_described_by:
        description: DataCite relationType "IsDescribedBy".
      is_supplement_to:
        description: DataCite relationType "IsSupplementTo".
      is_cited_by:
        description: DataCite relationType "IsCitedBy".
      cites:
        description: DataCite relationType "Cites".
      is_referenced_by:
        description: DataCite relationType "IsReferencedBy".

  AccessLevelEnum:
    description: Coarse access classification for the dataset.
    permissible_values:
      public:
      controlled:
      mixed:

  EmbeddingDtypeEnum:
    description: >-
      Element type of the stored embedding vector. Names follow NumPy dtype
      spelling; the bytes hashed into `Embedding.vector_sha256` are the row in
      this type, little-endian, C order.
    permissible_values:
      float16:
      float32:
      float64:
      bfloat16:
      int8:

  EmbeddingNormalizationEnum:
    description: >-
      Normalization applied to the stored vector after the model produced it.
      `none` stores the model output as returned; `l2` stores the unit-length
      vector, so a dot product is a cosine similarity.
    permissible_values:
      none:
      l2:

  FunderIdentifierTypeEnum:
    description: Type of the funder identifier.
    permissible_values:
      crossref_funder_id:
        description: Crossref Funder Registry ID.
      ror:
        description: Research Organization Registry ID.
      grid:
      isni:
      other:

  IdentifierTypeEnum:
    description: Type of a dataset persistent identifier.
    permissible_values:
      doi:
      handle:
      ark:
      accession:
      url:

  DataUsePermissionEnum:
    description: >-
      Primary consent permission governing use of the dataset. Values are the
      children of DUO:0000001 "data use permission" (Data Use Ontology);
      `meaning` CURIEs were verified against EBI OLS4.
    permissible_values:
      no_restriction:
        meaning: DUO:0000004
        description: DUO:0000004 — no restriction (NRES).
      general_research_use:
        meaning: DUO:0000042
        description: >-
          DUO:0000042 — general research use (GRU); includes health/biomedical,
          fundamental biology, ancestry, methods, and social-sciences research.
      population_origins_ancestry_research_only:
        meaning: DUO:0000011
        description: DUO:0000011 — population origins or ancestry research only (POA).

  DataUseModifierEnum:
    description: >-
      Additional conditions attached to a data use permission. Values are the
      children of DUO:0000017 "data use modifier"; `meaning` CURIEs were
      verified against EBI OLS4.
    permissible_values:
      research_specific_restrictions:
        meaning: DUO:0000012
      no_general_methods_research:
        meaning: DUO:0000015
      genetic_studies_only:
        meaning: DUO:0000016
      not_for_profit_non_commercial_use_only:
        meaning: DUO:0000018
      publication_required:
        meaning: DUO:0000019
      collaboration_required:
        meaning: DUO:0000020
      ethics_approval_required:
        meaning: DUO:0000021
      geographical_restriction:
        meaning: DUO:0000022
      publication_moratorium:
        meaning: DUO:0000024
      time_limit_on_use:
        meaning: DUO:0000025
      user_specific_restriction:
        meaning: DUO:0000026
      project_specific_restriction:
        meaning: DUO:0000027
      institution_specific_restriction:
        meaning: DUO:0000028
      return_to_database_or_resource:
        meaning: DUO:0000029
      clinical_care_use:
        meaning: DUO:0000043
      population_origins_ancestry_research_prohibited:
        meaning: DUO:0000044

  ProvEdgeRoleEnum:
    description: >-
      Semantic role of a provenance edge, providing a home for the three
      dig.geneset (CFDE provenance graph) edge labels — "data input",
      "metadata input", "data output" — expressed as PROV-O predicates.
    permissible_values:
      data_input:
        meaning: prov:used
        description: An input data entity an activity used (dig.geneset "data input").
      metadata_input:
        meaning: prov:used
        description: >-
          A reference/annotation entity an activity used (dig.geneset
          "metadata input"); same prov:used predicate, distinguished by role.
      data_output:
        meaning: prov:wasGeneratedBy
        description: An entity an activity generated (dig.geneset "data output").

  # =========================================================================
  # ENUMS — hypothesis + nanopublication
  # =========================================================================

  CausalLinkTypeEnum:
    description: >-
      Directness of a causal step. Values are copied VERBATIM from DISMECH's
      `CausalLinkTypeEnum` (dismech:CausalLinkTypeEnum) so a DAPPER causal
      step round-trips into a DISMECH `CausalEdge.causal_link_type` with no
      value translation. Do not add or rename values here without changing
      them upstream first.
    exact_mappings:
      - dismech:CausalLinkTypeEnum
    annotations:
      dapper:source_standard: DISMECH CausalLinkTypeEnum
    permissible_values:
      DIRECT:
        description: The subject acts directly on the object; no intermediates.
      INDIRECT_KNOWN_INTERMEDIATES:
        description: >-
          Indirect, and the intervening mechanisms are known and should be
          listed in `intermediate_mechanisms`.
      INDIRECT_UNKNOWN_INTERMEDIATES:
        description: Indirect, but the intervening mechanisms are not known.
      UNKNOWN:
        description: Directness has not been determined.

  NanopubTypeEnum:
    description: >-
      Nanopublication subtypes from Nanopub-X (npx), used as the object of
      `npx:hasNanopubType`. Each `meaning` was read from the live npx ontology
      document at http://purl.org/nanopub/x/.
    annotations:
      dapper:source_standard: Nanopub-X (http://purl.org/nanopub/x/)
    permissible_values:
      example_nanopub:
        meaning: npx:ExampleNanopub
        description: Published for testing; content should not be taken seriously.
      draft_nanopub:
        meaning: npx:DraftNanopub
        description: Marked as work-in-progress.
      meta_nanopub:
        meaning: npx:MetaNanopub
        description: A nanopublication about other nanopublications.
      protected_nanopub:
        meaning: npx:ProtectedNanopub
        description: Not intended to be shared publicly.
      retraction_nanopub:
        meaning: npx:RetractionNanopub
        description: Retracts a previously published nanopublication.
      intro_nanopub:
        meaning: npx:IntroNanopub
        description: Introduces an agent and its public key.

# ===========================================================================
# SLOTS — the required Dock Knowledge Graph skeleton (do not remove).
# ===========================================================================
slots:
  id:
    is_a: literal
    identifier: true
    slot_uri: schema:identifier
    exact_mappings:
      - dcterms:identifier
    close_mappings:
      - DataCite:hasIdentifier
    aliases:
      - identifier
      - PID
    description: >-
      Unique identifier for a node — a CURIE shorthand or a full URI. For a
      Dataset this is its persistent identifier (e.g. a DOI).
    required: true
  name:
    is_a: literal
    mixins: [hashable]
    slot_uri: rdfs:label
    exact_mappings:
      - schema:name
      - dcterms:title
    aliases:
      - title
      - label
    description: Human-readable name/label for a node.
  literal:
    slot_uri: rdfs:literal
    range: string
    description: >-
      Abstract base for scalar (data) attributes. Concrete scalar slots
      declare `is_a: literal`.
  ancestry:
    is_a: literal
    mixins: [hashable]
    range: AncestryEnum
    multivalued: false
    required: false
    slot_uri: dapper:ancestry
    description: >-
      Source-reported population grouping represented by a Dataset or
      targeted by an Activity. Omit when unknown or not applicable. This
      records analysis scope, not individual ancestry proportions or the
      participant classification method.
  trait:
    is_a: relationship
    mixins: [hashable]
    range: uriorcurie
    multivalued: false
    required: false
    slot_uri: dapper:trait
    broad_mappings:
      - schema:about
    id_prefixes:
      - KPN.TRAIT
    pattern: '^[A-Za-z][A-Za-z0-9._-]*:\S+$'
    description: >-
      Identifier of the trait measured by a Dataset or targeted by an Activity.
      Prefer a stable catalog CURIE, such as KPN.TRAIT:0000096 for atrial
      fibrillation, over a source abbreviation such as AF. External trait
      definitions remain in their catalog; no local trait node is required.
  has_gmt_file:
    is_a: relationship
    mixins: [hashable]
    range: File
    inlined: false
    slot_uri: dapper:hasGmtFile
    description: >-
      Local File or C2M2File record serializing a gene-set collection, or a
      whole-file export of a single GeneSet. Use its content-derived DAPPER
      identifier, not a bare checksum or retrieval URL. A row in a shared GMT
      is selected with GeneSet.in_gmt_file and gmt_entry instead.
  has_embedding:
    is_a: relationship
    mixins: [unhashable]  # inverse of Embedding.embedding_of; a derived representation never changes what a node is
    range: Embedding
    multivalued: true
    inlined: false
    slot_uri: dapper:hasEmbedding
    inverse: embedding_of
    description: >-
      Embedding records computed from this node (one per embedding model or
      text template). Available on every Node. Unhashable: attaching, replacing,
      or removing an embedding leaves the node's identifier unchanged. The
      forward, hashable direction is Embedding.embedding_of; if both are
      supplied they must agree.
  relationship:
    slot_uri: rdf:type
    range: uriorcurie
    description: >-
      Abstract base for cross-references between nodes. Concrete reference
      slots declare `is_a: relationship` with `range: uriorcurie` and point at
      another node's `id`.
  # --- identity axis (DAPPER-ID-1) -----------------------------------------
  # Orthogonal to literal/relationship above: that axis says what a slot IS,
  # this one says whether it CONSTITUTES the instance's identity. Every
  # attribute declares exactly one, enforced by schema/identity/lint_identity.py.
  hashable:
    description: >-
      Marks a slot as constituting the identity of its instance. Changing its
      value changes the instance's digest and therefore its `id`.
  unhashable:
    description: >-
      Marks a slot as excluded from the digest: temporal, environmental,
      signature, mirror-observed, or a back-reference derivable from a forward
      edge. Changing it MUST NOT change the instance's `id`.

  subject:
    slot_uri: rdf:subject
    range: uriorcurie
    description: The subject node of an Edge (its `id`/CURIE).
  predicate:
    slot_uri: rdf:predicate
    range: uriorcurie
    description: The predicate (relationship type) of an Edge.
  object:
    slot_uri: rdf:object
    range: uriorcurie
    description: The object node of an Edge (its `id`/CURIE).

# ===========================================================================
# CLASSES
# ===========================================================================
classes:

  AncestryContext:
    mixin: true
    description: Optional ancestry scope for genetic data and analyses.
    slots:
      - ancestry

  TraitContext:
    mixin: true
    description: Optional trait scope for datasets and analyses.
    slots:
      - trait

  # ---- Required KG skeleton base classes ---------------------------------
  Node:
    abstract: true
    description: >-
      Abstract base for all DAPPER entities (datasets, agents, awards,
      publications, licenses, activities, mirror records, ...). Not used
      directly.
    slots:
      - id
      - name
      - has_embedding

  HashableNode:
    is_a: Node
    abstract: true
    description: >-
      A Node whose `id` is a computed content address of the form
      `dapper:{ClassName}.{digest}` — the full LinkML class name, a dot, then a
      GA4GH `sha512t24u` digest over the slots marked `hashable`.

      The digest covers hashable slots ONLY. Timestamps, signatures, mirror
      observations, workspace locations, and back-references are marked
      `unhashable` so that re-running, re-signing, mirroring, or re-hosting an
      artifact never changes what it is. See schema/identity/README.md for the
      DAPPER-ID-1 profile and schema/trusty-identifiers.md for why this is
      deliberately NOT a Trusty URI `RA` code.
    annotations:
      dapper:id_profile: DAPPER-ID-1

  Edge:
    abstract: true
    class_uri: rdf:Statement
    description: >-
      Abstract base for all DAPPER attribution/provenance relationships,
      fixed to rdf:Statement. Not used directly.
    slots:
      - subject
      - predicate
      - object

  # ======================================================================
  # NODE (entity) classes — CORE
  # ======================================================================

  # ======================================================================
  # MIXINS — reusable slot bundles applied to more than one entity class.
  # ======================================================================

  PortalLinked:
    mixin: true
    description: >-
      Mixin adding the two portal landing-page links (dcc_url / drc_url) that
      every dig.geneset (CFDE provenance graph) node carries. Applied to Set,
      C2M2File, and Activity.
    attributes:
      dcc_url:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        slot_uri: schema:url
        close_mappings:
          - dcat:landingPage
        aliases:
          - dcc_url
        annotations:
          dapper:source_standard: CFDE dig.geneset dcc_url
        description: URL to the source DCC portal page for this resource.
      drc_url:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        slot_uri: schema:url
        close_mappings:
          - dcat:landingPage
        aliases:
          - drc_url
        annotations:
          dapper:source_standard: CFDE dig.geneset drc_url
        description: URL to the DRC (CFDE Workbench) entity/resource page.

  ProvenancedResource:
    mixin: true
    description: >-
      The shared attribution + funding + publication + provenance + license +
      access + mirror slots carried by any citable resource. Applied as a mixin
      to both `Dataset` (a set of data) and `Set` (a collection of members, e.g.
      a gene set), so the mirroring invariant and the DataCite/PROV
      attribution model bind identically to datasets and gene sets. Every
      `dapper:mirror_mutable: false` slot here is authoritative NIH provenance a
      mirror MUST NOT rewrite.
    attributes:
      access_level:
        is_a: literal
        mixins: [hashable]
        range: AccessLevelEnum
        slot_uri: dcterms:accessRights
        close_mappings:
          - schema:conditionsOfAccess
        aliases:
          - accessRights
        description: Access tier for the resource (e.g. public, controlled).
      alternate_identifier:
        is_a: literal
        mixins: [hashable]
        multivalued: true
        slot_uri: dcterms:identifier
        exact_mappings:
          - DataCite:hasIdentifier
        description: >-
          Externally-assigned persistent identifiers for this resource — a DOI,
          an accession, a Handle, an ARK. `id` is DAPPER's own computed content
          address (`dapper:{ClassName}.{digest}`), which answers "what exactly
          is this record?". A DOI answers "what does the publisher call this,
          and how do I cite it?". Both are worth keeping, so neither displaces
          the other. `identifier_type` names the scheme.
        annotations:
          dapper:source_standard: DataCite kernel-4 identifier/alternateIdentifiers
      controlled_access:
        is_a: literal
        mixins: [hashable]
        range: boolean
        close_mappings:
          - dcterms:accessRights
        description: Whether obtaining this resource requires a controlled-access request/review.
      # --- inline attribution/provenance links (each is a graph edge) ---
      has_creator:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: schema:creator
        exact_mappings:
          - dcterms:creator
        close_mappings:
          - prov:wasAttributedTo
        description: Authoritative creators (Person/Organization CURIEs).
        annotations:
          dapper:authoritative: true
          dapper:mirror_mutable: false
          dapper:source_standard: DataCite kernel-4 creators
      has_contributor:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: dcterms:contributor
        description: Contributing agents (Person/Organization CURIEs), distinct from the authoritative creators.
      funded_by:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: schema:funding
        exact_mappings:
          - FRAPO:isSupportedBy
        close_mappings:
          - schema:funder
        aliases:
          - funding
          - fundingReference
        description: Authoritative Award CURIEs supporting this resource.
        annotations:
          dapper:authoritative: true
          dapper:mirror_mutable: false
          dapper:source_standard: DataCite kernel-4 fundingReference
      is_described_by:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: dcterms:isReferencedBy
        close_mappings:
          - schema:subjectOf
        aliases:
          - IsDescribedBy
        description: Authoritative primary Publication CURIEs.
        annotations:
          dapper:authoritative: true
          dapper:mirror_mutable: false
          dapper:source_standard: DataCite kernel-4 relatedIdentifier/IsDescribedBy
      has_license:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: dcterms:license
        exact_mappings:
          - schema:license
        aliases:
          - license
        description: CURIE/URI of the License node.
      was_generated_by:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: prov:wasGeneratedBy
        description: The Activity that generated/packaged this returned result.
      was_derived_from:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: prov:wasDerivedFrom
        description: Upstream resource(s) (CURIEs) this one was derived from.
      was_attributed_to:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: prov:wasAttributedTo
        description: Agent(s) (CURIEs) this resource is attributed to.
      has_recommended_citation:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: dcterms:bibliographicCitation
        description: The authoritative RecommendedCitation node.
        annotations:
          dapper:authoritative: true
          dapper:mirror_mutable: false
      # --- mirror (append-only; NOT authoritative) ---
      has_mirror_provenance:
        is_a: relationship
        mixins: [unhashable]  # mirror-observed
        range: uriorcurie
        multivalued: true
        description: >-
          Mirror-appended provenance records. Append-only; mirrors add these
          but must not touch authoritative fields.
        annotations:
          dapper:mirror_mutable: true
          dapper:append_only: true

  Dataset:
    is_a: HashableNode
    mixins:
      - ProvenancedResource
      - AncestryContext
      - TraitContext
      # Lets a Dataset point at the DISMECH entry describing its science.
      - DismechLinked
    class_uri: schema:Dataset
    aliases:
      - dataset
      - data set
      - resource
    exact_mappings:
      - dcat:Dataset
      - dctypes:Dataset
    close_mappings:
      - prov:Entity
      # Cross-walk. Complementary halves of one idea: DISMECH's Dataset
      # describes the SCIENCE (organism, data_type, sample_types, platform,
      # and reported scientific content); this one describes the ATTRIBUTION (creators, funding,
      # licence, DUO terms, DRS identity). Neither duplicates the other, and
      # DISMECH's `accession` is already a CURIE, so it maps onto `id`.
      - dismech:Dataset
    broad_mappings:
      - obo:IAO_0000100      # homogenous data collection ("data set")
    description: >-
      A dataset (or dataset-like resource) returned through an NIH MCP server.
      The node `id` is the dataset's persistent identifier (typically a DOI).
      Attribution/provenance links come from the ProvenancedResource mixin
      (inline `has_*` / `*_by` relationship attributes, natural for MCP
      responses; also reifiable as Edge instances).
    attributes:
      identifier_type:
        is_a: literal
        mixins: [hashable]
        range: IdentifierTypeEnum
        close_mappings:
          - DataCite:usesIdentifierScheme
        aliases:
          - identifierType
        annotations:
          dapper:source_standard: DataCite kernel-4 identifierType
        description: Type of the dataset's persistent identifier (e.g. doi).
      version:
        is_a: literal
        mixins: [hashable]
        slot_uri: schema:version
        exact_mappings:
          - dcterms:hasVersion
        description: Dataset version string (e.g. "2.1.0").
      resource_type:
        is_a: literal
        mixins: [hashable]
        range: ResourceTypeEnum
        slot_uri: dcterms:type
        aliases:
          - resourceTypeGeneral
        annotations:
          dapper:source_standard: DataCite kernel-4 resourceTypeGeneral
        description: DataCite-style resource type (resourceTypeGeneral) for this dataset.
      publication_year:
        is_a: literal
        mixins: [hashable]
        range: integer
        slot_uri: schema:datePublished
        close_mappings:
          - dcterms:issued
        aliases:
          - publicationYear
        annotations:
          dapper:source_standard: DataCite kernel-4 publicationYear
        description: Year the dataset was published.
      description:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:description
        exact_mappings:
          - schema:description
        aliases:
          - abstract
        description: Free-text description or abstract of the dataset.
      publisher:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: dcterms:publisher
        exact_mappings:
          - schema:publisher
        description: CURIE/URI of the publishing Organization.
      # attribution/funding/provenance/license/access/mirror slots come from
      # the ProvenancedResource mixin. Dataset-specific links follow.
      # --- additional links ---
      location:
        is_a: literal
        mixins: [unhashable]
        annotations:
          dapper:uri_or_path: true
        description: >-
          Current retrieval URI or storage prefix for this dataset, such as
          an S3 prefix containing partitioned output. This mutable location
          does not identify an immutable version or prove file membership;
          capture concrete files or a manifest and their checksums separately.
      has_file:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: dapper:hasFile
        close_mappings:
          - dcat:distribution
          - schema:distribution
        description: >-
          File or C2M2File records carrying a distribution of this dataset.
          Links the logical dataset to concrete files without requiring DRS
          registration. An S3 prefix is a dataset location, not a single File;
          enumerate its files or link an actual manifest when available.
      has_data_use_term:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        broad_mappings:
          - DUO:0000001
          - DUO:0000017
        close_mappings:
          - dcterms:accessRights
        aliases:
          - data_use_limitations
        description: DUO term CURIEs constraining permitted use.
      has_drs_object:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: dcat:distribution
        close_mappings:
          - schema:distribution
        description: GA4GH DrsObject CURIEs (file-level identity) making up this dataset.
      packaged_as:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        close_mappings:
          - dcterms:isPartOf
        description: CURIE of the RoCratePackage this dataset is packaged as.
      has_workflow_provenance:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        description: BioComputeObject CURIEs describing the workflow(s) that produced this dataset.

  # ======================================================================
  # SET — a collection of members (prov:Collection). Distinct from Dataset
  # (a set of *data*, schema:Dataset). A gene set is a set of genes; protein
  # sets, variant sets, etc. extend Set the same way GeneSet does.
  # ======================================================================
  Set:
    is_a: HashableNode
    mixins:
      - ProvenancedResource
      - PortalLinked
    class_uri: prov:Collection
    close_mappings:
      - schema:Collection
    aliases:
      - collection
      - member set
    description: >-
      A collection of members — "an entity that provides a structure to some
      constituents, which are themselves entities" (prov:Collection). Set is
      deliberately separate from Dataset: a Dataset is a set of *data*
      (schema:Dataset); a Set is a set of *things* (genes, proteins, variants).
      Members are referenced via `prov:hadMember`. Set carries the same
      attribution/provenance/mirror slots (ProvenancedResource) as Dataset, so
      a returned set is citable and its authoritative provenance is
      mirror-protected identically.
    attributes:
      description:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:description
        exact_mappings:
          - schema:description
        aliases:
          - abstract
      members:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: prov:hadMember
        aliases:
          - hasMember
        description: >-
          The set's constituent members (CURIEs). Optional — a large set may
          instead reference its member manifest (e.g. a .gmt) via a member
          artifact rather than enumerating members inline.
      member_type:
        is_a: literal
        mixins: [hashable]
        description: The kind of member the set collects (e.g. gene, protein, variant).
      n_members:
        is_a: literal
        mixins: [hashable]
        range: integer
        close_mappings:
          - schema:numberOfItems
        description: Count of members in the set.

  GeneSet:
    is_a: Set
    aliases:
      - gene set
      - signature
    description: >-
      A Set whose members are genes (the dig.geneset standard from
      flannick/dig-gene-set-extractors). No ontology term is asserted as
      class_uri — none resolves to "gene set" (verified against EBI OLS4) — so
      GeneSet grounds via `is_a: Set` (prov:Collection). Represents ONE named
      set of genes. A library of named sets belongs in GeneSetCollection;
      a GMT file is its separate physical serialization.
    annotations:
      dapper:source_standard: dig.geneset 0.1.0 (flannick/dig-gene-set-extractors)
    slots:
      - has_gmt_file
    slot_usage:
      has_gmt_file:
        description: >-
          Reference to a GMT file exporting this single gene set. For a row
          within a shared GMT use in_gmt_file and gmt_entry instead. Accepts File and
          any subclass, including C2M2File. Retrieval locations and checksums
          belong on the referenced file record. In a provenance document, use
          the local file record's content-derived DAPPER identifier (CURIE or
          full URI), not a bare checksum or retrieval URL.
    attributes:
      in_gene_set_collection:
        is_a: relationship
        mixins: [unhashable]  # inverse membership; avoids a collection/member hash cycle
        range: GeneSetCollection
        multivalued: true
        inlined: false
        slot_uri: dapper:inGeneSetCollection
        inverse: members
        description: >-
          Collections containing this GeneSet, independent of its GMT representation.
          A set may belong to several collections. Inverse of GeneSetCollection.members;
          when both directions are supplied in a document they must agree. Optional
          so existing forward-only membership remains valid. Excluded from identity:
          adding a collection backlink does not create a new gene set or a hash cycle.
      in_gmt_file:
        is_a: relationship
        mixins: [unhashable]  # representation locator, independent of the set's content
        range: File
        inlined: false
        slot_uri: dapper:inGmtFile
        description: >-
          File containing the row for this gene set. Reference a local File or
          C2M2File by its DAPPER identifier, paired with gmt_entry. This relation
          locates a representation; it does not assert collection membership or
          contribute to identity. A GMT may therefore contain this set's own ID
          without making that ID depend on the file's checksum.
      gmt_entry:
        is_a: literal
        mixins: [unhashable]  # row selector within a representation
        pattern: '^\S[^\t\r\n]*$'
        description: >-
          Exact first-column name identifying this gene set's row in in_gmt_file.
          This is a row key, not a line number or the human-readable node name.
          Row names must be unique within that GMT representation. May equal this
          GeneSet's id when the GMT uses DAPPER identifiers as row names. Excluded
          from identity so renaming a serialized row does not rename the set.
      assay:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - obo:OBI_0000070      # assay
        description: Assay the gene set derives from (e.g. bulk, sc).
      data_type:
        is_a: literal
        mixins: [hashable]
        description: Molecular data type (e.g. transcriptomics).
      organism:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - schema:taxonomicRange
        description: Organism (e.g. human).
      genome_build:
        is_a: literal
        mixins: [hashable]
        description: Reference genome build (e.g. hg38).
      n_genes:
        is_a: literal
        mixins: [hashable]
        range: integer
        aliases:
          - n_members
        minimum_value: 0
        description: Number of distinct genes in this single set, not across a library.
      n_sets:
        is_a: literal
        mixins: [hashable]
        range: integer
        aliases:
          - n_sets_emitted
        minimum_value: 1
        maximum_value: 1
        deprecated: Use GeneSetCollection.n_sets for a library; a GeneSet is one set.
        description: Legacy single-set count, if supplied must be 1. Libraries use GeneSetCollection.
      term:
        is_a: literal
        mixins: [hashable]
        description: The term/label a named gene set corresponds to.
      term_prefix:
        is_a: literal
        mixins: [hashable]
        description: Namespace prefix applied to term-derived set names (e.g. HuBMAP).
    rules:
      - preconditions:
          slot_conditions:
            in_gmt_file:
              required: true
        postconditions:
          slot_conditions:
            gmt_entry:
              required: true
      - preconditions:
          slot_conditions:
            gmt_entry:
              required: true
        postconditions:
          slot_conditions:
            in_gmt_file:
              required: true

  GeneSetCollection:
    is_a: Set
    aliases:
      - gene set library
    description: >-
      A collection of named GeneSet objects, commonly serialized as rows of a
      GMT file. Distinct from an individual gene set and from the physical file.
      Members may be omitted when only a library-level manifest is available;
      when supplied, members enumerates the complete collection.
    slots:
      - has_gmt_file
    slot_usage:
      has_gmt_file:
        description: >-
          File serializing this collection as GMT rows. Use the local File or
          C2M2File record's DAPPER identifier; file location and checksums belong
          on that record. No C2M2 registration is required by this class.
      members:
        range: GeneSet
        inlined: false
        inverse: in_gene_set_collection
        description: >-
          Complete list of GeneSet identifiers, not gene identifiers. The inverse
          link is GeneSet.in_gene_set_collection. Membership contributes to the
          collection's identity; the inverse backlink does not change member IDs.
      member_type:
        ifabsent: string(gene_set)
        equals_string: gene_set
      n_members:
        minimum_value: 0
        description: Number of member GeneSets; when supplied agrees with n_sets.
    attributes:
      n_sets:
        is_a: literal
        mixins: [hashable]
        range: integer
        minimum_value: 0
        aliases:
          - n_sets_emitted
        description: Number of distinct named GeneSets in the complete collection.
      n_genes:
        is_a: literal
        mixins: [hashable]
        range: integer
        minimum_value: 0
        description: >-
          Number of distinct gene identifiers in the union of all member sets.
          A gene in several sets counts once; this is not the sum of row sizes.
      assay:
        is_a: literal
        mixins: [hashable]
        description: Assay context shared by the member gene sets, if applicable.
      data_type:
        is_a: literal
        mixins: [hashable]
        description: Molecular data type shared by the member gene sets.
      organism:
        is_a: literal
        mixins: [hashable]
        description: Organism shared by the member gene sets, if applicable.
      genome_build:
        is_a: literal
        mixins: [hashable]
        description: Genome build shared by the member gene sets, if applicable.
      term_prefix:
        is_a: literal
        mixins: [hashable]
        description: Source naming convention for the GMT row names, not a CURIE declaration.

  # ======================================================================
  # BLOCK — EMBEDDINGS. An Embedding is a fixed-length numeric vector that a
  # model computed from text derived from another node (a GeneSet's name and
  # metadata, a collection's description, ...). The vector bytes are not
  # inlined: they live as one row of a shared matrix File (typically one
  # `.npy` across many collections) that the record locates with
  # has_vector_file + vector_row, the same unhashable locator pattern as
  # GeneSet.in_gmt_file + gmt_entry. Identity covers what was embedded, how
  # (model, provider, dimensions, dtype, normalization, text, template,
  # activity) and the resulting bytes (vector_sha256), so two runs that
  # produce different floats are different embeddings, while moving the
  # matrix or re-packing rows changes nothing.
  # ======================================================================
  Embedding:
    is_a: HashableNode
    mixins:
      - ProvenancedResource   # was_generated_by / was_derived_from / attribution, like Set and Dataset
    aliases:
      - vector embedding
      - text embedding
    description: >-
      A fixed-length numeric vector representing another DAPPER node, computed
      by an embedding model from text derived from that node. `embedding_of`
      names the represented node; the target's inverse `has_embedding` list is
      unhashable, so embedding a node never changes the node's own identifier.
      The vector itself is stored as a row of a shared matrix File and located
      by `has_vector_file` plus `vector_row`; those locators are unhashable and
      must be supplied together. `vector_sha256` binds the identifier to the
      stored bytes; `was_generated_by` (ProvenancedResource) names the Activity
      that ran the model.
    attributes:
      embedding_of:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        inlined: false
        slot_uri: dapper:embeddingOf
        inverse: has_embedding
        description: >-
          Identifier of the node this vector represents (a GeneSet,
          GeneSetCollection, Dataset, Claim, ...). Contributes to identity: the
          same text embedded on behalf of a different node is a different
          embedding.
      embedding_model:
        is_a: literal
        mixins: [hashable]
        description: >-
          Model identifier as published by its provider, e.g. a Hugging Face
          repository id such as
          `pritamdeka/BioBERT-mnli-snli-scinli-scitail-mednli-stsb`.
      embedding_model_version:
        is_a: literal
        mixins: [hashable]
        description: Model revision, tag, or commit, if known.
      embedding_provider:
        is_a: literal
        mixins: [hashable]
        description: Provider or runtime that served the model, e.g. huggingface, openai.
      dimensions:
        is_a: literal
        mixins: [hashable]
        range: integer
        minimum_value: 1
        description: Number of elements in the vector.
      dtype:
        is_a: literal
        mixins: [hashable]
        range: EmbeddingDtypeEnum
        description: Element type of the stored vector; the type `vector_sha256` was computed over.
      normalization:
        is_a: literal
        mixins: [hashable]
        range: EmbeddingNormalizationEnum
        description: Normalization applied before storage.
      embedded_text:
        is_a: literal
        mixins: [hashable]
        description: >-
          The exact text given to the model. Recording it makes the embedding
          reproducible and lets a reader judge what the vector represents.
      text_template:
        is_a: literal
        mixins: [hashable]
        description: >-
          Versioned name of the rule that built `embedded_text` from the
          target node, e.g. `cfde-geneset-v1`.
      vector_sha256:
        is_a: literal
        mixins: [hashable]
        pattern: '^[0-9a-f]{64}$'
        description: >-
          Hex SHA-256 of the vector's bytes in `dtype`, little-endian, C order.
          Two embeddings with different values are different records even when
          model and text agree.
      has_vector_file:
        is_a: relationship
        mixins: [unhashable]  # representation locator, independent of the vector's content
        range: File
        inlined: false
        slot_uri: dapper:hasVectorFile
        description: >-
          File holding the matrix this vector is a row of. Reference the local
          File record by its DAPPER identifier; the File's description should
          state the array layout (e.g. NumPy `.npy`, rows x dimensions, dtype).
      vector_row:
        is_a: literal
        mixins: [unhashable]  # row selector within a representation
        range: integer
        minimum_value: 0
        description: Zero-based row index of this vector within `has_vector_file`.
    rules:
      - preconditions:
          slot_conditions:
            has_vector_file:
              required: true
        postconditions:
          slot_conditions:
            vector_row:
              required: true
      - preconditions:
          slot_conditions:
            vector_row:
              required: true
        postconditions:
          slot_conditions:
            has_vector_file:
              required: true

  # ======================================================================
  # BLOCK — SINGLE-CELL: GENE PROGRAM / CELL STATE. A
  # GeneProgram is a coordinated pattern of gene activity — a factor/module
  # inferred from expression covariance (e.g. cNMF, NMF, Spectra, WGCNA) or a
  # curated gene module — representing a biological process a cell can turn
  # on or off; it extends Set the same way GeneSet does, with genes as
  # members. A CellState is the cellular phenotype defined by which
  # GenePrograms are active in a cell (or cell population) at once —
  # distinct from a cell TYPE (a Cell Ontology class), which is what lineage
  # a cell belongs to rather than what state it is currently in.
  # ======================================================================

  GeneProgram:
    is_a: Set
    aliases:
      - gene program
      - gene expression program
      - GEP
      - metagene
    description: >-
      A Set whose members are genes that co-vary as a coordinated unit and
      together carry out a biological process — a factor from matrix
      factorization (cNMF, NMF, Spectra, WGCNA) or a curated gene module. No
      ontology term is asserted as class_uri — none resolves to "gene
      program" / "gene expression program" (verified against EBI OLS4) — so
      GeneProgram grounds via `is_a: Set` (prov:Collection), the same way
      GeneSet does. Distinct from GeneSet: a GeneSet is typically a static
      annotation (e.g. an MSigDB term); a GeneProgram is inferred from
      expression covariance and is usually a quantitative loading over genes,
      not just membership. `member_weights`, when present, is that loading —
      one number per gene in `members`, positionally paired. A very large
      loading matrix should still reference its source file via the
      member-manifest escape hatch `Set` already provides rather than
      enumerate weights here.
    attributes:
      assay:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - obo:OBI_0000070      # assay
        description: Assay the program was inferred from (e.g. scRNA-seq).
      organism:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - schema:taxonomicRange
        description: Organism (e.g. human).
      inference_method:
        is_a: literal
        mixins: [hashable]
        description: >-
          Method used to derive the program (e.g. cNMF, NMF, Spectra, WGCNA,
          curated).
      biological_process:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        description: >-
          GO biological process CURIE(s) this program represents, e.g.
          `obo:GO_0006629`.
      n_genes:
        is_a: literal
        mixins: [hashable]
        range: integer
        aliases:
          - n_members
        description: Count of unique genes in the program.
      member_weights:
        is_a: literal
        mixins: [hashable]
        range: float
        multivalued: true
        aliases:
          - loadings
          - gene_weights
        description: >-
          Quantitative loading/weight for each gene in `members`, positionally
          paired and equal in length to it (`members[i]` <->
          `member_weights[i]`) — e.g. an NMF/cNMF factor loading, or another
          continuous per-gene activity score. Not necessarily raw expression:
          it is whatever per-gene number the `inference_method` produces.
          Reordering or resizing one list without the other breaks the
          pairing.
      quality_score:
        range: GeneProgramQualityScore
        inlined: true
        mixins: [hashable]
        description: >-
          Assessment of this program's overall quality — a composite
          `quality_score` value plus the `components` (stability, confounders,
          validity) it is composited from — see GeneProgramQualityScore.

  GeneProgramQualityScore:
    aliases:
      - gene program quality score
      - GEP quality score
    description: >-
      Assessment of the overall quality of a `GeneProgram`, embedded inline on
      its `quality_score` attribute. One number summarizing how trustworthy a
      program is.
    attributes:
      quality_score:
        is_a: literal
        mixins: [hashable]
        range: float
        minimum_value: 0
        maximum_value: 100
        description: >-
          Weighted composite of `components`: 20% Stability + 30% Confounders
          + 50% Validity.
      components:
        range: GeneProgramQualityComponents
        inlined: true
        mixins: [hashable]
        description: The three sub-scores `quality_score` is composited from.

  GeneProgramQualityComponents:
    description: >-
      The three independent dimensions assessed for a `GeneProgram`'s quality,
      nested under `GeneProgramQualityScore.components`.
    attributes:
      stability_score:
        is_a: literal
        mixins: [hashable]
        range: float
        minimum_value: 0
        maximum_value: 100
        description: >-
          Did the method run correctly? Measures reproducibility of gene
          programs across cNMF runs and random seeds. Weighted 20% into
          `quality_score`.
      confounder_score:
        is_a: literal
        mixins: [hashable]
        range: float
        minimum_value: 0
        maximum_value: 100
        description: >-
          Are there technical confounders masking the biology? Measures
          cross-dataset alignment and agreement — batch effects are one
          example of a confounder. Weighted 30% into `quality_score`.
      validity_score:
        is_a: literal
        mixins: [hashable]
        range: float
        minimum_value: 0
        maximum_value: 100
        description: >-
          Is the output real biology? Evidence from hallmark pathway
          enrichment, GWAS genetic signals, and cell-surface markers.
          Weighted 50% into `quality_score`.

  CellState:
    is_a: HashableNode
    mixins:
      - ProvenancedResource
    aliases:
      - cellular phenotype
      - cell type state
    description: >-
      A cellular phenotype defined by the combination of GenePrograms active
      in a cell (or cell population) — e.g. "activated", "exhausted",
      "hypoxic". Distinct from a cell TYPE (a Cell Ontology class, e.g.
      `obo:CL_0000542`): a CellState is a functional/transcriptional state a
      cell of a given type can transition into and out of, defined by which
      programs are switched on — not which lineage the cell belongs to. No
      ontology term is asserted as class_uri — no term resolving to "cell
      state" as a generic, cross-cell-type phenotype was found (verified
      against EBI OLS4) — so CellState grounds via `is_a: HashableNode`
      directly. Mixes in `ProvenancedResource` so a CellState is citable and
      attributable the same way a `GeneProgram` (via `Set`) already is.
    attributes:
      description:
        is_a: literal
        mixins: [hashable]
        description: Free-text description of the cell state.
      cell_type:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: >-
          Cell Ontology (CL) CURIE of the cell type this state applies to,
          e.g. `obo:CL_0000542`.
      organism:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - schema:taxonomicRange
        description: Organism (e.g. human).
      has_program:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: dapper:hasProgram
        description: >-
          GeneProgram id(s) active in this state. The combination of these —
          not any single program — is what defines the state.
      allow_hard_call:
        is_a: literal
        mixins: [hashable]
        range: boolean
        description: Whether this state may be manually called with high confidence despite mixed evidence.
      biological_category:
        is_a: literal
        mixins: [hashable]
        description: High-level biological category this state belongs to.
      biological_description:
        is_a: literal
        mixins: [hashable]
        description: Longer prose description of the state's biology.
      cell_type_id:
        is_a: literal
        mixins: [hashable]
        description: Ontology identifier for the cell type this state applies to.
      cell_type_label:
        is_a: literal
        mixins: [hashable]
        description: Human-readable label for the cell type.
      curation_notes:
        is_a: literal
        mixins: [hashable]
        description: Free-text curator notes on this state.
      curation_version:
        is_a: literal
        mixins: [hashable]
        description: Version of the curation applied to this state.
      disease_context:
        is_a: literal
        mixins: [hashable]
        description: Disease context this state was curated in, if any.
      display_name:
        is_a: literal
        mixins: [hashable]
        description: Human-readable name for portal display.
      display_order:
        is_a: literal
        mixins: [hashable]
        range: integer
        description: Sort order for portal display.
      do_not_overinterpret_as:
        is_a: literal
        mixins: [hashable]
        description: Caveat naming a stronger claim this state should not be read as.
      gene_expression_caveat:
        is_a: literal
        mixins: [hashable]
        description: Caveat about interpreting the underlying gene expression evidence.
      gene_expression_followup:
        is_a: literal
        mixins: [hashable]
        description: Suggested follow-up analysis for the gene expression evidence.
      gene_expression_interpretation:
        is_a: literal
        mixins: [hashable]
        description: Curator's interpretation of the gene expression evidence.
      gene_expression_overinterpretation_warning:
        is_a: literal
        mixins: [hashable]
        description: Warning against overinterpreting the gene expression evidence.
      gene_set_description:
        is_a: literal
        mixins: [hashable]
        description: Description of the gene set(s) underlying this state.
      hard_call_notes:
        is_a: literal
