  Agent:
    mixin: true
    class_uri: prov:Agent
    exact_mappings:
      - foaf:Agent
      - dcterms:Agent
    aliases:
      - agent
      - responsible party
    description: >-
      Mixin for a person or organization (creator, contributor, responsible
      party). Applied to Node subclasses.

  Person:
    is_a: HashableNode
    mixins:
      - Agent
    class_uri: schema:Person
    exact_mappings:
      - foaf:Person
      - prov:Person
    aliases:
      - individual
      - investigator
    description: An individual person acting as a creator, contributor, or other responsible party.
    attributes:
      given_name:
        is_a: literal
        mixins: [hashable]
        slot_uri: schema:givenName
        exact_mappings:
          - foaf:givenName
        aliases:
