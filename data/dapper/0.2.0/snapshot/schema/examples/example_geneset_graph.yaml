# ---- Analysis steps (dig.geneset AnalysisType -> DAPPER Activity) ----
activities:
  # upstream workflow step
  - id: dapper:Activity.05pPafZhEiT_hub-b_WKAgdOs8rFR1QR
    name: prepare_hubmap_unsigned_term_gene
    activity_type: workflow
    command: >-
      python -m geneset_extractors.cli workflows hubmap_asctb_augmented
      --input_matrix s3://.../HZ1/workflow/gene_attribute_matrix.txt.gz
      --human_gene_info https://ftp.ncbi.nih.gov/.../Homo_sapiens.gene_info.gz
      --augmentation_threshold 0.67 --cap_multiplier 4
    entrypoint: geneset-extractors workflows hubmap_asctb_augmented
    repo_url: https://github.com/flannick/dig-gene-set-extractors
    script_url: https://github.com/flannick/dig-gene-set-extractors
    code_version: 2fb57130136a8fa25211ef1e77fe13d220e4b115
    has_agentic_workspace:
      - dapper:AgenticWorkspace._T8w34F1J1K-OE4-e7bT-_tdqjj8Zb_H
    dcc_url: https://github.com/flannick/dig-gene-set-extractors
    drc_url: https://github.com/flannick/dig-gene-set-extractors

  # converter step that emits the gene set
  - id: dapper:Activity.hyXTofaQO9E8PnynkwQJt_KVxHGTAYFd
    name: generate_402cf4a1f3682a2e5bf1b002
    activity_type: converter_invocation
    command: >-
      python -m geneset_extractors.cli convert unsigned_term_gene
      --emit_small_gene_sets false --gene_id_column gene_id
      --gene_symbol_column gene_symbol --gmt_min_genes 5 --score_column score
      --term_column term --term_prefix HuBMAP
    observed_command: >-
      python -m geneset_extractors.cli convert unsigned_term_gene
      --table_tsv s3://.../HZ2/workflow/hubmap_unsigned_term_gene.tsv
      --out_dir s3://.../HZ2/extractor --organism human --genome_build hg38
    entrypoint: geneset-extractors convert unsigned_term_gene
    repo_url: https://github.com/flannick/dig-gene-set-extractors
    script_url: https://github.com/flannick/dig-gene-set-extractors
    code_version: 2fb57130136a8fa25211ef1e77fe13d220e4b115
    has_agentic_workspace:
      - dapper:AgenticWorkspace._T8w34F1J1K-OE4-e7bT-_tdqjj8Zb_H
    container_image: null
    dcc_url: https://github.com/flannick/dig-gene-set-extractors
    drc_url: https://github.com/flannick/dig-gene-set-extractors

# ===========================================================================
# ILLUSTRATIVE — the agentic replay path for the gene-set pipeline.
#
# ONE workspace serves BOTH activities: they are two steps of the same
# dig-gene-set-extractors run, so a single fork regenerates the pair. The
# Activities keep their own `command` and `code_version` for exact machine
# replay; this is the "ask an agent to redo it" path alongside them.
#
# The fork slug is a placeholder — no such fork exists yet. The pipeline
# parameters inside the prompt are REAL, taken from the two activities below.
# ===========================================================================
agentic_workspaces:
  - id: dapper:AgenticWorkspace._T8w34F1J1K-OE4-e7bT-_tdqjj8Zb_H
    name: dig-gene-set-extractors — HuBMAP HZ2
    platform: akleao
    workspace_url: https://www.akleao.com/fork/dig-geneset-hubmap-hz2
    workspace_key: dig-geneset-hubmap-hz2
    agent_model: claude-fable-5
    regeneration_prompt: >-
      Regenerate HuBMAP gene-set library 402cf4a1f3682a2e5bf1b002 (ASCT+B
      augmented markers, model HZ2, human, hg38) by re-running both steps of
      the dig-gene-set-extractors pipeline pinned to commit
      2fb57130136a8fa25211ef1e77fe13d220e4b115.

      Step 1 — `geneset-extractors workflows hubmap_asctb_augmented`: take the
      released ASCT+B marker table (gene_attribute_matrix.txt.gz) and NCBI
      human_gene_info as inputs, with augmentation_threshold 0.67 and
      cap_multiplier 4. It should emit hubmap_unsigned_term_gene.tsv and
      asctb_geneshot_augmented_genes.tsv.

      Step 2 — `geneset-extractors convert unsigned_term_gene` over that table,
      with emit_small_gene_sets false, gene_id_column gene_id,
      gene_symbol_column gene_symbol, gmt_min_genes 5, score_column score,
      term_column term, term_prefix HuBMAP. It should emit the gene set plus
      genesets.gmt, geneset.tsv, geneset.full.tsv, signature_summary.tsv and
      geneset.meta.json.

      Record each step as a NEW Activity with its own C2M2 file outputs and
      checksums. Do not overwrite the existing provenance. Then compare the
      regenerated checksums against the originals and report any that differ —
      any claim of divergence should include the differing checksums.

