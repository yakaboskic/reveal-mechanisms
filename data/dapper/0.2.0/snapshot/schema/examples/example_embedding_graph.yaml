# (example_geneset_collection_rows.yaml). All records are illustrative.
#
# The GeneSet and GeneSetCollection ids are the same as in that example:
# `has_embedding` is unhashable, so attaching embeddings does not re-mint them.
# The Embedding, File and Activity records were minted from temporary `urn:tmp:` ids
# with:  uv run schema/identity/dapper_identity.py assign <this file>
# The matrix data/example_embeddings.f16.npy holds 3 rows x 4 dims (float16);
# each vector_sha256 is the SHA-256 of that row's bytes, and the File checksums
# are those of the .npy file itself.
