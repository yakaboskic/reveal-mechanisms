agentic_workspaces:
  - id: dapper:AgenticWorkspace._T8w34F1J1K-OE4-e7bT-_tdqjj8Zb_H
    name: "dig-gene-set-extractors — HuBMAP HZ2"
    platform: akleao
    workspace_url: https://www.akleao.com/fork/dig-geneset-hubmap-hz2
    workspace_key: dig-geneset-hubmap-hz2
    agent_model: claude-fable-5
    regeneration_prompt: "Regenerate HuBMAP gene-set library 402cf4a1f3682a2e5bf1b002 (ASCT+B augmented markers, model HZ2, human, hg38) by re-running both steps of the dig-gene-set-extractors pipeline pinned to commit 2fb57130136a8fa25211ef1e77fe13d220e4b115.\nStep 1 — `geneset-extractors workflows hubmap_asctb_augmented`: take the released ASCT+B marker table (gene_attribute_matrix.txt.gz) and NCBI human_gene_info as inputs, with augmentation_threshold 0.67 and cap_multiplier 4. It should emit hubmap_unsigned_term_gene.tsv and asctb_geneshot_augmented_genes.tsv.\nStep 2 — `geneset-extractors convert unsigned_term_gene` over that table, with emit_small_gene_sets false, gene_id_column gene_id, gene_symbol_column gene_symbol, gmt_min_genes 5, score_column score, term_column term, term_prefix HuBMAP. It should emit the gene set plus genesets.gmt, geneset.tsv, geneset.full.tsv, signature_summary.tsv and geneset.meta.json.\nRecord each step as a NEW Activity with its own C2M2 file outputs and checksums. Do not overwrite the existing provenance. Then compare the regenerated checksums against the originals and report any that differ — any claim of divergence should include the differing checksums."
  - id: dapper:AgenticWorkspace.ZkRMX4AJp5BqBQDoFK0H12bzTXwTRDKU
    name: "REVEAL enrichment — Dent disease"
    platform: akleao
    workspace_url: https://www.akleao.com/fork/reveal-enrichment-dent
    workspace_key: reveal-enrichment-dent
    agent_model: claude-fable-5
    last_run: '2026-08-04T20:00:00Z'
    regeneration_prompt: "Re-run the REVEAL enrichment for Dent disease. Load gene set dapper:GeneSetCollection.vvsPZPAngtszG8nlTsPoqLiDoJ08Yvne (HuBMAP ASCT+B augmented marker library, model HZ2, human/hg38) from its C2M2 provenance. Test each named marker set for over-representation among genes implicated in Dent disease (MONDO:0015612) using Fisher's exact test with Benjamini-Hochberg FDR at 0.05. Report every set reaching significance with its odds ratio, raw and adjusted p-values, and overlapping genes. Emit the result as a DAPPER Claim assessing a Proposition about enrichment, preserve each metric in a typed ClaimScore, and record this run as a new Activity — do not overwrite the existing one."
