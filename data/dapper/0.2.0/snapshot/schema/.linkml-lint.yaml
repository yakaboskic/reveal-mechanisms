# uv run --with linkml linkml-lint -c schema/.linkml-lint.yaml schema/dapper.yaml
rules:
  recommended:
    level: warning
  no_xsd_int_type:
    level: error
  no_invalid_slot_usage:
    level: error
  no_undeclared_slots:
    level: error
  no_undeclared_ranges:
    level: error
  one_identifier_per_class:
    level: error
  one_key_per_class:
    level: error
  root_type_checks:
    level: error
  standard_naming:
    level: warning
    # CausalLinkTypeEnum's values are copied verbatim from DISMECH's own
    # CausalLinkTypeEnum (see schema/dapper.yaml) so a causal step round-trips
    # with no value translation. Renaming them here would break that.
    exclude:
      - DIRECT
      - INDIRECT_KNOWN_INTERMEDIATES
      - INDIRECT_UNKNOWN_INTERMEDIATES
      - UNKNOWN
      # DIG ancestry folder codes round-trip without changing case.
      - AA
      - AF
      - EA
      - EU
      - GME
      - HS
      - Mixed
      - SA
      - SSAF
  canonical_prefixes:
    level: warning
