[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reveal-backend"
version = "0.1.0"
description = "Backend components for REVEAL Mechanisms"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "sse-starlette==3.0.3", "pypdf==6.19.0", "numpy>=1.26,<3", "certifi>=2024.2.2", "fastapi==0.115.12", "uvicorn==0.34.2", "PyJWT==2.10.1", "httpx==0.28.1", "PyMySQL==1.1.2", "python-dotenv==1.1.0", "PyYAML==6.0.2", "jsonschema==4.23.0", "linkml==1.11.1", "rdflib==7.6.0", "quickjs==1.19.4", "boto3==1.40.45", "redis==6.4.0", "upstash-workflow==2.0.0", "qstash==3.4.0", "upstash-vector==0.8.0"]

[project.optional-dependencies]
eaggl = ["scipy>=1.11,<2", "PyMySQL==1.1.2", "python-dotenv>=1.0,<2"]
dismech = ["PyMySQL==1.1.2", "python-dotenv>=1.0,<2"]
evidence = ["PyYAML==6.0.2", "linkml==1.11.1", "rdflib==7.6.0"]

[tool.setuptools.packages.find]
where = ["src"]
