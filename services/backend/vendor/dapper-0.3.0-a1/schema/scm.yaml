id: https://broadinstitute.github.io/dapper/model/schema/scm.yaml
name: dapper_scm
title: DAPPER structural causal models
description: >-
  Structural causal models (SCMs) on top of the general causal classes in
  claims.yaml. A `StructuralCausalModel` is a `CausalGraph` (its causal
  diagram) that also gives each variable a domain, says which variables are
  latent, attaches a distribution to each variable with no causes in the
  model, and gives each other variable a `StructuralEquation` in its causes.
  A `CausalEstimand` is a Proposition naming a causal quantity defined in a
  model (an average, direct or indirect effect under stated interventions);
  estimates of it are Claims with EFFECT_ESTIMATE scores, so assessment stays
  on Claim. SCMs are acyclic for now. An unmeasured common cause is an
  explicit latent variable with ordinary causal links. A fitted model is its
  own record, generated by the fitting Activity and derived from the model it
  fits. A `DiscriminatingExperiment` proposes an experiment in these terms:
  the estimands it would measure, any instruments, and what each tested
  proposition predicts each estimand will show.
license: https://opensource.org/license/mit
version: 0.3.0-a1

default_prefix: dapper
default_range: string

prefixes:
  dapper: https://broadinstitute.github.io/dapper/ns#
  dapper_class: https://broadinstitute.github.io/dapper/model/reference/classes/
  dapper_slot: https://broadinstitute.github.io/dapper/model/reference/slots/
  dapper_enum: https://broadinstitute.github.io/dapper/model/reference/enums/
  dapper_type: https://broadinstitute.github.io/dapper/model/reference/types/
  linkml: https://w3id.org/linkml/

imports:
  - linkml:types
  - core
  - claims

# ===========================================================================
# ENUMS
# ===========================================================================
enums:
  VariableDomainEnum:
    description: The values a variable can take in one model.
    permissible_values:
      BINARY:
        description: Two values; name them in `levels`.
      CATEGORICAL:
        description: Unordered categories; name them in `levels`.
      ORDINAL:
        description: Ordered categories; list them in order in `levels`.
      CONTINUOUS:
        description: Real-valued; give the `unit` where there is one.
      COUNT:
        description: Non-negative integers.
  FunctionalFormEnum:
    description: The form of a structural equation.
    permissible_values:
      LINEAR:
        description: The outcome is a weighted sum of its inputs plus noise.
      LOGISTIC:
        description: The log-odds of a binary outcome is a weighted sum of its inputs.
      LOG_LINEAR:
        description: The log of the outcome's mean is a weighted sum of its inputs.
      NONPARAMETRIC:
        description: No functional form is assumed; only the inputs are stated.
      CUSTOM:
        description: The form is given in `expression`.
  DistributionFamilyEnum:
    description: The family of a distribution; its parameters are named in `parameters`.
    permissible_values:
      NORMAL:
        description: Gaussian; parameters `mean` and `sd`.
      BERNOULLI:
        description: One binary trial; parameter `p`.
      CATEGORICAL:
        description: One draw over named levels; one probability per level.
      POISSON:
        description: Counts; parameter `rate`.
      UNIFORM:
        description: Uniform on an interval; parameters `lower` and `upper`.
      EMPIRICAL:
        description: Given by data rather than a parametric family; say where in `description`.
  EstimandKindEnum:
    description: >-
      The causal quantity a CausalEstimand names, always a population
      average. Average and controlled direct effects are defined by
      interventions alone. Natural direct and indirect effects are nested
      counterfactuals: they hold the mediator at the value it would take
      under the other treatment, which a structural causal model defines but
      experiments on the treatment and mediator cannot identify by
      themselves.
    permissible_values:
      AVERAGE_EFFECT:
        description: >-
          The change in the outcome's mean when the treatment is set to one
          value rather than the reference value, across the population.
      CONDITIONAL_AVERAGE_EFFECT:
        description: The average effect within a subpopulation stated in the contexts or scope.
      CONTROLLED_DIRECT_EFFECT:
        description: The effect of the treatment with the mediator held at a fixed value.
      NATURAL_DIRECT_EFFECT:
        description: >-
          The effect of the treatment with the mediator held at the value it
          would take under the reference treatment.
      NATURAL_INDIRECT_EFFECT:
        description: >-
          The part of the effect transmitted through the mediator: the change
          when only the mediator moves to its value under the treatment.
  EffectScaleEnum:
    description: The scale on which an effect is expressed.
    permissible_values:
      DIFFERENCE:
        description: Difference in means or risks (treatment minus reference).
      RATIO:
        description: Ratio of means or risks.
      ODDS_RATIO:
        description: Ratio of odds.
      HAZARD_RATIO:
        description: Ratio of hazards.
      LOG_ODDS_RATIO:
        description: Natural log of the odds ratio, as a logistic-regression or GWAS beta reports it.
      STANDARDIZED_DIFFERENCE:
        description: >-
          Difference in means on a standardized or normalized scale, such as
          an eQTL's normalized effect size; name the normalization in the
          interpretation.
  PredictedChangeEnum:
    description: >-
      What an estimand is predicted to show: a change in a direction, no
      change, or a change without a single sign. A CausalEstimand states what
      its own model predicts; an experiment's predictions state what each
      tested proposition predicts.
    permissible_values:
      INCREASES:
        description: The outcome is higher under the intervention than under the reference.
      DECREASES:
        description: The outcome is lower under the intervention than under the reference.
      NO_CHANGE:
        description: The outcome does not differ beyond the experiment's resolution.
      CHANGES:
        description: The outcome differs, without a single predicted sign.

# Slots shared by several classes, declared once so each has one URI.
slots:
  variable:
    is_a: relationship
    range: CausalVariable
    slot_uri: dapper:variable
    description: The CausalVariable an entry is about.
  outcome:
    is_a: relationship
    mixins: [hashable]
    range: CausalVariable
    inlined: false
    slot_uri: dapper:outcome
    description: The variable a structural equation determines, or whose change an estimand measures.
  parameters:
    is_a: literal
    range: Parameter
    multivalued: true
    inlined: true
    inlined_as_list: true
    slot_uri: dapper:parameters
    description: Named numeric parameters.
  effect_scale:
    is_a: literal
    mixins: [hashable]
    range: EffectScaleEnum
    slot_uri: dapper:effect_scale
    description: The scale an effect is expressed on.
  predicted_change:
    is_a: literal
    mixins: [hashable]
    range: PredictedChangeEnum
    slot_uri: dapper:predicted_change
    description: What the estimand is predicted to show.

# ===========================================================================
# CLASSES
# ===========================================================================
classes:

  Parameter:
    description: A named numeric parameter of an equation or distribution. An inline value.
    attributes:
      symbol:
        is_a: literal
        required: true
        pattern: '\S'
        description: The parameter's name, as used in `expression` or by the distribution family.
      value:
        is_a: literal
        range: float
        required: true
        description: The parameter's value.
      description:
        is_a: literal
        description: What the parameter means, in words.

  Distribution:
    description: A probability distribution, given by family and parameters. An inline value.
    slots:
      - parameters
    slot_usage:
      parameters:
        description: The family's parameters (e.g. `mean` and `sd` for NORMAL).
    attributes:
      family:
        is_a: literal
        range: DistributionFamilyEnum
        required: true
        description: The distribution family.
      description:
        is_a: literal
        description: Anything the family and parameters leave out, such as the data an EMPIRICAL distribution comes from.

  VariableSpecification:
    description: >-
      How one model treats one of its variables: its domain, whether it is
      observed, and, for a variable with no causes in the model, its
      distribution. An inline value: the same CausalVariable can be binary in
      one model and continuous in another without changing its identifier.
    slots:
      - variable
    slot_usage:
      variable:
        required: true
    attributes:
      domain:
        is_a: literal
        range: VariableDomainEnum
        slot_uri: dapper:domain
        description: The values the variable takes in this model.
      levels:
        is_a: literal
        multivalued: true
        description: The named values of a BINARY, CATEGORICAL or ORDINAL variable, in order.
      unit:
        is_a: literal
        description: Unit of a CONTINUOUS or COUNT variable.
      observed:
        is_a: literal
        range: boolean
        slot_uri: dapper:observed
        description: >-
          False for a latent variable, such as an unmeasured common cause.
          Omission means observed.
      distribution:
        is_a: literal
        range: Distribution
        inlined: true
        description: >-
          Distribution of a variable with no causes in this model. A variable
          with causes gets a StructuralEquation instead.

  StructuralEquation:
    description: >-
      How one variable is determined by its causes in a model. Its inputs
      must be exactly the variable's causes in the model's graph. An inline
      value.
    slots:
      - outcome
      - parameters
    slot_usage:
      outcome:
        required: true
      parameters:
        description: The equation's parameters.
    attributes:
      inputs:
        is_a: relationship
        range: CausalVariable
        multivalued: true
        slot_uri: dapper:inputs
        description: The outcome's causes in the model; each must have a link to the outcome.
      functional_form:
        is_a: literal
        range: FunctionalFormEnum
        slot_uri: dapper:functional_form
        description: The form of the equation.
      expression:
        is_a: literal
        description: >-
          The equation, using variable names and parameter symbols, e.g.
          `M = b * X + e_M`. Required in spirit for CUSTOM.
      noise:
        is_a: literal
        range: Distribution
        inlined: true
        description: The distribution of the equation's own independent noise term.

  StructuralCausalModel:
    is_a: CausalGraph
    description: >-
      A CausalGraph with the functional and probabilistic content of a
      structural causal model: a VariableSpecification per variable, a
      distribution for each variable with no causes, and a StructuralEquation
      for each other variable. The graph is the model's causal diagram. Acyclic:
      `has_feedback` must not be true. An unmeasured common cause is a latent
      variable (observed false) with ordinary links to what it causes. A
      model fitted to data is its own record, generated by the fitting
      Activity and derived (was_derived_from) from the model it fits.
    slot_usage:
      has_feedback:
        description: Must not be true; DAPPER's structural causal models are acyclic for now.
    attributes:
      variable_specifications:
        is_a: literal
        mixins: [hashable]
        range: VariableSpecification
        multivalued: true
        inlined: true
        inlined_as_list: true
        slot_uri: dapper:variable_specifications
        description: At most one entry per variable in `variables`. Order is part of identity.
      equations:
        is_a: literal
        mixins: [hashable]
        range: StructuralEquation
        multivalued: true
        inlined: true
        inlined_as_list: true
        slot_uri: dapper:equations
        description: At most one equation per variable; none for a variable with no causes.

  Intervention:
    description: >-
      Setting one variable to a value, contrasted with a reference value
      (`do(X = value)` rather than `do(X = reference_value)`). An inline value.
    slots:
      - variable
    slot_usage:
      variable:
        required: true
    attributes:
      value:
        is_a: literal
        required: true
        pattern: '\S'
        description: The value the variable is set to.
      reference_value:
        is_a: literal
        description: The value it is contrasted with, when the estimand is a contrast.

  EffectPrediction:
    description: >-
      What one proposition predicts an estimand will show: if the
      proposition holds (or, with `proposition_holds: false`, if it fails),
      the outcome changes this way under the estimand's interventions. An
      inline value.
    slots:
      - proposition
      - predicted_change
    slot_usage:
      proposition:
        required: true
        description: The proposition whose truth or falsity the prediction follows from.
      predicted_change:
        required: true
    attributes:
      estimand:
        is_a: relationship
        range: CausalEstimand
        required: true
        slot_uri: dapper:estimand
        description: The causal quantity the prediction is about; one of the experiment's estimands.
      proposition_holds:
        is_a: literal
        range: boolean
        slot_uri: dapper:proposition_holds
        description: >-
          False for what follows if the proposition fails, such as no change
          when a link does not exist. Omission means it holds.
      rationale:
        is_a: literal
        description: Why the proposition predicts this, in words.

  DiscriminatingExperiment:
    is_a: ProposedExperiment
    description: >-
      A proposed experiment stated causally: the causal estimands it would
      measure (each a treatment set by an intervention, contrasted with a
      reference value, and an outcome read out), the instruments it would
      use when the treatment cannot be set directly, and what each tested
      proposition predicts. It discriminates: on at least one estimand, two
      predictions from different propositions (or a proposition holding and
      failing) differ. The experimental system is its `contexts`.
    attributes:
      estimands:
        is_a: relationship
        mixins: [hashable]
        range: CausalEstimand
        inlined: false
        multivalued: true
        required: true
        minimum_cardinality: 1
        slot_uri: dapper:estimands
        description: >-
          The causal quantities the experiment would measure, such as the
          average effect of knocking out a gene on a readout, one per
          readout.
      instruments:
        is_a: relationship
        mixins: [hashable]
        range: CausalVariable
        inlined: false
        multivalued: true
        slot_uri: dapper:instruments
        description: >-
          Instrumental variables: variables that shift a treatment, affect
          the outcome only through it, and share no cause with the outcome
          (e.g. a GenotypeVariable in Mendelian randomization). Used when
          the treatment cannot be set by the investigator.
      predictions:
        is_a: literal
        mixins: [hashable]
        range: EffectPrediction
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 2
        slot_uri: dapper:predictions
        description: >-
          What each tested proposition predicts each estimand will show. At
          least two predictions on one estimand must differ. Order is part
          of identity.

  CausalEstimand:
    is_a: Proposition
    description: >-
      A causal quantity defined in a model: the effect of a treatment on an
      outcome under stated interventions, on a stated scale. Its statement
      names the quantity; a Claim with an EFFECT_ESTIMATE score gives its
      value, so estimates from different methods or data assess the same
      estimand. The model is the inherited `explanatory_model`.
      `predicted_change` says which way the model predicts the outcome moves
      under the interventions, so a Claim's SUPPORTS or DISPUTES reads
      against that prediction rather than against prose.
    slots:
      - outcome
      - effect_scale
      - predicted_change
    slot_usage:
      outcome:
        required: true
      predicted_change:
        description: >-
          The change the estimand's model predicts in the outcome under the
          interventions, composed from the signs of the links between
          treatment and outcome. A Claim with a direction on this estimand
          SUPPORTS it when the evidence shows this change and DISPUTES it when
          the evidence shows otherwise. Required for such a Claim.
      relation_kind:
        required: true
        equals_string: CAUSATION
      relation:
        description: Not used on a CausalEstimand.
      subject_entity:
        description: Not used on a CausalEstimand; the treatment variable names the entity.
      object_entity:
        description: Not used on a CausalEstimand; the outcome variable names the entity.
    attributes:
      estimand_kind:
        is_a: literal
        mixins: [hashable]
        range: EstimandKindEnum
        required: true
        slot_uri: dapper:estimand_kind
        description: Which causal quantity this is.
      treatment:
        is_a: relationship
        mixins: [hashable]
        range: CausalVariable
        inlined: false
        required: true
        slot_uri: dapper:treatment
        description: The variable intervened on.
      mediator:
        is_a: relationship
        mixins: [hashable]
        range: CausalVariable
        inlined: false
        slot_uri: dapper:mediator
        description: The mediator, for a direct or indirect effect.
      interventions:
        is_a: literal
        mixins: [hashable]
        range: Intervention
        multivalued: true
        inlined: true
        inlined_as_list: true
        slot_uri: dapper:interventions
        description: >-
          The interventions that define the contrast: the treatment's value
          and reference value, and for a CONTROLLED_DIRECT_EFFECT the
          mediator's fixed value.
