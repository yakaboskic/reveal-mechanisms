slots:
  has_embedding:
    description: 'Embedding records computed from this node (one per embedding model
      or text template). Available on every Node. Unhashable: attaching, replacing,
      or removing an embedding leaves the node''s identifier unchanged. The forward,
      hashable direction is Embedding.embedding_of; if both are supplied they must
      agree.'
    inlined: false
    inverse: embedding_of
    is_a: relationship
    mixins:
    - unhashable
    multivalued: true
    range: Embedding
    slot_uri: dapper:hasEmbedding
  has_gmt_file:
    description: Local File or C2M2File record serializing a gene-set collection,
      or a whole-file export of a single GeneSet. Use its content-derived DAPPER identifier,
      not a bare checksum or retrieval URL. A row in a shared GMT is selected with
      GeneSet.in_gmt_file and gmt_entry instead.
    inlined: false
    is_a: relationship
    mixins:
    - hashable
    range: File
    slot_uri: dapper:hasGmtFile
  hashable:
    description: Marks a slot as constituting the identity of its instance. Changing
      its value changes the instance's digest and therefore its `id`.
  id:
    aliases:
    - identifier
    - PID
    close_mappings:
    - DataCite:hasIdentifier
    description: "Unique identifier for a node \u2014 a CURIE shorthand or a full\
      \ URI. For a Dataset this is its persistent identifier (e.g. a DOI)."
    exact_mappings:
    - dcterms:identifier
    identifier: true
    is_a: literal
    required: true
    slot_uri: schema:identifier
  literal:
    description: 'Abstract base for scalar (data) attributes. Concrete scalar slots
      declare `is_a: literal`.'
    range: string
    slot_uri: rdfs:literal
  name:
    aliases:
    - title
    - label
    description: Human-readable name/label for a node.
    exact_mappings:
    - schema:name
    - dcterms:title
    is_a: literal
    mixins:
    - hashable
    slot_uri: rdfs:label
  relationship:
    description: 'Abstract base for cross-references between nodes. Concrete reference
      slots declare `is_a: relationship` with `range: uriorcurie` and point at another
      node''s `id`.'
    range: uriorcurie
    slot_uri: rdf:type
  unhashable:
    description: 'Marks a slot as excluded from the digest: temporal, environmental,
      signature, mirror-observed, or a back-reference derivable from a forward edge.
      Changing it MUST NOT change the instance''s `id`.'
types:
  boolean:
    base: Bool
    description: A binary (true or false) value
    exact_mappings:
    - schema:Boolean
    notes: If you are authoring schemas in LinkML YAML, the type is referenced with
      the lower case "boolean".
    repr: bool
    uri: xsd:boolean
  float:
    base: float
    description: A real number that conforms to the xsd:float specification
    exact_mappings:
    - schema:Float
    notes: If you are authoring schemas in LinkML YAML, the type is referenced with
      the lower case "float".
    uri: xsd:float
  integer:
    base: int
    description: An integer
    exact_mappings:
    - schema:Integer
    notes: If you are authoring schemas in LinkML YAML, the type is referenced with
      the lower case "integer".
    uri: xsd:integer
  string:
    base: str
    description: A character string
    exact_mappings:
    - schema:Text
    notes: In RDF serializations, a slot with range of string is treated as a literal
      or type xsd:string. If you are authoring schemas in LinkML YAML, the type is
      referenced with the lower case "string".
    uri: xsd:string
  uri:
    base: URI
    close_mappings:
    - schema:URL
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes: If you are authoring schemas in LinkML YAML, the type is referenced with
      the lower case "uri".
    repr: str
    uri: xsd:anyURI
  uriorcurie:
    base: URIorCURIE
    description: a URI or a CURIE
    notes: If you are authoring schemas in LinkML YAML, the type is referenced with
      the lower case "uriorcurie".
    repr: str
    uri: xsd:anyURI
