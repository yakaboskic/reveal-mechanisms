<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 310" fill="none">
  <title>Choose the gap. Ground the claim.</title>
  <desc>Search or browse for DisMech knowledge gaps and choose one. The system suggests CFDE REVEAL KG mechanism factors matched to that gap's DisMech mechanisms, and you select them. Starting the investigation collects BiomarkerKG and ProKN evidence and writes a scientific account and cited claim.</desc>
