# Curated source datasets for the raw input files the CFDE producers left without lineage.
#
# What: DAPPER Dataset nodes (and the Organizations behind them) that the reference release build links to the raw
# input files of collection documents, as extra was_derived_from edges (raw File -> Dataset), and the raw inputs that
# are run bookkeeping rather than data. The producer document itself is never changed: the build stores the curated
# nodes and edges beside it (payload.curated_provenance).
#
# Why: in the 2026-10-05 snapshot only 146 of the 532 collection documents reach a Dataset through a was_derived_from
# edge. The other 386 (LINCS_L1000 HZ3 and the 383 HZ4 collections, IDG HZ2, GlyGen HZ2) end at a raw file whose
# name pigean's raw/cfde_source_datasets.yaml does not know, so their gene sets trace to no dataset or organization.
# Three collections that do reach a Dataset also use raw inputs that reach none (GTEx all_detailed_tissues HZ2's TPM
# matrix, RummaGEO HZ1/HZ2's two workflow manifests), so the lineage of their gene sets was incomplete too.
#
# How the release build applies it:
#   * to every raw file the producer left without lineage, in any collection: a File or C2M2File node (sections files,
#     c2m2_files) that is never generated (no was_generated_by), derives from nothing (no was_derived_from) and belongs
#     to no Dataset; the producer's own nodes and edges are untouched;
#   * a link or bookkeeping entry applies to the collections of its `libraries`; its `files` are regular expressions
#     (anchored, so search and full match agree) tried on each raw file's `filename`, or its `name` when it has none;
#   * a raw file matched by a link gets one was_derived_from edge to the link's dataset; one matched by a bookkeeping
#     entry is listed in payload.curated_provenance.bookkeeping_inputs and left out of every gene set's lineage
#     closure; a file matched by both refuses the build;
#   * the build refuses while a referenced gene set's lineage closure reaches no Dataset or uses a raw input that
#     reaches none. The manifest's curated block counts the edges per dataset and the inputs per bookkeeping entry.
#
# organizations: key -> an existing DAPPER Organization node, copied verbatim (id and every field) from a producer
#   collection document.
# datasets: key -> either an existing Dataset node copied verbatim (with its id; publisher and was_attributed_to are
#   Organization ids), or a new node without an id, which the build mints (runtime.compute_id(node, 'Dataset', schema))
#   from name, description, version, alternate_identifier, publisher (an organizations key) and attributed_to
#   (organizations keys; -> was_attributed_to); location is not hashed.
# links: which raw files of which libraries derive from which dataset.
# bookkeeping: which raw files of which libraries record the run itself, not data a gene set was computed from; the
#   note (required) says why.
#
# glygen_v1_12_1 is a patch, not lineage the producer recorded: GlyGen HZ2's raw files are cached api.glygen.org
# glycan-detail responses, which the producer does not tie to a release.
#
# Checked 2026-10-14 against all 532 documents of the snapshot (provenance sections only): every raw file without
# lineage that a referenced gene set's closure uses is matched (LINCS 384 collections / 384 files, IDG 1 / 1,
# GlyGen 1 / 6,620, GTEx 1 / 1; RummaGEO bookkeeping 2 / 4), and no referenced gene set's closure is left with a raw
# input that reaches no Dataset.

