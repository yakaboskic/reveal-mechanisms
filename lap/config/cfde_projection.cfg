!title CFDE gene-set projection onto EAGGL factors

# Projects every CFDE gene set (the DAPPER-annotated 2026-09-28 mirror of s3://dig-gene-set-filtered/,
# 133 GMTs / 44,399 gene sets) onto the capped EAGGL factors of the legacy 711-trait atlas
# (raw/EAGGL_capped_union_graph_share, 4,037 factors x 18,477 genes) with the packages/pigean
# supplied-factor projection (`python -m eaggl factor --factor-gene-clusters-in ...`), writing both
# the joint and the marginal gene-set loadings:
#
#   * per trait:   each trait's factors are projected jointly on their own (711 runs)
#   * all factors: every factor in one run, as the method's author described it
#
# Joint loadings are a fixed-W multiplicative-update NNLS (eaggl state.py _project_H_with_fixed_W):
# the factors in a run compete to explain each gene set, so the two joint quantities differ. Gene
# sets are solved independently, so all 44,399 go into every run (splitting them would only cost
# more jobs). Marginal loadings, clip(x'w / w'w, 0, 1), are identical under both designs.
# eaggl stops the joint update at 100 iterations or a relative change below 1e-4 (neither is a CLI
# option). The per-trait runs (K <= 15) meet the tolerance; the all-factor run (K = 4,037) is expected
# to stop at the 100-iteration cap first, so its joint loadings are a truncated, seed-dependent solve.
#
# Identifiers are carried verbatim: GMT column 1 (dapper:GeneSet.*) is eaggl's Gene_Set; the
# dapper:GeneSetCollection.* id is joined from the CFDE index; eaggl names factors by position
# (Factor1..K), so every factor file's row order is recorded and mapped back to trait::FactorN;
# each EAGGL trait is its KPN legacy_phenotype_id and is mapped to its KPN.TRAIT id (release v0.0.2
# of dig-portal-data-models, pinned by commit).
#
# The db_ stage then loads the projection into the app as a reference generation and cuts each allow-listed
# environment (config/reference_reload.targets.yaml -> one reload_target instance each) over to it with the
# backend CLI `python -m reveal_backend.reference_reload` (docs/reference-reload.md sections 7 and 10). The
# project-level steps are additive and the per-target plans read-only; every destructive step (db_apply_cmd,
# db_purge_cmd) needs an approval file that only the interactive `approve` subcommand writes, so an unattended
# run stops at "plans ready".
#
# The meta is generated, never hand-edited:
#   python3 scripts/build_meta_yaml.py
#   PYTHONPATH=/humgen/diabetes2/users/chase/packages/meta-sanity python3 -m meta_sanity.generate_meta \
#       config/cfde_projection.meta.yaml config/cfde_projection.meta
# Run sequence, checks and output schema: ../README.md

lap_home=/humgen/diabetes/users/chase/lap

# Run with:
# perl $lap_home/trunk/bin/run.pl --meta /humgen/diabetes2/users/chase/projects/reveal-mechanisms/lap/config/cfde_projection.meta

#=======================================================================================================================
# CLASSES
# Hierarchy:
#   project
#   +-- geneset_collection -> project   (one CFDE GMT; instance name = CFDE index label)
#   +-- trait -> project                (one EAGGL trait; instance name = EAGGL trait = KPN legacy_phenotype_id)
#   +-- reload_target -> project        (one allow-listed app environment; instance name = reload target name)

class project=Project
class geneset_collection=GeneSetCollection parent project
class trait=Trait parent project
class reload_target=ReloadTarget parent project

#=======================================================================================================================
# DIRECTORIES

sortable mkdir path projects_dir=$unix_out_dir/projects
sortable mkdir path project_dir=$projects_dir/@project class_level project

sortable mkdir path collections_dir=$project_dir/collections class_level project
sortable mkdir path collection_dir=$collections_dir/@geneset_collection class_level geneset_collection

sortable mkdir path traits_dir=$project_dir/traits class_level project
sortable mkdir path trait_dir=$traits_dir/@trait class_level trait

sortable mkdir path reload_dir=$project_dir/reload class_level project
sortable mkdir path reload_bundles_dir=$reload_dir/bundles class_level project
sortable mkdir path reload_targets_dir=$reload_dir/targets class_level project
sortable mkdir path reload_target_dir=$reload_targets_dir/@reload_target class_level reload_target

sortable mkdir path portal_dir=$project_dir/portal class_level project

#=======================================================================================================================
# CATEGORIES

cat project_input_cat=null disp "Linked inputs" class_level project
cat project_cat=null disp "Gene sets, factors and traits" class_level project
cat global_cat=null disp "All-factor projection" class_level project
cat collection_cat=null disp "Collection files" class_level geneset_collection
cat trait_cat=null disp "Trait projection" class_level trait
cat reload_cat=null disp "Reference reload" class_level project
cat reload_target_cat=null disp "Reference reload target" class_level reload_target
cat portal_cat=null disp "Audit portal" class_level project

#=======================================================================================================================
# PROPERTIES

# Project: which EAGGL loadings to project (capped = the share's matrix; uncapped = restored from
# capped_entries.tsv.gz) and which KPN trait release the trait ids come from.
prop loading_variant=scalar
prop kpn_release=scalar

# Collection: the DAPPER collection id and CFDE library of the GMT.
prop collection_id=scalar
prop library=scalar

# Trait: its KPN.TRAIT id (also written by prep_trait_kpn_map_cmd; trait_annotate_cmd checks they agree).
prop kpn_trait_id=scalar

# Reload target: copied from its config/reference_reload.targets.yaml entry by build_meta_yaml.py. The CLI reads
# the allow-list itself and refuses when these (exported as REVEAL_APPLICATION_TABLE_PREFIX and
# REVEAL_VECTOR_ENVIRONMENT) disagree with it, i.e. when the meta was not regenerated after an allow-list edit.
prop app_prefix=scalar
prop vector_env=scalar
prop production=scalar

