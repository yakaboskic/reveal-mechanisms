path file factor_loadings_in_file=@project.capped_factor_gene_loadings.tsv.gz dir project_dir disp "EAGGL capped factor x gene loadings" parent project_input_cat class_level project
table path file factor_ids_in_file=@project.factor_ids.tsv dir project_dir disp "EAGGL factor ids (row order of the loadings)" parent project_input_cat class_level project
table path file factor_metadata_in_file=@project.factor_metadata.tsv dir project_dir disp "EAGGL factor metadata" parent project_input_cat class_level project
table path file eaggl_genes_in_file=@project.genes.tsv dir project_dir disp "EAGGL genes (column order of the loadings)" parent project_input_cat class_level project
path file capped_entries_in_file=@project.capped_entries.tsv.gz dir project_dir disp "EAGGL loadings changed by capping" parent project_input_cat class_level project
table path file cfde_index_file=@project.cfde_index.tsv dir project_dir disp "CFDE gene-set library index" parent project_input_cat class_level project
table path file kpn_trait_registry_file=@project.kpn_trait_registry.tsv dir project_dir disp "KPN trait registry" parent project_input_cat class_level project
path file kpn_trait_flat_file=@project.kpn_trait_flat.tsv dir project_dir disp "KPN trait ontology mappings" parent project_input_cat class_level project

