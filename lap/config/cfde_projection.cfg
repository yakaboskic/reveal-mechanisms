path file all_factors_file=@project.all_factors.factors_by_genes.tsv.gz dir project_dir disp "All factors (eaggl factors-by-genes input)" parent project_cat class_level project
table path file factor_index_file=@project.factor_index.tsv dir project_dir disp "Factor index (FactorN -> factor_id)" parent project_cat class_level project
path file annotations_gmt_file=@project.cfde_annotations.gmt.gz dir project_dir disp "All CFDE gene sets (eaggl X input)" parent project_cat class_level project
path file gene_set_index_file=@project.gene_set_index.tsv.gz dir project_dir disp "Gene-set index (id -> name, collection)" parent project_cat class_level project
path file gene_case_map_file=@project.cfde_to_eaggl_case.gene.map dir project_dir disp "Case-only CFDE -> EAGGL gene map" parent project_cat class_level project
