# --- project level: all-factor projection ---
path file all_factors_joint_raw_file=@project.all_factors.joint.eaggl.tsv.gz dir project_dir disp "All-factor joint (raw eaggl)" parent global_cat class_level project
path file all_factors_marginal_raw_file=@project.all_factors.marginal.eaggl.tsv.gz dir project_dir disp "All-factor marginal (raw eaggl)" parent global_cat class_level project
path file all_factors_params_file=@project.all_factors.eaggl.params.tsv dir project_dir disp "All-factor eaggl params" parent global_cat class_level project
path file all_factors_warnings_file=@project.all_factors.eaggl.warnings.txt dir project_dir disp "All-factor eaggl warnings" parent global_cat class_level project
path file all_factors_projection_log_file=@project.all_factors.eaggl.log dir project_dir disp "All-factor eaggl log" parent global_cat class_level project
path file all_factors_pigean_commit_file=@project.all_factors.pigean_commit.txt dir project_dir disp "All-factor pigean commit" parent global_cat class_level project
path file all_factors_joint_by_factor_id_file=@project.all_factors.joint.by_factor_id.tsv.gz dir project_dir disp "All-factor joint loadings (factor_id columns)" parent global_cat class_level project
path file all_factors_marginal_by_factor_id_file=@project.all_factors.marginal.by_factor_id.tsv.gz dir project_dir disp "All-factor marginal loadings (factor_id columns)" parent global_cat class_level project
table path file all_factors_qc_file=@project.all_factors.qc.tsv dir project_dir disp "All-factor QC" parent global_cat class_level project

# --- project level: collected per-trait results ---
table path file projection_manifest_file=@project.projection_manifest.tsv dir project_dir disp "Per-trait projection manifest (QC)" parent project_cat class_level project
path file top_gene_sets_file=@project.top_gene_sets_per_factor.tsv.gz dir project_dir disp "Top gene sets per factor (all traits)" parent project_cat class_level project

# --- collection level ---
path file cfde_gmt_file=@geneset_collection.genesets.dapper-ids.gmt dir collection_dir disp "GMT (dapper:GeneSet ids)" parent collection_cat class_level geneset_collection
path file cfde_names_gmt_file=@geneset_collection.genesets.gmt dir collection_dir disp "GMT (source names)" parent collection_cat class_level geneset_collection
path file cfde_collection_yaml_file=@geneset_collection.GeneSetCollection.yaml dir collection_dir disp "DAPPER GeneSetCollection document" parent collection_cat class_level geneset_collection
table path file collection_gene_sets_file=@geneset_collection.gene_sets.tsv dir collection_dir disp "Collection gene-set index" parent collection_cat class_level geneset_collection

# --- trait level ---
path file trait_factors_file=@trait.factors_by_genes.tsv.gz dir trait_dir disp "Trait factors (eaggl input)" parent trait_cat class_level trait
table path file trait_factor_index_file=@trait.factor_index.tsv dir trait_dir disp "Trait factor index (FactorK -> factor_id)" parent trait_cat class_level trait
path file trait_joint_raw_file=@trait.joint.eaggl.tsv.gz dir trait_dir disp "Joint (raw eaggl)" parent trait_cat class_level trait
path file trait_marginal_raw_file=@trait.marginal.eaggl.tsv.gz dir trait_dir disp "Marginal (raw eaggl)" parent trait_cat class_level trait
path file trait_params_file=@trait.eaggl.params.tsv dir trait_dir disp "eaggl params" parent trait_cat class_level trait
path file trait_warnings_file=@trait.eaggl.warnings.txt dir trait_dir disp "eaggl warnings" parent trait_cat class_level trait
path file trait_projection_log_file=@trait.eaggl.log dir trait_dir disp "eaggl log" parent trait_cat class_level trait
path file trait_pigean_commit_file=@trait.pigean_commit.txt dir trait_dir disp "pigean commit" parent trait_cat class_level trait
path file trait_projection_long_file=@trait.cfde_projection.long.tsv.gz dir trait_dir disp "Joint + marginal loadings (factor x gene set)" parent trait_cat class_level trait
path file trait_top_file=@trait.cfde_projection.top.tsv.gz dir trait_dir disp "Top gene sets per factor" parent trait_cat class_level trait
table path file trait_qc_file=@trait.projection_qc.tsv dir trait_dir disp "Projection QC" parent trait_cat class_level trait

# --- project level: reference reload (every db_ command's JSON result; the bundle itself is written under
#     reload_bundles_dir/<generation_id>/) ---
path file db_build_file=@project.db_build.json dir reload_dir disp "Reference bundle (build result)" parent reload_cat class_level project
path file db_embed_file=@project.db_embed.json dir reload_dir disp "CFDE vectors (embed result)" parent reload_cat class_level project
path file db_load_file=@project.db_load.json dir reload_dir disp "Generation load (load result)" parent reload_cat class_level project
path file db_capture_file=@project.db_capture.json dir reload_dir disp "Archived factors and cold export (capture result)" parent reload_cat class_level project
path file purge_plan_file=@project.purge_plan.json dir reload_dir disp "Purge plan" parent reload_cat class_level project
path file db_purge_plan_file=@project.db_purge_plan.json dir reload_dir disp "Purge plan (result)" parent reload_cat class_level project
# Written only by hand: `reference_reload approve --plan <purge plan> --out <this file>` (never by a LAP command).
path file purge_approval_file=@project.purge.approval.json dir reload_dir disp "Purge approval (manual)" parent reload_cat class_level project
path file db_purge_file=@project.db_purge.json dir reload_dir disp "Purge (result)" parent reload_cat class_level project

# --- reload target level ---
path file db_snapshot_file=@reload_target.db_snapshot.json dir reload_target_dir disp "Upstash snapshot (snapshot result)" parent reload_target_cat class_level reload_target
path file reload_plan_file=@reload_target.plan.json dir reload_target_dir disp "Cutover plan" parent reload_target_cat class_level reload_target
path file db_plan_file=@reload_target.db_plan.json dir reload_target_dir disp "Cutover plan (result)" parent reload_target_cat class_level reload_target
# Written only by hand: `reference_reload approve --plan <cutover plan> --out <this file>` (never by a LAP command).
path file approval_file=@reload_target.approval.json dir reload_target_dir disp "Cutover approval (manual)" parent reload_target_cat class_level reload_target
path file db_apply_file=@reload_target.db_apply.json dir reload_target_dir disp "Cutover (apply result)" parent reload_target_cat class_level reload_target
path file db_verify_file=@reload_target.db_verify.json dir reload_target_dir disp "Post-conditions (verify result)" parent reload_target_cat class_level reload_target

# --- project level: audit portal (scripts/factor_portal; ../README.md "Audit portal") ---
path file portal_db_file=@project.portal.sqlite dir portal_dir disp "Portal SQLite" parent portal_cat class_level project
path file portal_build_log_file=@project.portal.build.log dir portal_dir disp "Portal build log" parent portal_cat class_level project
table path file portal_factor_audit_file=@project.portal.factor_audit.tsv dir portal_dir disp "Per-factor audit columns and flags" parent portal_cat class_level project
table path file portal_gene_set_audit_file=@project.portal.gene_set_audit.tsv dir portal_dir disp "Gene sets by number of factor top lists (hubs)" parent portal_cat class_level project
path file portal_html_file=@project.portal.html dir portal_dir disp "Portal page (static; calls the portal server)" parent portal_cat class_level project

#=======================================================================================================================
# COMMANDS
# Cmd keys are prefixed by stage so that stages can be run with --only-cmd:
#   collection_ / prep_ (inputs), trait_ (per-trait projection), global_ (all-factor projection), collect_,
#   portal_ (audit portal), db_ (reference reload)

# --- collection level: check the id and name GMTs agree row for row and index the gene sets ---
local cmd collection_index_cmd=$helper_cmd collection-index \
    !{prop:--label:geneset_collection} \
    !{prop:--collection-id:geneset_collection:collection_id} \
    !{prop:--library:geneset_collection:library} \
    !{input:--gmt-file:cfde_gmt_file} \
    !{input:--names-gmt-file:cfde_names_gmt_file} \
    !{input:--collection-yaml-file:cfde_collection_yaml_file} \
    !{output:--output-file:collection_gene_sets_file}; \
    class_level geneset_collection

# --- project level: inputs ---
# EAGGL trait -> KPN.TRAIT id by exact legacy_phenotype_id; fails unless every trait has exactly one hit
# and the registry file is byte-identical to the release tag.
local cmd prep_trait_kpn_map_cmd=$helper_cmd trait-kpn-map \
    !{input:--factor-ids-file:factor_ids_in_file} \
    !{input:--registry-file:kpn_trait_registry_file} \
    !{prop:--kpn-release:project:kpn_release} \
    !{output:--output-file:trait_kpn_map_file}; \
    class_level project

# eaggl's factors-by-genes layout needs the header cell `Factor`; values are copied verbatim and the
# row order (= factor_ids.tsv) defines the global Factor1..4037.
short cmd prep_assemble_factors_cmd=$helper_cmd assemble-factors \
    !{input:--loadings-file:factor_loadings_in_file} \
    !{input:--factor-ids-file:factor_ids_in_file} \
    !{input:--factor-metadata-file:factor_metadata_in_file} \
    !{input:--genes-file:eaggl_genes_in_file} \
    !{input:--capped-entries-file:capped_entries_in_file} \
    !{input:--trait-kpn-map-file:trait_kpn_map_file} \
    !{prop:--loading-variant:project:loading_variant} \
    !{output:--output-file:all_factors_file} \
    !{output:--output-factor-index-file:factor_index_file}; \
    class_level project rusage_mod 8000

# Fan-in over all 133 collections: the GMTs are concatenated byte for byte (sorted by label); the
# gene map only fixes letter case (e.g. C10orf71 -> C10ORF71) for symbols absent from the factors.
short cmd prep_build_annotations_cmd=$helper_cmd build-annotations \
    !{input:--gmt-file:cfde_gmt_file} \
    !{input:--collection-gene-sets-file:collection_gene_sets_file} \
    !{input:--cfde-index-file:cfde_index_file} \
    !{input:--eaggl-genes-file:eaggl_genes_in_file} \
    --cfde-snapshot $cfde_snapshot \
    !{output:--output-gmt-file:annotations_gmt_file} \
    !{output:--output-gene-set-index-file:gene_set_index_file} \
    !{output:--output-gene-map-file:gene_case_map_file} \
    !{output:--output-overlap-report-file:gene_overlap_report_file}; \
    class_level project rusage_mod 8000

# --- trait level: per-trait joint + marginal projection ---
# All 18,477 gene columns are kept: eaggl silently drops gene sets with no gene in the factor table.
short cmd trait_factors_cmd=$helper_cmd trait-factors \
    !{input:--all-factors-file:all_factors_file} \
    !{input:--factor-index-file:factor_index_file} \
    !{prop:--trait:trait} \
    !{output:--output-file:trait_factors_file} \
    !{output:--output-factor-index-file:trait_factor_index_file}; \
    class_level trait

# eaggl densifies the 18,477 x 44,399 gene-set matrix for the joint solve (~6.6 GB per copy, ~30 GB
# peak), so this cannot run on the dev node.
cmd trait_project_cmd=$helper_cmd record-pigean-commit --repo-dir $pigean_repo_dir --expected-commit $pigean_commit \
    !{output:--output-file:trait_pigean_commit_file} && \
    $eaggl_cmd factor \
    !{input:--factor-gene-clusters-in:trait_factors_file} \
    --factor-gene-clusters-layout factors-by-genes \
    !{input:--X-in:annotations_gmt_file} \
    !{input:--gene-map-in:gene_case_map_file} \
    --gene-set-projection-mode both \
    !{output:--gene-set-clusters-out:trait_joint_raw_file} \
    !{output:--gene-set-clusters-marginal-out:trait_marginal_raw_file} \
    --factor-output-scope all --cluster-row-min-max-loading 0 \
    --seed $projection_seed --hide-progress --hide-opts \
    !{output:--params-out:trait_params_file} \
    !{output:--warnings-file:trait_warnings_file} \
    !{output:--log-file:trait_projection_log_file} && \
    touch !{output::trait_warnings_file}; \
    class_level trait rusage_mod $trait_projection_mem

# Relabel Factor1..K with factor ids, attach collection/KPN ids, rank, and QC (ids equal the index,
# eaggl labels match the factor order, K=1 joint == marginal, all genes aligned).
short cmd trait_annotate_cmd=$helper_cmd annotate-projection \
    !{input:--joint-file:trait_joint_raw_file} \
    !{input:--marginal-file:trait_marginal_raw_file} \
    !{input:--trait-factors-file:trait_factors_file} \
    !{input:--trait-factor-index-file:trait_factor_index_file} \
    !{input:--gene-set-index-file:gene_set_index_file} \
    !{input:--trait-kpn-map-file:trait_kpn_map_file} \
    !{prop:--trait:trait} \
    !{prop:--kpn-trait-id:trait:kpn_trait_id} \
    !{input:--params-file:trait_params_file} \
    !{input:--pigean-commit-file:trait_pigean_commit_file} \
    --expected-pigean-commit $pigean_commit \
    !{prop:--loading-variant:project:loading_variant} \
    --seed $projection_seed --top-n $top_n_gene_sets \
    !{output:--output-long-file:trait_projection_long_file} \
    !{output:--output-top-file:trait_top_file} \
    !{output:--output-qc-file:trait_qc_file}; \
    class_level trait rusage_mod 8000

# --- project level: all-factor joint + marginal projection (one run over all 4,037 factors) ---
cmd global_project_cmd=$helper_cmd record-pigean-commit --repo-dir $pigean_repo_dir --expected-commit $pigean_commit \
    !{output:--output-file:all_factors_pigean_commit_file} && \
    $eaggl_cmd factor \
    !{input:--factor-gene-clusters-in:all_factors_file} \
    --factor-gene-clusters-layout factors-by-genes \
    !{input:--X-in:annotations_gmt_file} \
    !{input:--gene-map-in:gene_case_map_file} \
    --gene-set-projection-mode both \
    !{output:--gene-set-clusters-out:all_factors_joint_raw_file} \
    !{output:--gene-set-clusters-marginal-out:all_factors_marginal_raw_file} \
    --factor-output-scope all --cluster-row-min-max-loading 0 \
    --seed $projection_seed --hide-progress --hide-opts \
    !{output:--params-out:all_factors_params_file} \
    !{output:--warnings-file:all_factors_warnings_file} \
    !{output:--log-file:all_factors_projection_log_file} && \
    touch !{output::all_factors_warnings_file}; \
    class_level project rusage_mod $global_projection_mem rtime_mod $global_projection_rtime

cmd global_relabel_cmd=$helper_cmd relabel-global \
    !{input:--joint-file:all_factors_joint_raw_file} \
    !{input:--marginal-file:all_factors_marginal_raw_file} \
    !{input:--all-factors-file:all_factors_file} \
    !{input:--factor-index-file:factor_index_file} \
    !{input:--gene-set-index-file:gene_set_index_file} \
    !{input:--params-file:all_factors_params_file} \
    !{input:--pigean-commit-file:all_factors_pigean_commit_file} \
    --expected-pigean-commit $pigean_commit \
    !{output:--output-joint-file:all_factors_joint_by_factor_id_file} \
    !{output:--output-marginal-file:all_factors_marginal_by_factor_id_file} \
    !{output:--output-qc-file:all_factors_qc_file}; \
    class_level project rusage_mod 8000

# --- project level: fan-in over all 711 traits (never run under --only: the fan-in would shrink) ---
cmd collect_projections_cmd=$helper_cmd collect \
    !{input:--qc-file:trait_qc_file} \
    !{input:--top-file:trait_top_file} \
    !{input:--trait-kpn-map-file:trait_kpn_map_file} \
    --expected-pigean-commit $pigean_commit \
    !{output:--output-manifest-file:projection_manifest_file} \
    !{output:--output-top-file:top_gene_sets_file}; \
    class_level project

# --- project level: audit portal (scripts/factor_portal; ../README.md "Audit portal") ---
# build reads the outputs a reviewer needs into one SQLite: every factor's nonzero EAGGL gene loadings, its top gene
# sets with their member-gene overlap, and (from the 711 long files) each top gene set's loadings on all of the trait's
# factors. It refuses to write the database unless every marginal loading recomputed from the gene loadings
# (sum of w_g over the members / w'w) equals eaggl's within %.4g rounding. Fan-in over all traits like collect_: never
# run under --only. export-audit flattens the audit columns; the static page calls a portal server you start yourself.
short cmd portal_build_db_cmd=$portal_cmd !{output:--log-file:portal_build_log_file} build !{prop:--project:project} \
    !{input:--trait-kpn-map-file:trait_kpn_map_file} \
    !{input:--kpn-trait-flat-file:kpn_trait_flat_file} \
    !{input:--projection-manifest-file:projection_manifest_file} \
    !{input:--factor-index-file:factor_index_file} \
    !{input:--factor-metadata-file:factor_metadata_in_file} \
    !{input:--all-factors-file:all_factors_file} \
    !{input:--cfde-index-file:cfde_index_file} \
    !{input:--gene-set-index-file:gene_set_index_file} \
    !{input:--annotations-gmt-file:annotations_gmt_file} \
    !{input:--gene-map-file:gene_case_map_file} \
    !{input:--top-gene-sets-file:top_gene_sets_file} \
    !{input:--long-file:trait_projection_long_file} \
    --top-n $top_n_gene_sets \
    !{output:--output-db:portal_db_file}; \
    class_level project rusage_mod $portal_build_mem

local cmd portal_export_audit_cmd=$portal_cmd export-audit \
    !{input:--db:portal_db_file} \
    !{output:--output-factor-audit-file:portal_factor_audit_file} \
    !{output:--output-gene-set-audit-file:portal_gene_set_audit_file}; \
    class_level project

local cmd portal_build_html_cmd=$portal_cmd html \
    !{input:--db:portal_db_file} \
    --api-url $portal_api_url \
    --title "$portal_title" \
    !{output:--output-html:portal_html_file}; \
    class_level project

# --- reference reload (docs/reference-reload.md sections 7 and 10; runbook in ../README.md) ---
# Every db_ command runs the backend CLI on the submit host (local cmd: it needs the network and the secrets in the
# repo-root .env, which the CLI loads itself; no secret appears here). Each prints one JSON result, tee'd to
# <output>.part and renamed only on success (LAP prefaces commands with `set -o pipefail`), so a refused or failed
# step leaves no output and its JSON stays in <output>.part and the LAP log. `!{input:key}` (no prefix) is a
# dependency that is not written into the command. Directories are written as `!{key::dir_key}` or
# `!{key::file_key:dir}`: a bare `$dir_key` keeps its @instance placeholder in command text. The generation id and
# the bundle path are only known once db_build_cmd has run, so later commands read them from the upstream JSON
# results ($reload_json_get).
#
# Project level, additive and idempotent: build (pure files) -> embed (calibrated CFDE vectors) -> load (migration
# 008 and the new generation, never activated) -> capture (frozen archived_reference_factors for every factor the
# targets' user work references, anchor_display backfill, cold export of the superseded generation).
local cmd db_build_cmd=$reveal_project_cmd build --lap-project-dir !{key::project_dir} \
    !{prop:--kpn-release:project:kpn_release} --out !{key::reload_bundles_dir} \
    !{input:projection_manifest_file} !{input:top_gene_sets_file} \
    | tee !{output::db_build_file}.part && mv !{output::db_build_file}.part !{output::db_build_file}; \
    class_level project

local cmd db_embed_cmd=$reveal_project_cmd embed --bundle \$($reload_json_get !{input::db_build_file} bundle) \
    --embeddings-dir $cfde_embeddings_dir \
    | tee !{output::db_embed_file}.part && mv !{output::db_embed_file}.part !{output::db_embed_file}; \
    class_level project

local cmd db_load_cmd=$reveal_project_cmd load --apply --bundle \$($reload_json_get !{input::db_build_file} bundle) \
    !{input:db_embed_file} \
    | tee !{output::db_load_file}.part && mv !{output::db_load_file}.part !{output::db_load_file}; \
    class_level project

# --from is the generation the targets are active on now: $reload_from_generation (a meta key). `active` (the
# default) lets the CLI resolve it from every target's active pointer (the legacy generation in legacy mode) and
# refuse when targets disagree; `legacy` means the legacy cfde-inc-v2 generation that db_load_cmd registered.
local cmd db_capture_cmd=$reveal_project_cmd capture --apply --cold-export \
    --from \$(test "$reload_from_generation" = legacy && $reload_json_get !{input::db_load_file} legacy_generation_id || echo $reload_from_generation) \
    --prefixes !{prop::reload_target:app_prefix:sep=,} \
    | tee !{output::db_capture_file}.part && mv !{output::db_capture_file}.part !{output::db_capture_file}; \
    class_level project

# Reload target level: snapshot (build, upload and verify the target's Upstash namespaces; not activated) -> plan
# (read-only; any approval of an earlier plan is deleted, because it can only be for different content) ->
# apply (protected cutover; runs only once approval_file exists) -> verify (read-only post-conditions).
local cmd db_snapshot_cmd=$reveal_target_cmd snapshot --apply !{prop:--target:reload_target} \
    --generation \$($reload_json_get !{input::db_load_file} generation_id) !{input:db_capture_file} \
    | tee !{output::db_snapshot_file}.part && mv !{output::db_snapshot_file}.part !{output::db_snapshot_file}; \
    class_level reload_target

local cmd db_plan_cmd=rm -f !{key::approval_file:dir}/!{key::approval_file} && \
    $reveal_target_cmd plan !{prop:--target:reload_target} \
    --generation \$($reload_json_get !{input::db_load_file} generation_id) !{input:db_snapshot_file} \
    !{output:--out:reload_plan_file} \
    | tee !{output::db_plan_file}.part && mv !{output::db_plan_file}.part !{output::db_plan_file}; \
    class_level reload_target

# Production targets add --allow-production; the operator must also export
# REVEAL_RELOAD_PRODUCTION_APPROVAL=<plan_sha256> for the LAP run that applies them.
local cmd db_apply_cmd=$reveal_target_cmd apply !{prop:--target:reload_target} \
    !{input:--plan:reload_plan_file} !{input:--approval:approval_file} \
    --backup-dir !{key::reload_target_dir}/backups $reload_apply_opts \
    !{raw,,reload_target,--allow-production,if_prop=production:eq:true,allow_empty=1} \
    | tee !{output::db_apply_file}.part && mv !{output::db_apply_file}.part !{output::db_apply_file}; \
    class_level reload_target

local cmd db_verify_cmd=$reveal_target_cmd verify !{prop:--target:reload_target} \
    --generation \$($reload_json_get !{input::db_apply_file} generation_id) \
    | tee !{output::db_verify_file}.part && mv !{output::db_verify_file}.part !{output::db_verify_file}; \
    class_level reload_target

# Project level, after every target verified (fan-in over all reload_target instances; never run under --only):
# the purge plan is read-only; the purge runs only once purge_approval_file exists, and with a production target in
# the allow-list it also needs REVEAL_RELOAD_PRODUCTION_APPROVAL=<purge plan_sha256>.
local cmd db_purge_plan_cmd=rm -f !{key::purge_approval_file:dir}/!{key::purge_approval_file} && \
    $reveal_project_cmd purge-retired \
    --generation \$($reload_json_get !{input::db_load_file} generation_id) !{input:db_verify_file} \
    !{output:--out:purge_plan_file} \
    | tee !{output::db_purge_plan_file}.part && mv !{output::db_purge_plan_file}.part !{output::db_purge_plan_file}; \
    class_level project

local cmd db_purge_cmd=$reveal_project_cmd purge-retired --apply \
    !{input:--plan:purge_plan_file} !{input:--approval:purge_approval_file} !{input:db_verify_file} \
    !{raw,,reload_target,--allow-production,if_prop=production:eq:true,allow_empty=1} \
    | tee !{output::db_purge_file}.part && mv !{output::db_purge_file}.part !{output::db_purge_file}; \
    class_level project

#=======================================================================================================================
# CONFIGURATION

lap_trunk=$lap_home/trunk
!include $lap_trunk/config/common.cfg

# eaggl runs from a pinned clone of packages/pigean (not the development checkout), created once with
#   git clone --no-checkout /humgen/diabetes2/users/chase/packages/pigean raw/pigean_ca59661
#   git -C raw/pigean_ca59661 checkout --detach ca59661644dc9ead429fc7e59050870ba49b26e8
# Every eaggl job first checks that the clone is at $pigean_commit with a clean src/ (record-pigean-commit),
# and annotate/relabel/collect reject any other commit. There is no installed eaggl entry point, so it runs
# from src/ with the pigean project's venv (Python 3.9; eaggl's supplied-factor projection tests pass on it).
# One BLAS thread per job to match the single UGER slot.
pigean_commit=ca59661644dc9ead429fc7e59050870ba49b26e8
pigean_repo_dir=$base_dir/raw/pigean_ca59661
python_cmd=/humgen/diabetes2/users/chase/projects/pigean/.venv/bin/python
eaggl_cmd=env PYTHONPATH=$pigean_repo_dir/src PYTHONDONTWRITEBYTECODE=1 OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 $python_cmd -B -m eaggl
helper_cmd=env PYTHONDONTWRITEBYTECODE=1 $python_cmd -B $base_dir/scripts/projection_workflow.py

# The joint solve starts from random H; a fixed seed makes every run reproducible.
projection_seed=1
top_n_gene_sets=50

# Audit portal: stdlib only, so it runs on the helpers' Python. The page calls a server you start yourself (in tmux):
#   env PYTHONPATH=$base_dir/scripts $python_cmd -m factor_portal serve --db <portal_dir>/<project>.portal.sqlite --port 8766
# then open http://localhost:8766/ (or the static page) through an SSH tunnel to that port. The full build reads all
# 711 long files (~8 of ~11 min) and peaked at 0.7 GB on the 2026-09-28 projection.
portal_cmd=env PYTHONPATH=$base_dir/scripts PYTHONDONTWRITEBYTECODE=1 $python_cmd -B -m factor_portal
portal_api_url=http://localhost:8766
portal_title=EAGGL x CFDE projection audit
portal_build_mem=4000

# Per-trait runs hold ~4 dense 18,477 x 44,399 float64 arrays: the smoke test (2hrG K=1, T2D and Ap-LM
# K=13) peaked at 25.0 GB maxvmem whatever K, taking 37 s (K=1) to ~12 min (K=13). The all-factor run adds
# 4,037 x 44,399 H matrices and ~2e15 FLOPs on one slot. LAP only honours rtime_mod when it exceeds the
# 16 h `cmd` limit. UGER retries memory kills with twice the memory.
trait_projection_mem=32000
global_projection_mem=64000
global_projection_rtime=72:00:00

# On UGER, common.cfg's max_sge_batch=1000 submits every ready command of a key as one array job
# (-tc 1000), and max_jobs counts an array as a single job, so nothing would cap the 711 x 32 GB
# projections. Without arrays, max_jobs caps the number of running tasks.
max_sge_batch=1
max_jobs=50
default_mem=4000
bsub_opts=-pe smp 1 -l os=RedHat8

# Reference reload runner: the backend's own Python >= 3.11 venv (the helpers above use the pigean 3.9 venv).
# Equivalent: uv run --no-sync --project $reveal_repo_dir/services/backend python. $reveal_repo_dir,
# $cfde_embeddings_dir and $reload_from_generation are meta keys (scripts/build_meta_yaml.py). The CLI loads
# $reveal_repo_dir/.env itself (MySQL, Upstash, embedding service, S3); AWS_PROFILE must be set for the S3 cold
# export and the Aurora snapshot. Per-target commands export the target's prefix and vector environment (the CLI
# refuses if they disagree with the allow-list); project-level commands, which span every target, unset them.
reveal_python=$reveal_repo_dir/services/backend/.venv/bin/python
reveal_cmd=$reveal_python -B -m reveal_backend.reference_reload
reveal_project_cmd=env -u REVEAL_APPLICATION_TABLE_PREFIX -u REVEAL_VECTOR_ENVIRONMENT $reveal_cmd
reveal_target_cmd=env REVEAL_APPLICATION_TABLE_PREFIX=!{prop::reload_target:app_prefix} REVEAL_VECTOR_ENVIRONMENT=!{prop::reload_target:vector_env} $reveal_cmd
# Prints one field of a db_ JSON result: $reload_json_get <file> <field>
reload_json_get=$reveal_python -B -c "import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])"
# apply closes the target's reload gate, drains non-terminal jobs for up to --drain-seconds, then backs up before it
# activates or archives anything: a mysqldump of the target's records (into its backups/ dir, 0600) plus an Aurora
# cluster snapshot (cluster derived from REVEAL_MYSQL_HOST). To reuse an existing snapshot instead, replace
# --create-aurora-snapshot with --backup-snapshot-id <id>.
reload_apply_opts=--create-aurora-snapshot --drain-seconds 600
