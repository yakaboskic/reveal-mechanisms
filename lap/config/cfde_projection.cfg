!title CFDE gene-set projection onto EAGGL factors

# Projects every CFDE gene set (the DAPPER 0.2.0 release s3://dig-gene-set-data/v2.0_dapper-0.2.0-a1/, snapshot
# 2026-10-05 minus GaultonLab: 9 libraries, 532 GMTs, 1,517,472 gene sets) onto the capped EAGGL factors of the legacy
# 711-trait atlas (raw/EAGGL_capped_union_graph_share, 4,037 factors x 18,477 genes) with the packages/pigean
# supplied-factor projection (`python -m eaggl factor --factor-gene-clusters-in ...`), writing both the joint and the
# marginal gene-set loadings. Each trait's factors are projected jointly on their own (711 runs), in chunks of gene
# sets: eaggl densifies its genes x gene-sets matrix, and a gene set's loadings depend only on its own column and the
# factors, so chunks give the same loadings. (The all-factor run of the 44,399-set release is not feasible here.)
#
# Joint loadings are a fixed-W multiplicative-update NNLS (eaggl state.py _project_H_with_fixed_W): the trait's factors
# compete to explain each gene set. Marginal loadings are clip(x'w / w'w, 0, 1). eaggl stops the joint update at 100
# iterations or a relative change below 1e-4 (neither is a CLI option); the per-trait runs (K <= 15) meet the tolerance.
# Each trait keeps, per factor, ordinal ranks over all gene sets and within each library; its long file holds every
# factor's row for the gene sets in some factor's per-library top $top_n_gene_sets (joint or marginal).
#
# Identifiers are carried verbatim: GMT column 1 (dapper:GeneSet.*) is eaggl's Gene_Set; the
# dapper:GeneSetCollection.* id is joined from the CFDE index; eaggl names factors by position
# (Factor1..K), so every factor file's row order is recorded and mapped back to trait::FactorN;
# each EAGGL trait is its KPN legacy_phenotype_id and is mapped to its KPN.TRAIT id (release v0.0.2
# of dig-portal-data-models, pinned by commit).
#
# The betas stage scores each trait against every CFDE gene set without rerunning PIGEAN: `python -m pigean betas`
# (gene-set betas, no outer Gibbs) regresses the trait's existing PIGEAN gene stats (an all-trait export, sliced per
# trait by byte range) on the same CFDE gene sets, writing beta_uncorrected and the joint beta of every gene set
# PIGEAN analyzes (its p < 0.01 prefilter; the rest carry no beta).
#
# The release stage then writes one reference release folder from the projection (traits, factors and their gene
# loadings, CFDE collections and gene sets, per-library top projections, DAPPER provenance, frozen factor snapshots
# and the reused vectors). One command, `python -m reveal_backend.reference_release publish`, run by hand, replaces
# each environment's reference tables and Upstash vectors with it (../README.md "Reference release").
#
# The meta is generated, never hand-edited:
#   python3 scripts/build_meta_yaml.py
#   PYTHONPATH=/humgen/diabetes2/users/chase/packages/meta-sanity python3 -m meta_sanity.generate_meta \
#       config/cfde_projection.meta.yaml config/cfde_projection.meta
# Run sequence, checks and output schema: ../README.md

lap_home=/humgen/diabetes/users/chase/lap

# Run with:
# perl $lap_home/trunk/bin/run.pl --meta /humgen/diabetes2/users/chase/projects/reveal-mechanisms/lap/config/cfde_projection.meta

#=======================================================================================================================
# CLASSES
# Hierarchy:
#   project
#   +-- geneset_collection -> project   (one CFDE GMT; instance name = CFDE index label)
#   +-- trait -> project                (one EAGGL trait; instance name = EAGGL trait = KPN legacy_phenotype_id)

class project=Project
class geneset_collection=GeneSetCollection parent project
class trait=Trait parent project

#=======================================================================================================================
# DIRECTORIES

sortable mkdir path projects_dir=$unix_out_dir/projects
sortable mkdir path project_dir=$projects_dir/@project class_level project

sortable mkdir path collections_dir=$project_dir/collections class_level project
sortable mkdir path collection_dir=$collections_dir/@geneset_collection class_level geneset_collection

sortable mkdir path traits_dir=$project_dir/traits class_level project
sortable mkdir path trait_dir=$traits_dir/@trait class_level trait

sortable mkdir path release_dir=$project_dir/release class_level project
sortable mkdir path release_files_dir=$release_dir/files class_level project

sortable mkdir path portal_dir=$project_dir/portal class_level project
sortable mkdir path annotation_chunks_dir=$project_dir/annotation_chunks class_level project

#=======================================================================================================================
# CATEGORIES

cat project_input_cat=null disp "Linked inputs" class_level project
cat project_cat=null disp "Gene sets, factors and traits" class_level project
cat collection_cat=null disp "Collection files" class_level geneset_collection
cat trait_cat=null disp "Trait projection" class_level trait
cat gene_set_stats_cat=null disp "Trait gene-set betas (pigean betas)" class_level trait
cat release_cat=null disp "Reference release" class_level project
cat portal_cat=null disp "Audit portal" class_level project

#=======================================================================================================================
# PROPERTIES

# Project: which EAGGL loadings to project (capped = the share's matrix; uncapped = restored from
# capped_entries.tsv.gz) and which KPN trait release the trait ids come from.
prop loading_variant=scalar
prop kpn_release=scalar

# Collection: the DAPPER collection id and CFDE library of the GMT.
prop collection_id=scalar
prop library=scalar

# Trait: its KPN.TRAIT id (also written by prep_trait_kpn_map_cmd; trait_project_cmd checks they agree).
prop kpn_trait_id=scalar

#=======================================================================================================================
# FILES

# --- project level: linked inputs (set in the meta, symlinked by --init) ---
path file factor_loadings_in_file=@project.capped_factor_gene_loadings.tsv.gz dir project_dir disp "EAGGL capped factor x gene loadings" parent project_input_cat class_level project
table path file factor_ids_in_file=@project.factor_ids.tsv dir project_dir disp "EAGGL factor ids (row order of the loadings)" parent project_input_cat class_level project
table path file factor_metadata_in_file=@project.factor_metadata.tsv dir project_dir disp "EAGGL factor metadata" parent project_input_cat class_level project
table path file eaggl_genes_in_file=@project.genes.tsv dir project_dir disp "EAGGL genes (column order of the loadings)" parent project_input_cat class_level project
path file capped_entries_in_file=@project.capped_entries.tsv.gz dir project_dir disp "EAGGL loadings changed by capping" parent project_input_cat class_level project
table path file cfde_index_in_file=@project.cfde_index.in.tsv dir project_dir disp "CFDE gene-set library index (whole snapshot)" parent project_input_cat class_level project
table path file kpn_trait_registry_file=@project.kpn_trait_registry.tsv dir project_dir disp "KPN trait registry" parent project_input_cat class_level project
path file kpn_trait_flat_file=@project.kpn_trait_flat.tsv dir project_dir disp "KPN trait ontology mappings" parent project_input_cat class_level project

# --- project level: prepared inputs ---
table path file cfde_index_file=@project.cfde_index.tsv dir project_dir disp "CFDE gene-set library index (the release's libraries)" parent project_cat class_level project
table path file trait_kpn_map_file=@project.trait_kpn_map.tsv dir project_dir disp "EAGGL trait -> KPN.TRAIT id" parent project_cat class_level project
path file all_factors_file=@project.all_factors.factors_by_genes.tsv.gz dir project_dir disp "All factors (eaggl factors-by-genes input)" parent project_cat class_level project
table path file factor_index_file=@project.factor_index.tsv dir project_dir disp "Factor index (FactorN -> factor_id)" parent project_cat class_level project
path file annotations_gmt_file=@project.cfde_annotations.gmt.gz dir project_dir disp "All CFDE gene sets (eaggl X input)" parent project_cat class_level project
path file gene_set_index_file=@project.gene_set_index.tsv.gz dir project_dir disp "Gene-set index (id -> name, collection)" parent project_cat class_level project
path file gene_case_map_file=@project.cfde_to_eaggl_case.gene.map dir project_dir disp "Case-only CFDE -> EAGGL gene map" parent project_cat class_level project
table path file annotation_chunks_file=@project.cfde_annotations.chunks.tsv dir project_dir disp "eaggl X input chunks (files in annotation_chunks/)" parent project_cat class_level project
table path file gene_overlap_report_file=@project.gene_overlap_report.tsv dir project_dir disp "CFDE gene overlap with the EAGGL factors" parent project_cat class_level project
table path file pigean_gene_stats_index_file=@project.pigean_gene_stats.index.tsv dir project_dir disp "PIGEAN gene stats index (trait -> byte range of the export)" parent project_cat class_level project

# --- project level: collected per-trait results ---
table path file projection_manifest_file=@project.projection_manifest.tsv dir project_dir disp "Per-trait projection manifest (QC)" parent project_cat class_level project
path file top_gene_sets_file=@project.top_gene_sets_per_factor.tsv.gz dir project_dir disp "Top gene sets per factor (all traits)" parent project_cat class_level project

# --- collection level ---
path file cfde_gmt_file=@geneset_collection.genesets.dapper-ids.gmt dir collection_dir disp "GMT (dapper:GeneSet ids)" parent collection_cat class_level geneset_collection
path file cfde_names_gmt_file=@geneset_collection.genesets.gmt dir collection_dir disp "GMT (source names)" parent collection_cat class_level geneset_collection
path file cfde_collection_yaml_file=@geneset_collection.GeneSetCollection.yaml dir collection_dir disp "DAPPER GeneSetCollection document" parent collection_cat class_level geneset_collection
table path file collection_gene_sets_file=@geneset_collection.gene_sets.tsv dir collection_dir disp "Collection gene-set index" parent collection_cat class_level geneset_collection

# --- trait level ---
path file trait_factors_file=@trait.factors_by_genes.tsv.gz dir trait_dir disp "Trait factors (eaggl input)" parent trait_cat class_level trait
table path file trait_factor_index_file=@trait.factor_index.tsv dir trait_dir disp "Trait factor index (FactorK -> factor_id)" parent trait_cat class_level trait
path file trait_params_file=@trait.eaggl.params.tsv dir trait_dir disp "eaggl params (first chunk)" parent trait_cat class_level trait
path file trait_warnings_file=@trait.eaggl.warnings.txt dir trait_dir disp "eaggl warnings (all chunks)" parent trait_cat class_level trait
path file trait_projection_log_file=@trait.eaggl.log dir trait_dir disp "eaggl log (all chunks)" parent trait_cat class_level trait
path file trait_pigean_commit_file=@trait.pigean_commit.txt dir trait_dir disp "pigean commit" parent trait_cat class_level trait
path file trait_projection_long_file=@trait.cfde_projection.long.tsv.gz dir trait_dir disp "Joint + marginal loadings of the per-library top gene sets (every factor)" parent trait_cat class_level trait
path file trait_top_file=@trait.cfde_projection.top.tsv.gz dir trait_dir disp "Top gene sets per factor and library" parent trait_cat class_level trait
table path file trait_qc_file=@trait.projection_qc.tsv dir trait_dir disp "Projection QC" parent trait_cat class_level trait

# --- trait level: gene-set betas (pigean betas on the trait's PIGEAN gene stats) ---
path file trait_gene_stats_file=@trait.pigean_gene_stats.tsv.gz dir trait_dir disp "PIGEAN gene stats (gene, combined, log_bf, prior)" parent gene_set_stats_cat class_level trait
path file trait_gene_set_stats_raw_file=@trait.gene_set_stats.pigean.tsv.gz dir trait_dir disp "Gene-set stats (raw pigean)" parent gene_set_stats_cat class_level trait
path file trait_gene_set_stats_params_file=@trait.gene_set_stats.params.tsv dir trait_dir disp "pigean params" parent gene_set_stats_cat class_level trait
path file trait_gene_set_stats_warnings_file=@trait.gene_set_stats.warnings.txt dir trait_dir disp "pigean warnings" parent gene_set_stats_cat class_level trait
path file trait_gene_set_stats_log_file=@trait.gene_set_stats.log dir trait_dir disp "pigean log" parent gene_set_stats_cat class_level trait
path file trait_gene_set_stats_pigean_commit_file=@trait.gene_set_stats.pigean_commit.txt dir trait_dir disp "pigean commit" parent gene_set_stats_cat class_level trait
path file trait_gene_set_stats_file=@trait.cfde_gene_set_stats.tsv.gz dir trait_dir disp "Trait -> CFDE gene-set betas (ranked per library)" parent gene_set_stats_cat class_level trait

# --- project level: reference release (the folder itself is release_files_dir; this is the build's JSON result) ---
path file release_result_file=@project.release.json dir release_dir disp "Reference release (build result)" parent release_cat class_level project

# --- project level: audit portal (scripts/factor_portal; ../README.md "Audit portal") ---
path file portal_db_file=@project.portal.sqlite dir portal_dir disp "Portal SQLite" parent portal_cat class_level project
path file portal_build_log_file=@project.portal.build.log dir portal_dir disp "Portal build log" parent portal_cat class_level project
table path file portal_factor_audit_file=@project.portal.factor_audit.tsv dir portal_dir disp "Per-factor audit columns and flags" parent portal_cat class_level project
table path file portal_gene_set_audit_file=@project.portal.gene_set_audit.tsv dir portal_dir disp "Gene sets by number of factor top lists (hubs)" parent portal_cat class_level project
path file portal_html_file=@project.portal.html dir portal_dir disp "Portal page (static; calls the portal server)" parent portal_cat class_level project

#=======================================================================================================================
# COMMANDS
# Cmd keys are prefixed by stage so that stages can be run with --only-cmd:
#   collection_ / prep_ (inputs), trait_ (per-trait projection), collect_,
#   betas_ (trait -> CFDE gene-set betas), portal_ (audit portal), release_ (reference release)

# --- project level: the release's collections ($cfde_libraries, a meta key: the snapshot's libraries minus the excluded) ---
local cmd prep_cfde_index_cmd=$helper_cmd cfde-index --libraries $cfde_libraries \
    !{input:--index-file:cfde_index_in_file} \
    !{output:--output-file:cfde_index_file}; \
    class_level project

# --- collection level: check the id and name GMTs agree row for row and index the gene sets ---
local cmd collection_index_cmd=$helper_cmd collection-index \
    !{prop:--label:geneset_collection} \
    !{prop:--collection-id:geneset_collection:collection_id} \
    !{prop:--library:geneset_collection:library} \
    !{input:--gmt-file:cfde_gmt_file} \
    !{input:--names-gmt-file:cfde_names_gmt_file} \
    !{input:--collection-yaml-file:cfde_collection_yaml_file} \
    !{output:--output-file:collection_gene_sets_file}; \
    class_level geneset_collection

# --- project level: inputs ---
# EAGGL trait -> KPN.TRAIT id by exact legacy_phenotype_id; fails unless every trait has exactly one hit
# and the registry file is byte-identical to the release tag.
local cmd prep_trait_kpn_map_cmd=$helper_cmd trait-kpn-map \
    !{input:--factor-ids-file:factor_ids_in_file} \
    !{input:--registry-file:kpn_trait_registry_file} \
    !{prop:--kpn-release:project:kpn_release} \
    !{output:--output-file:trait_kpn_map_file}; \
    class_level project

# eaggl's factors-by-genes layout needs the header cell `Factor`; values are copied verbatim and the
# row order (= factor_ids.tsv) defines the global Factor1..4037.
short cmd prep_assemble_factors_cmd=$helper_cmd assemble-factors \
    !{input:--loadings-file:factor_loadings_in_file} \
    !{input:--factor-ids-file:factor_ids_in_file} \
    !{input:--factor-metadata-file:factor_metadata_in_file} \
    !{input:--genes-file:eaggl_genes_in_file} \
    !{input:--capped-entries-file:capped_entries_in_file} \
    !{input:--trait-kpn-map-file:trait_kpn_map_file} \
    !{prop:--loading-variant:project:loading_variant} \
    !{output:--output-file:all_factors_file} \
    !{output:--output-factor-index-file:factor_index_file}; \
    class_level project rusage_mod 8000

# Fan-in over all collections: the GMTs are concatenated byte for byte (sorted by label); the gene map only fixes
# letter case (e.g. C10orf71 -> C10ORF71) for symbols absent from the factors. Two streaming passes over the GMTs.
short cmd prep_build_annotations_cmd=$helper_cmd build-annotations \
    !{input:--gmt-file:cfde_gmt_file} \
    !{input:--collection-gene-sets-file:collection_gene_sets_file} \
    !{input:--cfde-index-file:cfde_index_file} \
    !{input:--eaggl-genes-file:eaggl_genes_in_file} \
    --cfde-snapshot $cfde_snapshot \
    !{output:--output-gmt-file:annotations_gmt_file} \
    !{output:--output-gene-set-index-file:gene_set_index_file} \
    !{output:--output-gene-map-file:gene_case_map_file} \
    !{output:--output-overlap-report-file:gene_overlap_report_file}; \
    class_level project rusage_mod 16000

# eaggl's X input in chunks of at most $projection_chunk_gene_sets gene sets (files in annotation_chunks/).
short cmd prep_chunk_annotations_cmd=$helper_cmd chunk-annotations \
    !{input:--annotations-gmt-file:annotations_gmt_file} \
    !{input:--gene-set-index-file:gene_set_index_file} \
    --chunk-size $projection_chunk_gene_sets --output-dir !{key::annotation_chunks_dir} \
    !{output:--output-file:annotation_chunks_file}; \
    class_level project rusage_mod 8000

# --- trait level: per-trait joint + marginal projection ---
# All 18,477 gene columns are kept: eaggl silently drops gene sets with no gene in the factor table.
short cmd trait_factors_cmd=$helper_cmd trait-factors \
    !{input:--all-factors-file:all_factors_file} \
    !{input:--factor-index-file:factor_index_file} \
    !{prop:--trait:trait} \
    !{output:--output-file:trait_factors_file} \
    !{output:--output-factor-index-file:trait_factor_index_file}; \
    class_level trait

# The trait's projection, chunk by chunk (resumable: finished chunks are not rerun), then merged and ranked; the
# per-chunk eaggl outputs are removed afterwards. Checks the pinned pigean clone first, like record-pigean-commit, and
# QC (every gene set projected, eaggl labels match the factor order, K=1 joint == marginal, all genes aligned).
cmd trait_project_cmd=$helper_cmd project-trait --python $python_cmd --pigean-src $pigean_repo_dir/src \
    --repo-dir $pigean_repo_dir --expected-pigean-commit $pigean_commit \
    !{input:--chunks-file:annotation_chunks_file} \
    !{input:--trait-factors-file:trait_factors_file} \
    !{input:--trait-factor-index-file:trait_factor_index_file} \
    !{input:--gene-map-file:gene_case_map_file} \
    !{input:--gene-set-index-file:gene_set_index_file} \
    !{input:--trait-kpn-map-file:trait_kpn_map_file} \
    !{prop:--trait:trait} \
    !{prop:--kpn-trait-id:trait:kpn_trait_id} \
    !{prop:--loading-variant:project:loading_variant} \
    --seed $projection_seed --top-n $top_n_gene_sets \
    --work-dir !{key::trait_dir}/eaggl_chunks \
    !{output:--output-long-file:trait_projection_long_file} \
    !{output:--output-top-file:trait_top_file} \
    !{output:--output-qc-file:trait_qc_file} \
    !{output:--output-commit-file:trait_pigean_commit_file} \
    !{output:--output-params-file:trait_params_file} \
    !{output:--output-warnings-file:trait_warnings_file} \
    !{output:--output-log-file:trait_projection_log_file}; \
    class_level trait rusage_mod $trait_projection_mem

# --- project level: fan-in over all 711 traits (never run under --only: the fan-in would shrink) ---
cmd collect_projections_cmd=$helper_cmd collect \
    !{input:--qc-file:trait_qc_file} \
    !{input:--top-file:trait_top_file} \
    !{input:--trait-kpn-map-file:trait_kpn_map_file} \
    --expected-pigean-commit $pigean_commit \
    !{output:--output-manifest-file:projection_manifest_file} \
    !{output:--output-top-file:top_gene_sets_file}; \
    class_level project

# --- project level: audit portal (scripts/factor_portal; ../README.md "Audit portal") ---
# build reads the outputs a reviewer needs into one SQLite: every factor's nonzero EAGGL gene loadings, its top gene
# sets with their member-gene overlap, and (from the 711 long files) each top gene set's loadings on all of the trait's
# factors. It refuses to write the database unless every marginal loading recomputed from the gene loadings
# (sum of w_g over the members / w'w) equals eaggl's within %.4g rounding. Fan-in over all traits like collect_: never
# run under --only. export-audit flattens the audit columns; the static page calls a portal server you start yourself.
short cmd portal_build_db_cmd=$portal_cmd !{output:--log-file:portal_build_log_file} build !{prop:--project:project} \
    !{input:--trait-kpn-map-file:trait_kpn_map_file} \
    !{input:--kpn-trait-flat-file:kpn_trait_flat_file} \
    !{input:--projection-manifest-file:projection_manifest_file} \
    !{input:--factor-index-file:factor_index_file} \
    !{input:--factor-metadata-file:factor_metadata_in_file} \
    !{input:--all-factors-file:all_factors_file} \
    !{input:--cfde-index-file:cfde_index_file} \
    !{input:--gene-set-index-file:gene_set_index_file} \
    !{input:--annotations-gmt-file:annotations_gmt_file} \
    !{input:--gene-map-file:gene_case_map_file} \
    !{input:--top-gene-sets-file:top_gene_sets_file} \
    !{input:--long-file:trait_projection_long_file} \
    --top-n $top_n_gene_sets \
    !{output:--output-db:portal_db_file}; \
    class_level project rusage_mod $portal_build_mem

local cmd portal_export_audit_cmd=$portal_cmd export-audit \
    !{input:--db:portal_db_file} \
    !{output:--output-factor-audit-file:portal_factor_audit_file} \
    !{output:--output-gene-set-audit-file:portal_gene_set_audit_file}; \
    class_level project

local cmd portal_build_html_cmd=$portal_cmd html \
    !{input:--db:portal_db_file} \
    --api-url $portal_api_url \
    --title "$portal_title" \
    !{output:--output-html:portal_html_file}; \
    class_level project

# --- trait -> CFDE gene-set betas: `pigean betas` (no outer Gibbs) on each trait's existing PIGEAN gene stats ---
# PIGEAN is not rerun. The gene stats come from the all-trait export $pigean_gene_stats_file (the mouse_msigdb run the
# EAGGL factors came from): betas_index_cmd finds every trait's rows in one pass, and each trait reads its own byte
# range. The response is $gene_set_stats_response: log_bf (direct genetic support, so a PIGEAN run on the CFDE gene sets
# minus the outer Gibbs) or combined (adds the export's mouse_msigdb priors). The pigean GWAS profile sets the gene
# locations, the NCBI37.3 gene universe and portal gene map, the p < 0.01 prefilter and the 5,000-gene-set cap.
short cmd betas_index_cmd=$helper_cmd gene-stats-index --gene-stats-file $pigean_gene_stats_file \
    !{input:--trait-kpn-map-file:trait_kpn_map_file} \
    !{output:--output-file:pigean_gene_stats_index_file}; \
    class_level project

short cmd betas_trait_gene_stats_cmd=$helper_cmd trait-gene-stats --gene-stats-file $pigean_gene_stats_file \
    !{input:--index-file:pigean_gene_stats_index_file} \
    !{prop:--trait:trait} \
    !{output:--output-file:trait_gene_stats_file}; \
    class_level trait

cmd betas_trait_run_cmd=$helper_cmd record-pigean-commit --repo-dir $pigean_repo_dir --expected-commit $pigean_commit \
    !{output:--output-file:trait_gene_set_stats_pigean_commit_file} && \
    $pigean_cmd betas --config $pigean_profile \
    !{input:--X-in:annotations_gmt_file} \
    !{input:--gene-stats-in:trait_gene_stats_file} \
    --gene-stats-id-col gene --gene-stats-log-bf-col $gene_set_stats_response \
    --retain-all-beta-uncorrected --deterministic --seed $projection_seed --hide-progress --hide-opts \
    !{output:--gene-set-stats-out:trait_gene_set_stats_raw_file} \
    !{output:--params-out:trait_gene_set_stats_params_file} \
    !{output:--warnings-file:trait_gene_set_stats_warnings_file} \
    !{output:--log-file:trait_gene_set_stats_log_file} && \
    touch !{output::trait_gene_set_stats_warnings_file}; \
    class_level trait rusage_mod $gene_set_stats_mem

# Keeps the gene sets PIGEAN analyzed (filter_reason kept) with KPN and collection ids, ranked by beta_uncorrected
# within their library; refuses another response, an unknown gene set or another pigean commit.
short cmd betas_trait_annotate_cmd=$helper_cmd annotate-gene-set-stats \
    !{input:--stats-file:trait_gene_set_stats_raw_file} \
    !{input:--params-file:trait_gene_set_stats_params_file} \
    !{input:--gene-set-index-file:gene_set_index_file} \
    !{input:--trait-kpn-map-file:trait_kpn_map_file} \
    !{prop:--trait:trait} \
    !{prop:--kpn-trait-id:trait:kpn_trait_id} \
    --response $gene_set_stats_response \
    !{input:--pigean-commit-file:trait_gene_set_stats_pigean_commit_file} \
    --expected-pigean-commit $pigean_commit \
    !{output:--output-file:trait_gene_set_stats_file}; \
    class_level trait

# --- project level: reference release (services/backend/src/reveal_backend/reference_release.py; ../README.md) ---
# Pure files: reads the LAP outputs, the per-trait long files (per-library ranks), the per-trait gene-set betas, the
# collection YAMLs and the vector cache (factor labels and DisMech contexts; gene sets are not embedded); only factor
# labels missing from the cache are embedded (EMBEDDING_SERVICE_URL from $reveal_repo_dir/.env). The folder is swapped into release_files_dir; the JSON result is written only on success.
# A fan-in over all 711 traits like collect_: never run under --only. Publishing is a separate command, run by hand.
# A cluster job: the 1.5M gene sets' index rows stay in memory and the collection documents (9 GB of YAML) are read one
# at a time on $release_build_workers workers.
cmd release_build_cmd=$reveal_python -B -m reveal_backend.reference_release build \
    --lap-project-dir !{key::project_dir} !{prop:--kpn-release:project:kpn_release} \
    !{input:--long-file:trait_projection_long_file} \
    !{input:--gene-set-stats-file:trait_gene_set_stats_file} \
    !{input:trait_kpn_map_file} !{input:factor_index_file} !{input:factor_metadata_in_file} !{input:all_factors_file} \
    !{input:gene_set_index_file} !{input:cfde_index_file} !{input:kpn_trait_registry_file} !{input:kpn_trait_flat_file} \
    !{input:projection_manifest_file} \
    !{input:cfde_collection_yaml_file} \
    --vector-cache $reference_vector_cache \
    --top-n $top_n_gene_sets --workers $release_build_workers --out !{key::release_files_dir} \
    | tee !{output::release_result_file}.part && mv !{output::release_result_file}.part !{output::release_result_file}; \
    class_level project rusage_mod $release_build_mem

#=======================================================================================================================
# CONFIGURATION

lap_trunk=$lap_home/trunk
!include $lap_trunk/config/common.cfg

# eaggl runs from a pinned clone of packages/pigean (not the development checkout), created once with
#   git clone --no-checkout /humgen/diabetes2/users/chase/packages/pigean raw/pigean_ca59661
#   git -C raw/pigean_ca59661 checkout --detach ca59661644dc9ead429fc7e59050870ba49b26e8
# Every eaggl job first checks that the clone is at $pigean_commit with a clean src/ (record-pigean-commit),
# and annotate/relabel/collect reject any other commit. There is no installed eaggl entry point, so it runs
# from src/ with the pigean project's venv (Python 3.9; eaggl's supplied-factor projection tests pass on it).
# One BLAS thread per job to match the single UGER slot.
pigean_commit=ca59661644dc9ead429fc7e59050870ba49b26e8
pigean_repo_dir=$base_dir/raw/pigean_ca59661
python_cmd=/humgen/diabetes2/users/chase/projects/pigean/.venv/bin/python
eaggl_cmd=env PYTHONPATH=$pigean_repo_dir/src PYTHONDONTWRITEBYTECODE=1 OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 $python_cmd -B -m eaggl
helper_cmd=env PYTHONDONTWRITEBYTECODE=1 $python_cmd -B $base_dir/scripts/projection_workflow.py

# Gene-set betas: pigean betas mode from the same pinned clone ($pigean_gene_stats_file is a meta key). T2D took 61 s
# and peaked at 0.6 GB with log_bf; with combined it analyzed 4x more gene sets (4,974) in 139 s.
pigean_cmd=env PYTHONPATH=$pigean_repo_dir/src PYTHONDONTWRITEBYTECODE=1 OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 $python_cmd -B -m pigean
pigean_profile=$pigean_repo_dir/config/profiles/gwas.default.json
gene_set_stats_response=log_bf
gene_set_stats_mem=8000

# The joint solve starts from random H; a fixed seed makes every run reproducible.
projection_seed=1
top_n_gene_sets=50

# Audit portal: stdlib only, so it runs on the helpers' Python. The page calls a server you start yourself (in tmux):
#   env PYTHONPATH=$base_dir/scripts $python_cmd -m factor_portal serve --db <portal_dir>/<project>.portal.sqlite --port 8766
# then open http://localhost:8766/ (or the static page) through an SSH tunnel to that port. The full build reads all
# 711 long files (~8 of ~11 min) and peaked at 0.7 GB on the 2026-09-28 projection.
portal_cmd=env PYTHONPATH=$base_dir/scripts PYTHONDONTWRITEBYTECODE=1 $python_cmd -B -m factor_portal
portal_api_url=http://localhost:8766
portal_title=EAGGL x CFDE projection audit
portal_build_mem=4000

# eaggl holds ~4 dense 18,477 x chunk float64 arrays: a 40,000-gene-set chunk of T2D (K=13) peaked at 22.5 GB, so
# 20,000-gene-set chunks fit 16 GB. The merge holds every factor's loadings and ranks (~1.5 GB at K=15). UGER retries
# memory kills with twice the memory; LAP only honours rtime_mod beyond the 16 h `cmd` limit.
projection_chunk_gene_sets=20000
trait_projection_mem=16000

# On UGER, common.cfg's max_sge_batch=1000 submits every ready command of a key as one array job
# (-tc 1000), and max_jobs counts an array as a single job, so nothing would cap the 711 x 32 GB
# projections. Without arrays, max_jobs caps the number of running tasks.
max_sge_batch=1
max_jobs=50
default_mem=4000
bsub_opts=-pe smp 1 -l os=RedHat8

# Reference release: runs on the backend's own Python >= 3.11 venv ($reveal_repo_dir is a meta key,
# scripts/build_meta_yaml.py). Only factor labels and DisMech contexts are embedded; gene sets are not. The vector cache (factor-label and DisMech context vectors keyed by the sha256 of
# their text) is seeded once from Aurora with `scripts/reference_migration.py export-vectors` and lives in raw/.
reveal_python=$reveal_repo_dir/services/backend/.venv/bin/python
reference_vector_cache=$base_dir/raw/reference_vector_cache.sqlite
release_build_workers=4
release_build_mem=32000
