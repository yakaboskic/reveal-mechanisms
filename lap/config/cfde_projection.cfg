!title CFDE gene-set projection onto EAGGL factors

# Projects every CFDE gene set (the DAPPER 0.2.0 release s3://dig-gene-set-data/v2.0_dapper-0.2.0-a1/, snapshot
# 2026-10-05 minus GaultonLab: 9 libraries, 532 GMTs, 1,517,472 gene sets) onto the capped EAGGL factors of the legacy
# 711-trait atlas (raw/EAGGL_capped_union_graph_share, 4,037 factors x 18,477 genes), and scores each trait against the
# gene sets from its existing PIGEAN gene stats. The stages, in run order (command keys are prefixed by stage):
#
#   1. genesets_    index the release's collections, combine them into one GMT and gene-set index (read once), pack
#                   them for the projection and split them per library for the betas
#   2. factors_     KPN trait ids, all factors in eaggl's layout, and each trait's factors as a long table
#   3. projection_  check the projection kernel against the pinned eaggl, project each trait, collect the QC
#   4. betas_       slice each trait's PIGEAN gene stats, fit `pigean betas` per library (all but LINCS), collect
#   portal_, release_ (the audit portal and the reference release), and the optional lincs_ (LINCS betas, ~30 min a
#   trait; not part of a full run)
#
# Outputs are plain text, apart from the linked source loadings and eaggl's all-factor table and the .npy pack.
#
# The projection is eaggl's supplied-factor projection (`python -m eaggl factor --factor-gene-clusters-in ...`), joint
# and marginal, computed by scripts/projection_kernel.py from the packed gene sets: eaggl recomputes two dense
# genes x gene-sets products at every update (98% of its run time), which are fixed linear maps, so the kernel forms
# them once. projection_check_cmd runs the pinned eaggl on sample gene sets of every library for
# $projection_check_traits and refuses unless every %.4g loading and top factor is identical; the trait projections wait
# for it. Each trait's factors are projected jointly on their own, in chunks of $projection_chunk_gene_sets gene sets,
# each as one eaggl run on it (its own random start; it stops after 100 updates or a relative change below 1e-4). Joint
# loadings are a fixed-W multiplicative-update NNLS (the trait's factors compete for each gene set); marginal loadings
# are clip(x'w / w'w, 0, 1). Each trait keeps, per factor, ordinal ranks over all gene sets and within each library;
# its projection file holds every factor's row for the gene sets in some factor's per-library top $top_n_gene_sets.
#
# Identifiers are carried verbatim: GMT column 1 (dapper:GeneSet.*) is eaggl's Gene_Set; the
# dapper:GeneSetCollection.* id is joined from the CFDE index; eaggl names factors by position
# (Factor1..K), so every factor file's row order is recorded and mapped back to trait::FactorN;
# each EAGGL trait is its KPN legacy_phenotype_id and is mapped to its KPN.TRAIT id (release v0.0.2
# of dig-portal-data-models, pinned by commit).
#
# The betas regress each trait's existing PIGEAN gene stats (an all-trait export, sliced per trait by byte range) on
# the CFDE gene sets with `python -m pigean betas` (gene-set betas, no outer Gibbs), one library at a time: each library
# gets its own prior p, prefilter and 5,000-gene-set cap (pooled, LINCS took 79% of T2D's slots and drove p to 1e-5).
# They keep beta_uncorrected and the joint beta of every gene set PIGEAN analyzes (its p < 0.01 prefilter).
#
# The release stage then writes one reference release folder (traits, factors and their gene loadings, CFDE collections
# and gene sets, per-library top projections, the betas, DAPPER provenance, frozen factor snapshots and the reused
# vectors). One command, `python -m reveal_backend.reference_release publish`, run by hand, replaces each environment's
# reference tables and Upstash vectors with it (../README.md "Reference release").
#
# The meta is generated, never hand-edited:
#   python3 scripts/build_meta_yaml.py
#   PYTHONPATH=/humgen/diabetes2/users/chase/packages/meta-sanity python3 -m meta_sanity.generate_meta \
#       config/cfde_projection.meta.yaml config/cfde_projection.meta
# Run sequence, checks and output schema: ../README.md

lap_home=/humgen/diabetes/users/chase/lap

# Run with:
# perl $lap_home/trunk/bin/run.pl --meta /humgen/diabetes2/users/chase/projects/reveal-mechanisms/lap/config/cfde_projection.meta

#=======================================================================================================================
# CLASSES
# Hierarchy:
#   project
#   +-- geneset_collection -> project   (one CFDE GMT; instance name = CFDE index label)
#   +-- trait -> project                (one EAGGL trait; instance name = EAGGL trait = KPN legacy_phenotype_id)

class project=Project
class geneset_collection=GeneSetCollection parent project
class trait=Trait parent project

#=======================================================================================================================
# DIRECTORIES

sortable mkdir path projects_dir=$unix_out_dir/projects
sortable mkdir path project_dir=$projects_dir/@project class_level project

sortable mkdir path collections_dir=$project_dir/collections class_level project
sortable mkdir path collection_dir=$collections_dir/@geneset_collection class_level geneset_collection

sortable mkdir path traits_dir=$project_dir/traits class_level project
sortable mkdir path trait_dir=$traits_dir/@trait class_level trait
sortable mkdir path trait_betas_dir=$trait_dir/betas class_level trait

sortable mkdir path library_gmts_dir=$project_dir/library_gmts class_level project
sortable mkdir path projection_check_dir=$project_dir/projection_check class_level project
sortable mkdir path portal_dir=$project_dir/portal class_level project
sortable mkdir path release_dir=$project_dir/release class_level project
sortable mkdir path release_files_dir=$release_dir/files class_level project

#=======================================================================================================================
# CATEGORIES (the groups of the LAP web view, in run order)

cat project_input_cat=null disp "Linked inputs" class_level project
cat genesets_cat=null disp "1. CFDE gene sets" class_level project
cat factors_cat=null disp "2. EAGGL factors" class_level project
cat projection_cat=null disp "3. Projection (all traits)" class_level project
cat betas_cat=null disp "4. Gene-set betas (all traits)" class_level project
cat portal_cat=null disp "Audit portal" class_level project
cat release_cat=null disp "Reference release" class_level project
cat collection_cat=null disp "Collection" class_level geneset_collection
cat trait_factors_cat=null disp "2. Trait factors" class_level trait
cat trait_projection_cat=null disp "3. Trait projection" class_level trait
cat trait_betas_cat=null disp "4. Trait gene-set betas (8 libraries; pigean betas)" class_level trait
cat trait_lincs_cat=null disp "Optional: trait LINCS betas" class_level trait

#=======================================================================================================================
# PROPERTIES

# Project: which EAGGL loadings to project (capped = the share's matrix; uncapped = restored from
# capped_entries.tsv.gz) and which KPN trait release the trait ids come from.
prop loading_variant=scalar
prop kpn_release=scalar

# Collection: the DAPPER collection id and CFDE library of the GMT.
prop collection_id=scalar
prop library=scalar

# Trait: its KPN.TRAIT id (also written by factors_kpn_map_cmd; the trait steps check they agree).
prop kpn_trait_id=scalar

#=======================================================================================================================
# FILES (plain text unless noted: only the source loadings, eaggl's all-factor table input and the .npy pack are not)

# --- project level: linked inputs (set in the meta, symlinked by --init) ---
path file factor_loadings_in_file=@project.capped_factor_gene_loadings.tsv.gz dir project_dir disp "EAGGL capped factor x gene loadings" parent project_input_cat class_level project
table path file factor_ids_in_file=@project.factor_ids.tsv dir project_dir disp "EAGGL factor ids (row order of the loadings)" parent project_input_cat class_level project
table path file factor_metadata_in_file=@project.factor_metadata.tsv dir project_dir disp "EAGGL factor metadata" parent project_input_cat class_level project
table path file eaggl_genes_in_file=@project.genes.tsv dir project_dir disp "EAGGL genes (column order of the loadings)" parent project_input_cat class_level project
path file capped_entries_in_file=@project.capped_entries.tsv.gz dir project_dir disp "EAGGL loadings changed by capping" parent project_input_cat class_level project
table path file cfde_index_in_file=@project.cfde_index.in.tsv dir project_dir disp "CFDE gene-set library index (whole snapshot)" parent project_input_cat class_level project
table path file kpn_trait_registry_file=@project.kpn_trait_registry.tsv dir project_dir disp "KPN trait registry" parent project_input_cat class_level project
path file kpn_trait_flat_file=@project.kpn_trait_flat.tsv dir project_dir disp "KPN trait ontology mappings" parent project_input_cat class_level project

# --- 1. CFDE gene sets ---
table path file cfde_index_file=@project.cfde_index.tsv dir project_dir disp "The release's collections (9 libraries)" parent genesets_cat class_level project
path file annotations_gmt_file=@project.gene_sets.gmt dir project_dir disp "All gene sets as one GMT (blank descriptions)" parent genesets_cat class_level project
path file gene_set_index_file=@project.gene_set_index.tsv dir project_dir disp "Gene-set index (1.5M rows: id, name, collection, library, sizes)" parent genesets_cat class_level project
path file gene_case_map_file=@project.cfde_to_eaggl_case.gene.map dir project_dir disp "Case-only CFDE -> EAGGL gene map" parent genesets_cat class_level project
table path file gene_overlap_report_file=@project.gene_overlap_report.tsv dir project_dir disp "Gene overlap with the EAGGL factors, per library" parent genesets_cat class_level project
path file annotation_indptr_file=@project.gene_sets.indptr.npy dir project_dir disp "Packed gene sets for the projection: column pointers (binary)" parent genesets_cat class_level project
path file annotation_indices_file=@project.gene_sets.indices.npy dir project_dir disp "Packed gene sets for the projection: gene rows (binary)" parent genesets_cat class_level project
table path file annotation_chunks_file=@project.projection_chunks.tsv dir project_dir disp "Projection chunks (row ranges of the packed gene sets)" parent genesets_cat class_level project
table path file library_gmts_file=@project.library_gmts.tsv dir project_dir disp "One GMT per library for the betas (files in library_gmts/)" parent genesets_cat class_level project

# --- 2. EAGGL factors ---
table path file trait_kpn_map_file=@project.trait_kpn_map.tsv dir project_dir disp "EAGGL trait -> KPN.TRAIT id" parent factors_cat class_level project
path file all_factors_file=@project.all_factors.factors_by_genes.tsv dir project_dir disp "All factors x 18,477 genes (eaggl's layout)" parent factors_cat class_level project
table path file factor_index_file=@project.factor_index.tsv dir project_dir disp "Factor index (FactorN -> factor_id)" parent factors_cat class_level project

# --- 3. Projection (all traits) ---
table path file projection_check_file=@project.projection_check.tsv dir project_dir disp "Projection kernel vs the pinned eaggl (eaggl's outputs in projection_check/)" parent projection_cat class_level project
table path file projection_manifest_file=@project.projection_manifest.tsv dir project_dir disp "Projection QC, all traits" parent projection_cat class_level project
path file top_gene_sets_file=@project.projection_top.tsv dir project_dir disp "Top gene sets per factor and library, all traits" parent projection_cat class_level project

# --- 4. Gene-set betas (all traits) ---
table path file pigean_gene_stats_index_file=@project.gene_stats_index.tsv dir project_dir disp "PIGEAN gene stats index (trait -> byte range of the export)" parent betas_cat class_level project
table path file betas_manifest_file=@project.betas_manifest.tsv dir project_dir disp "Betas runs, all traits x libraries" parent betas_cat class_level project

# --- collection level ---
path file cfde_gmt_file=@geneset_collection.genesets.dapper-ids.gmt dir collection_dir disp "GMT (dapper:GeneSet ids)" parent collection_cat class_level geneset_collection
path file cfde_names_gmt_file=@geneset_collection.genesets.gmt dir collection_dir disp "GMT (source names)" parent collection_cat class_level geneset_collection
path file cfde_collection_yaml_file=@geneset_collection.GeneSetCollection.yaml dir collection_dir disp "DAPPER GeneSetCollection document" parent collection_cat class_level geneset_collection
table path file collection_gene_sets_file=@geneset_collection.gene_sets.tsv dir collection_dir disp "Collection gene-set index" parent collection_cat class_level geneset_collection

# --- trait level: 2. factors ---
table path file trait_factors_file=@trait.factors.tsv dir trait_dir disp "Factor loadings (factor_id, gene, loading; nonzero)" parent trait_factors_cat class_level trait
table path file trait_factor_index_file=@trait.factor_index.tsv dir trait_dir disp "Factor index (FactorK -> factor_id)" parent trait_factors_cat class_level trait

# --- trait level: 3. projection ---
table path file trait_projection_long_file=@trait.projection.tsv dir trait_dir disp "Joint + marginal loadings of the per-library top gene sets (every factor)" parent trait_projection_cat class_level trait
table path file trait_top_file=@trait.projection_top.tsv dir trait_dir disp "Each factor's per-library top gene sets" parent trait_projection_cat class_level trait
table path file trait_qc_file=@trait.projection_qc.tsv dir trait_dir disp "Projection QC" parent trait_projection_cat class_level trait
path file trait_projection_log_file=@trait.projection.log dir trait_dir disp "Projection log (one line per chunk)" parent trait_projection_cat class_level trait

# --- trait level: 4. gene-set betas ---
table path file trait_gene_stats_file=@trait.gene_stats.tsv dir trait_dir disp "PIGEAN gene stats (gene, combined, log_bf, prior)" parent trait_betas_cat class_level trait
table path file trait_betas_runs_file=@trait.betas_runs.tsv dir trait_dir disp "pigean fits, one per library (status, kept, p, sigma2)" parent trait_betas_cat class_level trait
table path file trait_betas_all_file=@trait.betas_all.tsv dir trait_dir disp "Every gene set pigean read, with its filter_reason" parent trait_betas_cat class_level trait
table path file trait_gene_set_stats_file=@trait.betas.tsv dir trait_dir disp "Gene-set betas: the analyzed gene sets, ranked per library" parent trait_betas_cat class_level trait

# --- trait level: optional LINCS betas ---
table path file trait_lincs_runs_file=@trait.lincs_betas_runs.tsv dir trait_dir disp "pigean LINCS fit (capped)" parent trait_lincs_cat class_level trait
table path file trait_lincs_betas_file=@trait.lincs_betas.tsv dir trait_dir disp "LINCS gene-set betas, ranked" parent trait_lincs_cat class_level trait

# --- project level: audit portal (scripts/factor_portal; ../README.md "Audit portal") ---
path file portal_db_file=@project.portal.sqlite dir portal_dir disp "Portal SQLite" parent portal_cat class_level project
path file portal_build_log_file=@project.portal.build.log dir portal_dir disp "Portal build log" parent portal_cat class_level project
table path file portal_factor_audit_file=@project.portal.factor_audit.tsv dir portal_dir disp "Per-factor audit columns and flags" parent portal_cat class_level project
table path file portal_gene_set_audit_file=@project.portal.gene_set_audit.tsv dir portal_dir disp "Gene sets by number of factor top lists (hubs)" parent portal_cat class_level project
path file portal_html_file=@project.portal.html dir portal_dir disp "Portal page (static; calls the portal server)" parent portal_cat class_level project

# --- project level: reference release (the folder itself is release_files_dir; this is the build's JSON result) ---
path file release_result_file=@project.release.json dir release_dir disp "Reference release (build result)" parent release_cat class_level project

#=======================================================================================================================
# COMMANDS
# Cmd keys are prefixed by stage, in run order, so that a stage runs with --only-cmd:
#   genesets_ (1. CFDE gene sets), factors_ (2. EAGGL factors), projection_ (3), betas_ (4. gene-set betas),
#   portal_ (audit portal), release_ (reference release), and lincs_ (optional LINCS betas; not part of a full run).

# ----- 1. CFDE gene sets ------------------------------------------------------------------------------------------------
# The release's collections ($cfde_libraries, a meta key: the snapshot's libraries minus the excluded).
local cmd genesets_cfde_index_cmd=$helper_cmd cfde-index --libraries $cfde_libraries \
    !{input:--index-file:cfde_index_in_file} \
    !{output:--output-file:cfde_index_file}; \
    class_level project

# Per collection: the id and name GMTs must agree on every gene column; gene tokens eaggl and pigean would misread
# (whitespace, ':') are refused.
local cmd genesets_collection_index_cmd=$helper_cmd collection-index \
    !{prop:--label:geneset_collection} \
    !{prop:--collection-id:geneset_collection:collection_id} \
    !{prop:--library:geneset_collection:library} \
    !{input:--gmt-file:cfde_gmt_file} \
    !{input:--names-gmt-file:cfde_names_gmt_file} \
    !{input:--collection-yaml-file:cfde_collection_yaml_file} \
    !{output:--output-file:collection_gene_sets_file}; \
    class_level geneset_collection

# Fan-in over all collections (never run under --only), sorted by label. Each gene set is written as its id, a blank
# description and its genes: the DAPPER 0.2.0 GMTs fill the description column with free text, which eaggl and pigean
# (whitespace split) would read as genes. The gene map only fixes letter case (e.g. C10orf71 -> C10ORF71) for symbols
# absent from the factors. Two streaming passes over the GMTs.
short cmd genesets_combine_cmd=$helper_cmd build-annotations \
    !{input:--gmt-file:cfde_gmt_file} \
    !{input:--collection-gene-sets-file:collection_gene_sets_file} \
    !{input:--cfde-index-file:cfde_index_file} \
    !{input:--eaggl-genes-file:eaggl_genes_in_file} \
    --cfde-snapshot $cfde_snapshot \
    !{output:--output-gmt-file:annotations_gmt_file} \
    !{output:--output-gene-set-index-file:gene_set_index_file} \
    !{output:--output-gene-map-file:gene_case_map_file} \
    !{output:--output-overlap-report-file:gene_overlap_report_file}; \
    class_level project rusage_mod 16000

# The gene sets read once for the projection: one 0/1 genes x gene-sets matrix over the EAGGL genes (the tokens eaggl
# reads, through the case-only gene map; ~1.5 GB of .npy), and the chunks (row ranges of at most
# $projection_chunk_gene_sets gene sets).
short cmd genesets_pack_cmd=$helper_cmd pack-annotations \
    !{input:--annotations-gmt-file:annotations_gmt_file} \
    !{input:--gene-set-index-file:gene_set_index_file} \
    !{input:--gene-map-file:gene_case_map_file} \
    !{input:--genes-file:eaggl_genes_in_file} \
    --chunk-size $projection_chunk_gene_sets \
    !{output:--output-indptr-file:annotation_indptr_file} \
    !{output:--output-indices-file:annotation_indices_file} \
    !{output:--output-file:annotation_chunks_file}; \
    class_level project rusage_mod $pack_annotations_mem

# One GMT per library (library_gmts/<library>.gmt): each library's betas fit reads only its own gene sets.
short cmd genesets_library_gmts_cmd=$helper_cmd library-gmts \
    !{input:--annotations-gmt-file:annotations_gmt_file} \
    !{input:--gene-set-index-file:gene_set_index_file} \
    --output-dir !{key::library_gmts_dir} \
    !{output:--output-file:library_gmts_file}; \
    class_level project rusage_mod 8000

# ----- 2. EAGGL factors ---------------------------------------------------------------------------------------------------
# EAGGL trait -> KPN.TRAIT id by exact legacy_phenotype_id; fails unless every trait has exactly one hit and the
# registry file is byte-identical to the release tag.
local cmd factors_kpn_map_cmd=$helper_cmd trait-kpn-map \
    !{input:--factor-ids-file:factor_ids_in_file} \
    !{input:--registry-file:kpn_trait_registry_file} \
    !{prop:--kpn-release:project:kpn_release} \
    !{output:--output-file:trait_kpn_map_file}; \
    class_level project

# All factors in eaggl's factors-by-genes layout (header cell Factor; values copied verbatim; the row order, that of
# factor_ids.tsv, defines the global Factor1..4037), and the factor index.
short cmd factors_assemble_cmd=$helper_cmd assemble-factors \
    !{input:--loadings-file:factor_loadings_in_file} \
    !{input:--factor-ids-file:factor_ids_in_file} \
    !{input:--factor-metadata-file:factor_metadata_in_file} \
    !{input:--genes-file:eaggl_genes_in_file} \
    !{input:--capped-entries-file:capped_entries_in_file} \
    !{input:--trait-kpn-map-file:trait_kpn_map_file} \
    !{prop:--loading-variant:project:loading_variant} \
    !{output:--output-file:all_factors_file} \
    !{output:--output-factor-index-file:factor_index_file}; \
    class_level project rusage_mod 8000

# One trait's factors: its nonzero loadings (factor_id, gene, loading; text unchanged) and its factor index (eaggl's
# Factor1..K order).
short cmd factors_trait_cmd=$helper_cmd trait-factors \
    !{input:--all-factors-file:all_factors_file} \
    !{input:--factor-index-file:factor_index_file} \
    !{prop:--trait:trait} \
    !{output:--output-file:trait_factors_file} \
    !{output:--output-factor-index-file:trait_factor_index_file}; \
    class_level trait

# ----- 3. Projection --------------------------------------------------------------------------------------------------------
# The projection kernel against the pinned eaggl (the clone is checked first): $projection_check_sample evenly spaced
# gene sets of every library plus as many with case-mapped genes, projected by eaggl and by the kernel for each of
# $projection_check_traits. Writes its report only if every %.4g loading and top factor is identical.
short cmd projection_check_cmd=$helper_cmd check-projection --python $python_cmd --pigean-src $pigean_repo_dir/src \
    --repo-dir $pigean_repo_dir --expected-pigean-commit $pigean_commit \
    !{input:--annotations-gmt-file:annotations_gmt_file} \
    !{input:--gene-set-index-file:gene_set_index_file} \
    !{input:--gene-map-file:gene_case_map_file} \
    !{input:--genes-file:eaggl_genes_in_file} \
    !{input:--indptr-file:annotation_indptr_file} \
    !{input:--indices-file:annotation_indices_file} \
    !{input:--all-factors-file:all_factors_file} \
    !{input:--factor-index-file:factor_index_file} \
    --traits $projection_check_traits --sample-per-library $projection_check_sample --seed $projection_seed \
    --work-dir !{key::projection_check_dir} \
    !{output:--output-file:projection_check_file}; \
    class_level project rusage_mod $projection_check_mem

# One trait's projection from the packed gene sets, chunk by chunk (projection_kernel.py), then ranked. Needs the passed
# check (its eaggl commit becomes the trait's pigean_commit) and QC: K=1 joint == marginal, all genes aligned.
short cmd projection_trait_cmd=$helper_cmd project-trait \
    !{input:--check-file:projection_check_file} \
    !{input:--chunks-file:annotation_chunks_file} \
    !{input:--indptr-file:annotation_indptr_file} \
    !{input:--indices-file:annotation_indices_file} \
    !{input:--genes-file:eaggl_genes_in_file} \
    !{input:--trait-factors-file:trait_factors_file} \
    !{input:--trait-factor-index-file:trait_factor_index_file} \
    !{input:--gene-set-index-file:gene_set_index_file} \
    !{input:--trait-kpn-map-file:trait_kpn_map_file} \
    !{prop:--trait:trait} \
    !{prop:--kpn-trait-id:trait:kpn_trait_id} \
    !{prop:--loading-variant:project:loading_variant} \
    --seed $projection_seed --top-n $top_n_gene_sets \
    !{output:--output-long-file:trait_projection_long_file} \
    !{output:--output-top-file:trait_top_file} \
    !{output:--output-qc-file:trait_qc_file} \
    !{output:--output-log-file:trait_projection_log_file}; \
    class_level trait rusage_mod $trait_projection_mem

# Fan-in over all 711 traits (never run under --only: the fan-in would shrink).
short cmd projection_collect_cmd=$helper_cmd collect \
    !{input:--qc-file:trait_qc_file} \
    !{input:--top-file:trait_top_file} \
    !{input:--trait-kpn-map-file:trait_kpn_map_file} \
    --expected-pigean-commit $pigean_commit \
    !{output:--output-manifest-file:projection_manifest_file} \
    !{output:--output-top-file:top_gene_sets_file}; \
    class_level project rusage_mod 8000

# ----- 4. Gene-set betas: `pigean betas` (no outer Gibbs) on each trait's existing PIGEAN gene stats -------------------------
# PIGEAN is not rerun. The gene stats come from the all-trait export $pigean_gene_stats_file (the mouse_msigdb run the
# EAGGL factors came from): betas_gene_stats_index_cmd finds every trait's rows in one pass, and each trait reads its
# own byte range. The response is $gene_set_stats_response: log_bf (direct genetic support) or combined (adds the
# export's mouse_msigdb priors). The pigean GWAS profile sets the gene locations, the NCBI37.3 gene universe and portal
# gene map, the p < 0.01 prefilter and the 5,000-gene-set cap.
short cmd betas_gene_stats_index_cmd=$helper_cmd gene-stats-index --gene-stats-file $pigean_gene_stats_file \
    !{input:--trait-kpn-map-file:trait_kpn_map_file} \
    !{output:--output-file:pigean_gene_stats_index_file}; \
    class_level project

short cmd betas_trait_gene_stats_cmd=$helper_cmd trait-gene-stats --gene-stats-file $pigean_gene_stats_file \
    !{input:--index-file:pigean_gene_stats_index_file} \
    !{prop:--trait:trait} \
    !{output:--output-file:trait_gene_stats_file}; \
    class_level trait

# One pigean fit per library, each on that library's GMT alone, for every library except $lincs_libraries (a minute or
# two per trait); then the gene sets PIGEAN analyzed, ranked by beta_uncorrected within their library. The fits are
# resumable per library (pigean's own files are in betas/).
short cmd betas_trait_cmd=$helper_cmd betas-trait $betas_trait_args \
    --libraries $cfde_libraries --exclude-libraries $lincs_libraries \
    !{input:--library-gmts-file:library_gmts_file} \
    !{input:--gene-stats-file:trait_gene_stats_file} \
    !{input:--gene-set-index-file:gene_set_index_file} \
    !{input:--trait-kpn-map-file:trait_kpn_map_file} \
    !{prop:--trait:trait} \
    !{prop:--kpn-trait-id:trait:kpn_trait_id} \
    --work-dir !{key::trait_betas_dir} \
    !{output:--output-runs-file:trait_betas_runs_file} \
    !{output:--output-all-file:trait_betas_all_file} \
    !{output:--output-file:trait_gene_set_stats_file}; \
    class_level trait rusage_mod $gene_set_stats_mem

# Fan-in over all 711 traits (never run under --only): every trait has one run per library, at the pinned commit.
short cmd betas_collect_cmd=$helper_cmd betas-collect \
    !{input:--runs-file:trait_betas_runs_file} \
    !{input:--trait-kpn-map-file:trait_kpn_map_file} \
    --libraries $cfde_libraries --exclude-libraries $lincs_libraries \
    --expected-pigean-commit $pigean_commit \
    !{output:--output-file:betas_manifest_file}; \
    class_level project

# ----- Optional: LINCS betas (not part of a full run: run it with --only-cmd '^lincs_') ----------------------------------------
# The same pigean fit on LINCS alone (~1.5M signatures), keeping at most $gene_set_stats_max_initial of them (the most
# significant) before pigean's pruning and betas. Each takes ~30 min, nearly all of it reading the signatures. Not read
# by the release build.
cmd lincs_trait_betas_cmd=$helper_cmd betas-trait $betas_trait_args --libraries $lincs_libraries \
    !{input:--library-gmts-file:library_gmts_file} \
    !{input:--gene-stats-file:trait_gene_stats_file} \
    !{input:--gene-set-index-file:gene_set_index_file} \
    !{input:--trait-kpn-map-file:trait_kpn_map_file} \
    !{prop:--trait:trait} \
    !{prop:--kpn-trait-id:trait:kpn_trait_id} \
    --work-dir !{key::trait_betas_dir} \
    !{output:--output-runs-file:trait_lincs_runs_file} \
    !{output:--output-file:trait_lincs_betas_file}; \
    class_level trait rusage_mod $lincs_betas_mem

# ----- Audit portal (scripts/factor_portal; ../README.md "Audit portal") -------------------------------------------------------
# build reads the outputs a reviewer needs into one SQLite: every factor's nonzero EAGGL gene loadings, its top gene
# sets with their member-gene overlap, and (from the 711 long files) each top gene set's loadings on all of the trait's
# factors. It refuses to write the database unless every marginal loading recomputed from the gene loadings
# (sum of w_g over the members / w'w) equals the projection's within %.4g rounding. Fan-in over all traits: never run
# under --only. export-audit flattens the audit columns; the static page calls a portal server you start yourself.
short cmd portal_build_db_cmd=$portal_cmd !{output:--log-file:portal_build_log_file} build !{prop:--project:project} \
    !{input:--trait-kpn-map-file:trait_kpn_map_file} \
    !{input:--kpn-trait-flat-file:kpn_trait_flat_file} \
    !{input:--projection-manifest-file:projection_manifest_file} \
    !{input:--factor-index-file:factor_index_file} \
    !{input:--factor-metadata-file:factor_metadata_in_file} \
    !{input:--all-factors-file:all_factors_file} \
    !{input:--cfde-index-file:cfde_index_file} \
    !{input:--gene-set-index-file:gene_set_index_file} \
    !{input:--annotations-gmt-file:annotations_gmt_file} \
    !{input:--gene-map-file:gene_case_map_file} \
    !{input:--top-gene-sets-file:top_gene_sets_file} \
    !{input:--long-file:trait_projection_long_file} \
    --top-n $top_n_gene_sets \
    !{output:--output-db:portal_db_file}; \
    class_level project rusage_mod $portal_build_mem

local cmd portal_export_audit_cmd=$portal_cmd export-audit \
    !{input:--db:portal_db_file} \
    !{output:--output-factor-audit-file:portal_factor_audit_file} \
    !{output:--output-gene-set-audit-file:portal_gene_set_audit_file}; \
    class_level project

local cmd portal_build_html_cmd=$portal_cmd html \
    !{input:--db:portal_db_file} \
    --api-url $portal_api_url \
    --title "$portal_title" \
    !{output:--output-html:portal_html_file}; \
    class_level project

# ----- Reference release (services/backend/src/reveal_backend/reference_release.py; ../README.md) ------------------------------
# Pure files: reads the LAP outputs, the per-trait projections (per-library ranks), the per-trait gene-set betas, the
# collection YAMLs and the vector cache (factor labels and DisMech contexts; gene sets are not embedded); only factor
# labels missing from the cache are embedded (EMBEDDING_SERVICE_URL from $reveal_repo_dir/.env). The folder is swapped
# into release_files_dir; the JSON result is written only on success. A fan-in over all 711 traits: never run under
# --only. Publishing is a separate command, run by hand. A cluster job: the 1.5M gene sets' index rows stay in memory
# and the collection documents (9 GB of YAML) are read one at a time on $release_build_workers workers.
cmd release_build_cmd=$reveal_python -B -m reveal_backend.reference_release build \
    --lap-project-dir !{key::project_dir} !{prop:--kpn-release:project:kpn_release} \
    !{input:--long-file:trait_projection_long_file} \
    !{input:--gene-set-stats-file:trait_gene_set_stats_file} \
    !{input:trait_kpn_map_file} !{input:factor_index_file} !{input:factor_metadata_in_file} !{input:all_factors_file} \
    !{input:gene_set_index_file} !{input:cfde_index_file} !{input:kpn_trait_registry_file} !{input:kpn_trait_flat_file} \
    !{input:projection_manifest_file} \
    !{input:cfde_collection_yaml_file} \
    --vector-cache $reference_vector_cache \
    --top-n $top_n_gene_sets --workers $release_build_workers --out !{key::release_files_dir} \
    | tee !{output::release_result_file}.part && mv !{output::release_result_file}.part !{output::release_result_file}; \
    class_level project rusage_mod $release_build_mem

#=======================================================================================================================
# CONFIGURATION

lap_trunk=$lap_home/trunk
!include $lap_trunk/config/common.cfg

# eaggl and pigean run from a pinned clone of packages/pigean (not the development checkout), created once with
#   git clone --no-checkout /humgen/diabetes2/users/chase/packages/pigean raw/pigean_ca59661
#   git -C raw/pigean_ca59661 checkout --detach ca59661644dc9ead429fc7e59050870ba49b26e8
# The projection check and every pigean job first check that the clone is at $pigean_commit with a clean src/, and
# the projection, the betas and the collects reject any other commit. There is no installed eaggl or pigean entry
# point, so they run from src/ with the pigean project's venv (Python 3.9), which also runs the helpers (numpy and
# scipy for the projection). One BLAS thread per job to match the single UGER slot.
pigean_commit=ca59661644dc9ead429fc7e59050870ba49b26e8
pigean_repo_dir=$base_dir/raw/pigean_ca59661
python_cmd=/humgen/diabetes2/users/chase/projects/pigean/.venv/bin/python
helper_cmd=env PYTHONDONTWRITEBYTECODE=1 OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 $python_cmd -B $base_dir/scripts/projection_workflow.py

# Gene-set betas: pigean betas mode from the same pinned clone ($pigean_gene_stats_file is a meta key), one fit per
# library. Each fit keeps at most $gene_set_stats_max_initial of its library's gene sets (pigean
# --max-num-gene-sets-initial: the most significant by nominal p, before pruning, the hyperparameters and the betas; at
# most 5,000 are analyzed in the end). The 8 libraries besides LINCS (~20,600 gene sets) take 1-2 min per trait and
# under 1 GB (RummaGEO 30 s, GTEx 7 s), and never reach the cap. LINCS does: its p < 0.01 prefilter keeps 50,000 to
# 427,000 of the 1.5M signatures depending on the trait, and uncapped fits took 40 min to 2.3 h and up to 160 GB.
pigean_profile=$pigean_repo_dir/config/profiles/gwas.default.json
gene_set_stats_response=log_bf
gene_set_stats_max_initial=20000
betas_trait_args=--python $python_cmd --pigean-src $pigean_repo_dir/src --repo-dir $pigean_repo_dir --expected-pigean-commit $pigean_commit --profile $pigean_profile --response $gene_set_stats_response --seed $projection_seed --max-num-gene-sets-initial $gene_set_stats_max_initial
lincs_libraries=LINCS_L1000
gene_set_stats_mem=4000
lincs_betas_mem=24000

# The joint solve starts from random H; a fixed seed makes every run reproducible.
projection_seed=1
top_n_gene_sets=50

# Audit portal: stdlib only, so it runs on the helpers' Python. The page calls a server you start yourself (in tmux):
#   env PYTHONPATH=$base_dir/scripts $python_cmd -m factor_portal serve --db <portal_dir>/<project>.portal.sqlite --port 8766
# then open http://localhost:8766/ (or the static page) through an SSH tunnel to that port. The full build reads all
# 711 long files (~8 of ~11 min) and peaked at 0.7 GB on the 2026-09-28 projection.
portal_cmd=env PYTHONPATH=$base_dir/scripts PYTHONDONTWRITEBYTECODE=1 $python_cmd -B -m factor_portal
portal_api_url=http://localhost:8766
portal_title=EAGGL x CFDE projection audit
portal_build_mem=4000

# Projection chunks: each is one eaggl run (its own random start and stopping rule), as in the per-chunk eaggl runs
# this replaces. On the full pool the pack took 3 min and 1.6 GB (366M memberships, a 1.5 GB .npy); the check (1,966
# gene sets, eaggl itself on each of three traits) 2.5 min and 1.1 GB; T2D's projection (K=13, mapping the pack) 60 s
# and 3 GB.
projection_chunk_gene_sets=20000
pack_annotations_mem=8000
projection_check_traits=T2D,2hrG,Ap-LM
projection_check_sample=200
projection_check_mem=8000
trait_projection_mem=8000

# On UGER, common.cfg's max_sge_batch=1000 submits every ready command of a key as one array job
# (-tc 1000), and max_jobs counts an array as a single job, so nothing would cap the 711 per-trait
# jobs. Without arrays, max_jobs caps the number of running tasks. Long jobs (the optional LINCS betas, ~30 min each)
# may hold at most max_long_jobs of them, so the short per-trait jobs (a minute or two each) always have slots.
max_sge_batch=1
max_jobs=80
max_long_jobs=50
max_short_jobs=80
default_mem=4000
bsub_opts=-pe smp 1 -l os=RedHat8

# Reference release: runs on the backend's own Python >= 3.11 venv ($reveal_repo_dir is a meta key,
# scripts/build_meta_yaml.py). Only factor labels and DisMech contexts are embedded; gene sets are not. The vector cache (factor-label and DisMech context vectors keyed by the sha256 of
# their text) is seeded once from Aurora with `scripts/reference_migration.py export-vectors` and lives in raw/.
reveal_python=$reveal_repo_dir/services/backend/.venv/bin/python
reference_vector_cache=$base_dir/raw/reference_vector_cache.sqlite
release_build_workers=4
release_build_mem=32000
