    files:
      - pattern: '^ARCHS4_IDG_Coexp\.gmt$'
        url: https://maayanlab.cloud/Enrichr/geneSetLibrary?mode=text&libraryName=ARCHS4_IDG_Coexp

  amp_ad_differential_expression:
    name: AMP-AD harmonized RNA-seq differential expression summary (Synapse syn14237651)
    description: >-
      The differential expression summary table of the AMP-AD cross-study harmonized RNA-seq analysis
      (differentialExpressionSummary.tsv), distributed through the AD Knowledge Portal on Synapse. The CFDE
      AMP-AD gene sets were extracted from this table.
    alternate_identifier:
      - syn14237651
    publisher: sage_bionetworks        # operates Synapse and the AD Knowledge Portal
    attributed_to: [amp_ad_consortium]
    location: https://www.synapse.org/Synapse:syn14237651
    files:
      - pattern: '^differentialExpressionSummary\.tsv$'
        location: 'synapse\.org/Synapse:syn14237651'

  ncbi_geo_series:
    name: NCBI Gene Expression Omnibus (GEO) series records and NCBI-generated RNA-seq counts
    description: >-
      Gene Expression Omnibus series (GSE) used by the CFDE GEO bulk RNA-seq gene sets: each series' MINiML
      family record and supplementary files from the GEO FTP site, and the NCBI-generated raw count matrices
      and gene annotation table from the GEO RNA-seq counts download service. One Dataset stands for the
      resource; each File's location names its series accession.
    alternate_identifier:
      - https://www.ncbi.nlm.nih.gov/geo/
    publisher: ncbi
    location: https://www.ncbi.nlm.nih.gov/geo/
    files:
      - location: '^https://ftp\.ncbi\.nlm\.nih\.gov/geo/series/'
      - location: '^https://www\.ncbi\.nlm\.nih\.gov/geo/download/'

  glygen_glycan_api:
    program: glygen_consortium
    name: GlyGen glycan detail records (GlyGen API)
    description: >-
      Per-glycan detail records returned by the GlyGen API (api.glygen.org/glycan/detail/<GlyTouCan
      accession>), read by the extractor for the glycans named in the GlyGen release tables. No release
      version is recorded with these responses.
    alternate_identifier:
      - https://api.glygen.org/
    publisher: gwu
    attributed_to: [glygen_consortium]
    location: https://api.glygen.org/glycan/detail/
    files:
      - location: '^https://api\.glygen\.org/glycan/detail/'

  igvf_data_portal:
    name: IGVF Data Portal tabular files
    description: >-
      Tabular analysis files of the Impact of Genomic Variation on Function Consortium, downloaded from the
      IGVF Data Portal (data.igvf.org/tabular-files/<IGVFFI accession>). Each File's name and location carry
      its IGVFFI accession.
    alternate_identifier:
      - https://data.igvf.org/
    publisher: stanford                # hosts the IGVF Data and Administrative Coordinating Center portal
    attributed_to: [igvf_consortium]
    location: https://data.igvf.org/
    files:
      - location: '^https://data\.igvf\.org/tabular-files/'

  immport_sdy1299:
    name: ImmPort study SDY1299 RNA sequencing result files
    description: >-
      RNA sequencing result files of ImmPort shared study SDY1299 (DESeq differential expression tables),
      from the study's ResultFiles on ImmPort.
    alternate_identifier:
      - SDY1299
    publisher: niaid                   # ImmPort is funded and overseen by NIAID DAIT
    location: https://www.immport.org/shared/study/SDY1299
    files:
      - location: '^https://www\.immport\.org/shared/study/SDY1299(#|/|$)'

  immport_sdy2948:
    name: ImmPort study SDY2948 RNA sequencing result files
    description: >-
      RNA sequencing result files of ImmPort shared study SDY2948 (HTSeq count matrix, also GEO series
      GSE207214), from the study's ResultFiles on ImmPort.
    alternate_identifier:
      - SDY2948
      - GSE207214
    publisher: niaid
    location: https://www.immport.org/shared/study/SDY2948
    files:
      - location: '^https://www\.immport\.org/shared/study/SDY2948(#|/|$)'

  kpmp_kidney_tissue_atlas:
    name: KPMP Kidney Tissue Atlas repository files (single-cell transcriptomics)
    description: >-
      Per-participant single-cell and single-nucleus transcriptomics expression matrices and their metadata
      workbooks, downloaded from the Kidney Precision Medicine Project's Kidney Tissue Atlas data repository
      (atlas.kpmp.org/api/v1/file/download/<package id>/<file>).
    alternate_identifier:
      - https://atlas.kpmp.org/repository
    publisher: kpmp_consortium
    location: https://atlas.kpmp.org/repository
    files:
      - location: '^https://atlas\.kpmp\.org/api/v1/file/download/'

  psychencode_derived_dex_coexp:
    name: PsychENCODE integrative analysis derived data (differential expression and co-expression modules)
    description: >-
      Derived data files of the PsychENCODE Consortium's integrative analysis, from the PsychENCODE resource
      site: DER-13 (disorder differentially expressed genes) and DER-16 (disorder gene co-expression modules).
    alternate_identifier:
      - DER-13
      - DER-16
      - http://resource.psychencode.org/
    publisher: psychencode_consortium
    location: http://resource.psychencode.org/Datasets/Derived/DEXgenes_CoExp/
    files:
      - location: '^http://resource\.psychencode\.org/Datasets/Derived/'

# Which datasets a library's root files may come from.
libraries:
  GTEx: [gtex_v8, ncbi_gene_info_human]
  MoTrPAC: [motrpac_pass1b_dea, motrpac_pass1b_counts, harmonizome_mapping_2017]
  HuBMAP: [hubmap_asctb_v2_2, ncbi_gene_info_human]
  LINCS_L1000: [lincs_l1000_consensus_2020, harmonizome_mapping_2017]
  GaultonLab: [gaulton_liana_ccc]
  GlyGen: [glygen_v1_12_1, glygen_glycan_api]
  IDG: [enrichr_idg_drug_targets_2022, enrichr_archs4_idg_coexp]
  IMPC: [impc_release_18, harmonizome_mapping_2017]
  MetabolomicsWorkbench: [harmonizome_mw_metabolites]
  RummaGEO: [rummageo_2_5, ncbi_gene_info_human, ncbi_gene_mouse_and_orthologs]
  AMP_AD: [amp_ad_differential_expression]
  GEO_BULK: [ncbi_geo_series]
  IGVF: [igvf_data_portal]
  ImmPort: [immport_sdy1299, immport_sdy2948]
  KPMP_KTA: [kpmp_kidney_tissue_atlas]
  PsychENCODE: [psychencode_derived_dex_coexp]

# Root files that are the extractor's own workflow artefacts (written by a step whose Activity the document
# does not record), not source data. They get no Dataset link and are not reported as unmatched.
ignore:
  - location: '^s3://dig-gene-set-data/.*/workflow/(selection/)?(selection_manifest\.tsv|source_manifest\.json)$'
