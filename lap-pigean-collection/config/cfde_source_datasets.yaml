# Public source datasets (the resources, e.g. GTEx V8) and the organizations behind them, for the CFDE
# gene-set libraries of the cfde-genesets collection.
#
# scripts/cfde_sources.py reads the root input Files of every geneset.provenance.dapper.yaml (the Files an
# Activity used and no Activity generated), matches them against the `files` rules below, and writes one
# DAPPER document, sources/cfde_sources.dapper.yaml:
#   - an Organization node per organization used,
#   - a Dataset node per dataset used,
#   - a was_derived_from edge from each matched root File to its Dataset,
#   - a was_derived_from edge from each GeneSetCollection to the source Datasets of its document
#     (datasets marked `reference: true`, such as gene-annotation tables, are left out of these).
# So a gene set's provenance ends at an object for the resource, not at a bare file URL.
#
# organizations: become DAPPER `Organization` nodes (name + optional ROR CURIE). Datasets reference them by
#   key in `publisher` (-> Dataset.publisher, who distributes it) and `attributed_to` (-> was_attributed_to,
#   the data producer when it differs). An organization with `cfde_program` is a Common Fund Data Ecosystem
#   program: `cfde_program` is its key in, and `name` and `url` are copied from, the CFDE Knowledge Center's
#   program list (https://cfdeknowledge.org/r/kc_programs, read 2026-11-28). `cfde_page` is the program's
#   page in the CFDE Workbench (https://cfde.cloud/data/matrix, read 2026-11-28), which lists its DCC portal,
#   its NIH Common Fund page and its CFDE assets. The Organization class has no slot for a URL, so
#   `cfde_program`, `cfde_page` and `url` are not on the Organization node; `cfde_page` is written into the
#   description of each of the program's Datasets ("CFDE program: <name> (<cfde_page>).").
# datasets: DAPPER `Dataset` nodes (name, description, version, alternate_identifier, location, publisher,
#   was_attributed_to). A `files` rule matches a root file by `pattern` (regex on the file name) and/or
#   `location` (regex on the File's location); both must match when both are given. `url` and `note` are
#   documentation only. `reference: true` marks an auxiliary reference table. `program` names the CFDE
#   program the dataset belongs to (an organization key with `cfde_program`); it is put first in
#   was_attributed_to, so every gene set of that program's library reaches the program's Organization.
#   Libraries whose source is not a CFDE program on either list (AMP_AD, GEO_BULK, IGVF, ImmPort, KPMP_KTA,
#   PsychENCODE, RummaGEO) have no `program`. IMPC's is KOMP2, which only the CFDE Workbench lists.
# libraries: which datasets a library's root files may come from (rules are only tried for these).
# ignore: root files that are the extractor's own workflow artefacts, not source data.
#
# Review status. Entries from the first registry (pigean/raw/cfde_source_datasets.yaml, 2026-09-28) had
# their ROR ids and public URLs checked then. Entries marked `# DRAFT 2026-11-27` were written from the
# file locations recorded in the provenance documents and need a curator's review of name, description,
# version, publisher and attribution. ROR ids on them were checked against api.ror.org on 2026-11-27.

organizations: become DAPPER `Organization` nodes (name + optional ROR CURIE; ROR ids verified against
#   api.ror.org on 2026-09-28). Datasets reference them by key in `publisher` (-> Dataset.publisher) and
#   `attributed_to` (-> was_attributed_to, the data producer when it differs from the distributor).
# datasets: DAPPER `Dataset` nodes (hashable: name, description, version, alternate_identifier, publisher,
#   was_attributed_to; unhashable: location). `files` map root file names (regex) to a public `url` where one
#   is known; the url and note go into the raw File's description. Where a note says byte-identical, the public
#   object's md5 equals the md5 recorded in the provenance graph.
# libraries: which datasets a library's root files may come from (patterns are only tried for these).
#
# Root files that match no pattern are still written as File nodes (with their S3 copy as location) but carry
# no dataset link; annotate warns about them so this registry can be extended.

