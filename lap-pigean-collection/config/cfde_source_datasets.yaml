    program: idg_consortium
    name: Enrichr library ARCHS4_IDG_Coexp
    description: >-
      The Enrichr gene-set library "ARCHS4_IDG_Coexp" (Ma'ayan Laboratory): genes co-expressed in ARCHS4
      with the understudied targets of the Illuminating the Druggable Genome program, served by the Enrichr
      geneSetLibrary API and imported by the extractor.
    alternate_identifier:
      - https://maayanlab.cloud/Enrichr/#libraries
    publisher: mount_sinai
    attributed_to: [maayan_lab, idg_consortium]
