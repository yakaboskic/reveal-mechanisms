    alternate_identifier:
      - https://rummageo.com/
    publisher: mount_sinai
    attributed_to: [maayan_lab]
    location: https://minio.dev.maayanlab.cloud/rummageo/2.5/
    files:
      - pattern: '^human-geo-auto\.gmt\.gz$'
        url: https://minio.dev.maayanlab.cloud/rummageo/2.5/human-geo-auto.gmt.gz
        note: public size 536171815 bytes matches the extractor's copy (checked 2026-10-05)
      - pattern: '^mouse-geo-auto\.gmt\.gz$'
        url: https://minio.dev.maayanlab.cloud/rummageo/2.5/mouse-geo-auto.gmt.gz

