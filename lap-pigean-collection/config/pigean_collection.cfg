!title PIGEAN claims collection (portal run + CFDE gene-set betas)

# Builds the file layout of a claims-repository collection from one PIGEAN portal run and the CFDE gene sets:
#   data/<library>/<trait>/combined_gene_stats.json        one row per gene               (the PIGEAN run's library only)
#   data/<library>/<trait>/combined_gene_set_stats.json    one row per gene set
#   data/<library>/<trait>/gene_gene_set_stats.json        one row per (gene, gene set)
# Uncompressed NDJSON, `phenotype` and `gene_set_size` on every row (claims-repository
# docs/publishing-a-pigean-run.md). It is separate from ../lap (the CFDE projection onto EAGGL factors) and shares
# nothing with it but the pinned pigean commit.
#
# The stages, in run order (command keys are prefixed by stage):
#   1. source_    download the PIGEAN run's gs.out, gss.out and ggss.out for every trait (head node: needs S3)
#   2. genesets_  one GMT per CFDE library and the gene-set index, from the local mirror of the CFDE release
#   3. betas_     per trait: `pigean betas` of the run's gene stats on each CFDE library
#   4. format_    per trait: the collection's NDJSON files, one folder per library
#   5. collect_   fan-in: the file manifest, the betas manifest and the run record
#   6. provenance_ per trait: a DAPPER provenance document (the portal run, each betas fit, the formatting step and
#                 every file they read and wrote) and the raw betas outputs; then one merged, validated document
#   7. cfde_      the CFDE gene-set collection as a folder: the release's GMTs with their producer DAPPER documents,
#                 the library GMTs and the gene-set index
#   8. deposit_   upload both collections to s3://$release_bucket/ (head node; run by hand, never part of a full run)
#
# PIGEAN is not rerun. The source library's rows (mouse_msigdb) are the run's own. Each CFDE library's gene-set betas
# regress the run's direct support (log_bf) on that library's gene sets with `python -m pigean betas` (no outer Gibbs),
# one library at a time: each gets its own prior p, prefilter and 5,000-gene-set cap. A CFDE library has no gene file,
# because its fit produces no gene scores: the trait's gene scores are in the source library's dataset.
#
# The meta is generated, never hand-edited:
#   python3 scripts/build_meta_yaml.py
#   PYTHONPATH=/humgen/diabetes2/users/chase/packages/meta-sanity python3 -m meta_sanity.generate_meta \
#       config/pigean_collection.meta.yaml config/pigean_collection.meta
# Run sequence, checks and output schema: ../README.md

lap_home=/humgen/diabetes/users/chase/lap

#=======================================================================================================================
# CLASSES
#   project
#   +-- trait -> project    (one PIGEAN trait; instance name = the trait key with shell characters replaced by _;
#                            the key itself, which names the folders, is in the traits table)

class project=Project
class trait=Trait parent project

#=======================================================================================================================
# DIRECTORIES

sortable mkdir path projects_dir=$unix_out_dir/projects
sortable mkdir path project_dir=$projects_dir/@project class_level project
sortable mkdir path library_gmts_dir=$project_dir/library_gmts class_level project
sortable mkdir path collection_dir=$project_dir/collection class_level project
sortable mkdir path collection_data_dir=$collection_dir/data class_level project
sortable mkdir path collection_run_dir=$collection_dir/run class_level project
sortable mkdir path collection_provenance_dir=$collection_dir/provenance class_level project
sortable mkdir path cfde_collection_dir=$project_dir/cfde_collection class_level project
sortable mkdir path traits_dir=$project_dir/traits class_level project
sortable mkdir path trait_dir=$traits_dir/@trait class_level trait
sortable mkdir path trait_betas_dir=$trait_dir/betas class_level trait

#=======================================================================================================================
# CATEGORIES

cat project_input_cat=null disp "Linked inputs" class_level project
cat source_cat=null disp "1. PIGEAN run (downloaded)" class_level project
cat genesets_cat=null disp "2. CFDE gene sets" class_level project
cat collect_cat=null disp "5. Collection (all traits)" class_level project
cat provenance_cat=null disp "6. DAPPER provenance (all traits)" class_level project
cat cfde_cat=null disp "7. CFDE gene-set collection" class_level project
cat deposit_cat=null disp "8. Deposit" class_level project
cat trait_betas_cat=null disp "3. Trait gene-set betas (pigean betas, one fit per CFDE library)" class_level trait
cat trait_format_cat=null disp "4. Trait collection files" class_level trait
cat trait_provenance_cat=null disp "6. Trait DAPPER provenance" class_level trait

#=======================================================================================================================
# FILES

# --- project level: linked input (set in the meta, symlinked by --init) ---
table path file traits_in_file=@project.traits.tsv dir project_dir disp "Traits of the PIGEAN run (instance, trait key, S3 sizes and ETags)" parent project_input_cat class_level project

# --- 1. source ---
table path file source_manifest_file=@project.source_manifest.tsv dir project_dir disp "Downloaded PIGEAN files (size, sha256)" parent source_cat class_level project

# --- 2. gene sets ---
table path file library_gmts_file=@project.library_gmts.tsv dir project_dir disp "One GMT per CFDE library (files in library_gmts/)" parent genesets_cat class_level project
table path file gene_set_index_file=@project.gene_set_index.tsv dir project_dir disp "Gene-set index (id, name, collection, label, library, size)" parent genesets_cat class_level project

# --- 3 and 4. trait level ---
table path file trait_gene_stats_file=@trait.gene_stats.tsv dir trait_dir disp "PIGEAN gene stats as the betas read them (gene, combined, log_bf, prior)" parent trait_betas_cat class_level trait
table path file trait_betas_runs_file=@trait.betas_runs.tsv dir trait_dir disp "pigean fits, one per library (status, kept, p, sigma2; pigean's files in betas/)" parent trait_betas_cat class_level trait
table path file trait_collection_files_file=@trait.collection_files.tsv dir trait_dir disp "The trait's collection files (library, kind, rows, size, sha256)" parent trait_format_cat class_level trait

# --- 5. collection ---
table path file collection_manifest_file=@project.collection_manifest.tsv dir collection_run_dir disp "Every file of the collection (rows, size, sha256)" parent collect_cat class_level project
table path file betas_manifest_file=@project.betas_manifest.tsv dir collection_run_dir disp "Betas runs, all traits x libraries" parent collect_cat class_level project
path file run_record_file=@project.run.json dir collection_run_dir disp "Run record (source run, pigean commit and command, GMT checksums)" parent collect_cat class_level project

# --- 6. provenance ---
path file trait_provenance_file=@trait.dapper.yaml dir collection_provenance_dir disp "DAPPER provenance of the trait's collection files" parent trait_provenance_cat class_level trait
table path file trait_provenance_files_file=@trait.provenance_files.tsv dir trait_dir disp "The trait's provenance document and raw betas files (size, sha256)" parent trait_provenance_cat class_level trait
path file provenance_merged_file=@project.provenance.dapper.json dir collection_provenance_dir disp "DAPPER provenance, all traits merged (the full graph)" parent provenance_cat class_level project
path file provenance_collection_file=@project.collection.dapper.json dir collection_provenance_dir disp "DAPPER provenance for the collection's source.yaml (collection files and their generating Activities)" parent provenance_cat class_level project
table path file provenance_manifest_file=@project.provenance_manifest.tsv dir collection_run_dir disp "Provenance documents and raw betas files (size, sha256)" parent provenance_cat class_level project

# --- 7. CFDE gene-set collection ---
table path file cfde_manifest_file=@project.cfde_manifest.tsv dir project_dir disp "Every file of the CFDE gene-set collection (role, library, size, sha256)" parent cfde_cat class_level project
table path file cfde_gmt_sidecars_file=@project.cfde_gmt_sidecars.tsv dir project_dir disp "DAPPER provenance sidecars of the library GMTs (size, sha256)" parent provenance_cat class_level project
path file cfde_record_file=@project.cfde_collection.json dir project_dir disp "CFDE gene-set collection record (release, libraries, counts, layout)" parent cfde_cat class_level project

# --- 8. deposit ---
path file deposit_plan_file=@project.deposit_plan.json dir project_dir disp "PIGEAN collection deposit plan (dry run)" parent deposit_cat class_level project
path file deposit_result_file=@project.deposit.json dir project_dir disp "PIGEAN collection deposit result" parent deposit_cat class_level project
path file cfde_deposit_plan_file=@project.cfde_deposit_plan.json dir project_dir disp "CFDE gene-set collection deposit plan (dry run)" parent deposit_cat class_level project
path file cfde_deposit_result_file=@project.cfde_deposit.json dir project_dir disp "CFDE gene-set collection deposit result" parent deposit_cat class_level project

#=======================================================================================================================
# COMMANDS

# ----- 1. The PIGEAN run -----------------------------------------------------------------------------------------------
# aws s3 sync of the three files per trait into $source_dir (resumable), then every file's size (and MD5, when its
# ETag is one) against the traits table. Local: needs S3.
local cmd source_fetch_cmd=$helper_cmd source-fetch --source-url $source_url --source-library $source_library \
    !{input:--traits-file:traits_in_file} \
    --source-dir $source_dir \
    !{output:--output-file:source_manifest_file}; \
    class_level project

# ----- 2. CFDE gene sets ----------------------------------------------------------------------------------------------
# One GMT per library ($cfde_libraries, a meta key: the mirror's libraries minus the excluded) with blank descriptions,
# and the index that names each dapper:GeneSet id.
short cmd genesets_build_cmd=$helper_cmd genesets-build --libraries $cfde_libraries --cfde-dir $cfde_dir \
    --output-dir !{key::library_gmts_dir} \
    !{output:--output-index-file:gene_set_index_file} \
    !{output:--output-file:library_gmts_file}; \
    class_level project

# ----- 3. Gene-set betas ----------------------------------------------------------------------------------------------
# One pigean fit per library, each on that library's GMT alone. Resumable per library (pigean's files are in betas/).
short cmd betas_trait_cmd=$helper_cmd betas-trait $betas_args \
    --python $python_cmd --pigean-src $pigean_repo_dir/src --repo-dir $pigean_repo_dir \
    --libraries $cfde_libraries \
    !{prop:--instance:trait} \
    !{input:--traits-file:traits_in_file} \
    !{input:--source-manifest-file:source_manifest_file} \
    --source-dir $source_dir --source-library $source_library \
    !{input:--library-gmts-file:library_gmts_file} \
    --work-dir !{key::trait_betas_dir} \
    !{output:--output-gene-stats-file:trait_gene_stats_file} \
    !{output:--output-runs-file:trait_betas_runs_file}; \
    class_level trait rusage_mod $betas_mem

# ----- 4. Collection files --------------------------------------------------------------------------------------------
short cmd format_trait_cmd=$helper_cmd format-trait --expected-pigean-commit $pigean_commit \
    !{prop:--instance:trait} \
    !{input:--traits-file:traits_in_file} \
    --source-dir $source_dir --source-library $source_library --trait-group $trait_group \
    !{input:--runs-file:trait_betas_runs_file} \
    !{input:--gene-set-index-file:gene_set_index_file} \
    !{input:--library-gmts-file:library_gmts_file} \
    --output-dir !{key::collection_data_dir} \
    !{output:--output-file:trait_collection_files_file}; \
    class_level trait rusage_mod $format_mem

# ----- 5. Collect (fan-in over all traits: never run under --only) -------------------------------------------------------
short cmd collect_cmd=$helper_cmd collect $betas_args --libraries $cfde_libraries \
    !{input:--traits-file:traits_in_file} \
    !{input:--files-file:trait_collection_files_file} \
    !{input:--runs-file:trait_betas_runs_file} \
    !{input:--library-gmts-file:library_gmts_file} \
    --data-dir !{key::collection_data_dir} \
    --source-url $source_url --source-library $source_library --cfde-snapshot $cfde_snapshot --verify-sha256 \
    !{output:--output-files-file:collection_manifest_file} \
    !{output:--output-runs-file:betas_manifest_file} \
    !{output:--output-record-file:run_record_file}; \
    class_level project rusage_mod $collect_mem

# ----- 6. DAPPER provenance ----------------------------------------------------------------------------------------------
# Per trait: <file>.dapper.yaml beside every file the pipeline wrote for it (that file's own lineage), one document
# for the whole trait (the portal run, a `pigean betas` Activity and a formatting Activity per library, and a File with
# its sha256 for everything they read and wrote), and the raw betas outputs copied to collection/betas/. Ids are
# DAPPER-ID-1 content addresses minted with the claims repository's identity module, so this stage runs on its Python.
# File locations are the deposit's, so they depend on $release_prefix and $cfde_release_prefix.
local cmd provenance_trait_cmd=$provenance_cmd trait $provenance_args $betas_args \
    !{prop:--instance:trait} \
    !{input:--traits-file:traits_in_file} \
    !{input:--source-manifest-file:source_manifest_file} \
    !{input:--runs-file:trait_betas_runs_file} \
    !{input:--files-file:trait_collection_files_file} \
    !{input:--library-gmts-file:library_gmts_file} \
    --collection-dir !{key::collection_dir} \
    --source-url $source_url --source-library $source_library --trait-group $trait_group \
    --deposit-url s3://$release_bucket/$release_prefix/ --data-url s3://$release_bucket/$release_prefix/data/ \
    !{output:--output-file:trait_provenance_file} \
    !{output:--output-files-file:trait_provenance_files_file}; \
    class_level trait

# Fan-in over all traits (never run under --only): the merged document, validated as the claims publisher validates
# one; every collection file must have a File node with its sha256 and a generating Activity.
short cmd provenance_collect_cmd=$provenance_cmd collect $provenance_args \
    !{input:--document-file:trait_provenance_file} \
    !{input:--files-file:trait_provenance_files_file} \
    !{input:--library-gmts-file:library_gmts_file} \
    !{input:--collection-manifest-file:collection_manifest_file} \
    --collection-dir !{key::collection_dir} --cfde-release-url $cfde_release_url \
    !{output:--output-file:provenance_merged_file} \
    !{output:--output-slim-file:provenance_collection_file} \
    --gmt-sidecar-root !{key::cfde_collection_dir} \
    !{output:--output-gmt-sidecars-file:cfde_gmt_sidecars_file} \
    !{output:--output-files-file:provenance_manifest_file}; \
    class_level project rusage_mod $provenance_collect_mem

# ----- 7. CFDE gene-set collection -----------------------------------------------------------------------------------------
# The gene sets the betas were fitted on, with the provenance their producer shipped: per GMT folder of the release the
# dapper-ids GMT, the producer's DAPPER document (GeneSets with members, the GeneSetCollection, Files, Activities) and
# the extractor metadata, linked from the mirror; plus the library GMTs and the gene-set index.
short cmd cfde_tree_cmd=$release_cmd cfde-tree --libraries $cfde_libraries --cfde-dir $cfde_dir \
    --cfde-snapshot $cfde_snapshot --cfde-release-url $cfde_release_url \
    !{input:--library-gmts-file:library_gmts_file} \
    !{input:--gene-set-index-file:gene_set_index_file} \
    --output-dir !{key::cfde_collection_dir} \
    !{output:--output-record-file:cfde_record_file} \
    !{output:--output-file:cfde_manifest_file}; \
    class_level project

# ----- 8. Deposit (head node; run with --only-cmd '^deposit_plan_' then '^deposit_upload_') --------------------------------
# PIGEAN collection: data/ holds the files the claims CLI reads (source.yaml: location = .../data/, path =
# {library}/{trait}/{kind}.json), betas/ the raw `pigean betas` outputs, provenance/ the DAPPER documents, run/ the
# manifests and the run record. CFDE gene-set collection: genesets/, library_gmts/, gene_set_index.tsv, run/.
# A file already on S3 is never overwritten (manifests under run/ excepted): a rerun goes to a new prefix.
pigean_deposit_args=--destination-url s3://$release_bucket/$release_prefix/ \
    --tree data/=!{key::collection_data_dir}=!{input::collection_manifest_file} \
    --tree =!{key::collection_dir}=!{input::provenance_manifest_file} \
    --file run/=!{input::collection_manifest_file} --file run/=!{input::provenance_manifest_file} \
    --file run/=!{input::betas_manifest_file} --file run/=!{input::run_record_file}
cfde_deposit_args=--destination-url s3://$release_bucket/$cfde_release_prefix/ \
    --tree =!{key::cfde_collection_dir}=!{input::cfde_manifest_file} \
    --tree =!{key::cfde_collection_dir}=!{input::cfde_gmt_sidecars_file} \
    --file run/=!{input::cfde_manifest_file} --file run/=!{input::cfde_record_file}

local cmd deposit_plan_pigean_cmd=$release_cmd deposit --dry-run $pigean_deposit_args \
    !{output:--output-file:deposit_plan_file}; \
    class_level project

local cmd deposit_plan_cfde_cmd=$release_cmd deposit --dry-run $cfde_deposit_args \
    !{output:--output-file:cfde_deposit_plan_file}; \
    class_level project

local cmd deposit_upload_pigean_cmd=$release_cmd deposit --workers $deposit_workers $pigean_deposit_args \
    !{input:--plan-file:deposit_plan_file} \
    !{output:--output-file:deposit_result_file}; \
    class_level project

local cmd deposit_upload_cfde_cmd=$release_cmd deposit --workers $deposit_workers $cfde_deposit_args \
    !{input:--plan-file:cfde_deposit_plan_file} \
    !{output:--output-file:cfde_deposit_result_file}; \
    class_level project

#=======================================================================================================================
# CONSTANTS

lap_trunk=$lap_home/trunk
!include $lap_trunk/config/common.cfg

# pigean runs from a pinned clone (not the development checkout), created once with
#   git clone --no-checkout /humgen/diabetes2/users/chase/packages/pigean raw/pigean_ca59661
#   git -C raw/pigean_ca59661 checkout --detach ca59661644dc9ead429fc7e59050870ba49b26e8
# The same commit as ../lap, so these betas are fitted by the code that fitted the reference release's. Every job
# checks the clone is at $pigean_commit with a clean src/. It runs from src/ with the pigean project's venv
# (Python 3.9), which also runs the helpers (standard library only). One BLAS thread per job.
pigean_commit=ca59661644dc9ead429fc7e59050870ba49b26e8
pigean_repo_dir=$base_dir/raw/pigean_ca59661
python_cmd=/humgen/diabetes2/users/chase/projects/pigean/.venv/bin/python
helper_cmd=env PYTHONDONTWRITEBYTECODE=1 OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 $python_cmd -B $base_dir/scripts/collection_workflow.py

# The provenance stage mints DAPPER ids with the claims repository's identity module (Python 3.12 venv).
claims_repo_dir=/humgen/diabetes2/users/chase/packages/claims-repository
claims_python=$claims_repo_dir/.venv/bin/python
provenance_cmd=env PYTHONDONTWRITEBYTECODE=1 $claims_python -B $base_dir/scripts/provenance_workflow.py
provenance_args=--claims-repo-dir $claims_repo_dir --gmt-url s3://$release_bucket/$cfde_release_prefix/library_gmts/ --cfde-snapshot $cfde_snapshot
provenance_collect_mem=8000
release_cmd=env PYTHONDONTWRITEBYTECODE=1 $python_cmd -B $base_dir/scripts/release_workflow.py
cfde_release_url=s3://dig-gene-set-data/v2.0_dapper-0.2.0-a1/

# Gene-set betas: the GWAS profile (gene locations, the NCBI37.3 gene universe, the p < 0.01 prefilter, the
# 5,000-gene-set cap), the response, and the cap on a library's gene sets before pruning.
pigean_profile=$pigean_repo_dir/config/profiles/gwas.default.json
betas_response=log_bf
betas_seed=1
betas_max_initial=20000
# The one patch the clone carries on top of $pigean_commit (apply once: git -C raw/pigean_ca59661 apply
# ../../patches/pigean_ca59661_correlation_cap.patch). pigean fits r^2 = intercept + slope * distance between genes from
# the trait's gene stats and uses it as the residual correlation of nearby genes. It does not cap the value, so a fitted
# intercept of 1 or more (about one trait in five of this run) gives correlations above 1, which pigean's own check
# then refuses ("Residual correlation must be symmetric and bounded by one"). The patch caps the correlation at 1. It
# changes nothing for a trait whose intercept is below 1. Every betas job checks the clone differs from the commit by
# exactly this file.
pigean_patch_file=$base_dir/patches/pigean_ca59661_correlation_cap.patch
betas_args=--expected-pigean-commit $pigean_commit --pigean-patch-file $pigean_patch_file --profile $pigean_profile --response $betas_response --seed $betas_seed --max-num-gene-sets-initial $betas_max_initial
betas_mem=4000
format_mem=4000
collect_mem=4000

# The claims collection's `trait_group` column.
trait_group=portal

# Where the two collections are deposited. A rerun gets a new prefix: deposited files are never overwritten.
release_bucket=kpn-opendore-releases
release_prefix=collections/pigean-cfde/2026.11
cfde_release_prefix=collections/cfde-genesets/2026.11
deposit_workers=8

# On UGER, common.cfg's max_sge_batch=1000 submits every ready command of a key as one array job, and max_jobs counts
# an array as one job, so nothing would cap the per-trait jobs. Without arrays, max_jobs caps the running tasks.
max_sge_batch=1
max_jobs=80
max_long_jobs=50
max_short_jobs=80
default_mem=4000
bsub_opts=-pe smp 1 -l os=RedHat8
